# Base PostgreSQL de développement local — jamais utilisée en production.
# Port 5433 pour ne pas entrer en conflit avec un PostgreSQL déjà installé.
name: flaix-expert
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flaix_owner
      POSTGRES_PASSWORD: flaix_owner_dev
      POSTGRES_DB: flaix
    ports:
      - "5433:5432"
    volumes:
      - flaix-pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flaix_owner -d flaix"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  flaix-pgdata:

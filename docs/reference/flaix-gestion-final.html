<title>FlaiX Expert — Les Spartiates de Marseille</title>
<style>
  :root{
    --violet:#4D04F4; --violet-soft:#EDE6FF; --violet-dim:#7B4DF9;
    --ink:#141024; --paper:#F6F4FB; --surface:#FFFFFF; --border:#E7E3F3;
    --text:#1C1730; --muted:#7A748F; --green:#0BA678; --green-soft:#E2F6EF;
    --red:#E5484D; --red-soft:#FBE7E8; --amber:#B9770E; --amber-soft:#FCF1DD;
    --track:#EDEAF6; --field:#F7F4FF; --field-border:#D9CEFB; --childbg:#FBFAFE;
    --cc:#eb6834; --cc-soft:#FDEDE6;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --violet:#8B6CFF; --violet-soft:#241C42; --violet-dim:#B7A6FF;
    --ink:#F3F1FA; --paper:#161228; --surface:#1D1836; --border:#332C55;
    --text:#F0EDF9; --muted:#9C93BE; --green:#3FDBA3; --green-soft:#173A30;
    --red:#FF8189; --red-soft:#3B1B22; --amber:#F2B84B; --amber-soft:#3A2C10;
    --track:#241E3C; --field:#251E44; --field-border:#463A72; --childbg:#221C40;
    --cc:#d95926; --cc-soft:#3A2117; } }
  :root[data-theme="dark"]{
    --violet:#8B6CFF; --violet-soft:#241C42; --violet-dim:#B7A6FF;
    --ink:#F3F1FA; --paper:#161228; --surface:#1D1836; --border:#332C55;
    --text:#F0EDF9; --muted:#9C93BE; --green:#3FDBA3; --green-soft:#173A30;
    --red:#FF8189; --red-soft:#3B1B22; --amber:#F2B84B; --amber-soft:#3A2C10;
    --track:#241E3C; --field:#251E44; --field-border:#463A72; --childbg:#221C40;
    --cc:#d95926; --cc-soft:#3A2117; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;}
  .num{font-variant-numeric:tabular-nums;}

  /* ====== Coquille SaaS : sidebar gauche + contenu, reprise du tout
     premier prototype (prototype-lexique-regles.html, 07/09) ====== */
  .shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}
  @media (max-width:860px){.shell{grid-template-columns:1fr;}}

  nav.side{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px 20px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
  @media (max-width:860px){nav.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border);}}
  nav.side .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;color:var(--violet);margin-bottom:2px;padding:4px 8px;}
  nav.side .lieu{font-size:11px;color:var(--muted);padding:0 8px 14px;border-bottom:1px solid var(--border);margin-bottom:12px;line-height:1.5;}
  nav.side a.navlink{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text);text-decoration:none;margin-bottom:2px;cursor:pointer;}
  nav.side a.navlink .ic{width:18px;text-align:center;font-size:13px;}
  nav.side a.navlink:hover{background:var(--paper);}
  nav.side a.navlink.active{background:var(--violet-soft);color:var(--violet);font-weight:700;}
  nav.side a.navlink .navcaret{margin-left:auto;font-size:10px;color:var(--muted);transition:transform .12s ease;}
  nav.side a.navlink .navcaret.open{transform:rotate(90deg);}
  nav.side .navsub{display:flex;flex-direction:column;margin:0 0 4px 14px;padding-left:13px;border-left:1px solid var(--border);}
  nav.side a.navsublink{display:block;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;cursor:pointer;}
  nav.side a.navsublink:hover{background:var(--paper);color:var(--text);}
  nav.side a.navsublink.on{background:var(--violet-soft);color:var(--violet);font-weight:700;}
  nav.side a.navsublink.off{opacity:.45;cursor:not-allowed;}
  nav.side .foot-side{margin-top:auto;padding:10px 8px 0;font-size:10.5px;color:var(--muted);border-top:1px solid var(--border);line-height:1.5;}

  main.content{padding:26px 34px 70px;max-width:1180px;}
  @media (max-width:860px){main.content{padding:20px 18px 50px;}}

  .topline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .badge-demo{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--amber-soft);color:var(--amber);margin-left:auto;}

  h1{font-family:"Raleway",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:20px;font-weight:800;letter-spacing:-.3px;margin:0;}
  h2.sec-title{font-family:"Raleway",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;font-weight:800;margin:18px 0 4px;letter-spacing:-.2px;}
  .sec-sub{font-family:"Raleway",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--muted);font-size:12.5px;margin-bottom:14px;}
  .headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .ctx{color:var(--muted);font-size:13px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
  .card strong.title{font-size:15px;display:block;margin-bottom:4px;}
  .card .hint{font-size:11.5px;color:var(--muted);margin-bottom:10px;line-height:1.55;}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
  .kpi .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;}
  .kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:4px;}
  .kpi .s.pos{color:var(--green);} .kpi .s.neg{color:var(--red);}
  .kpi .delta{font-size:12px;margin-top:4px;font-weight:700;}
  .kpi .delta.up{color:var(--green);} .kpi .delta.down{color:var(--red);}
  .legend{display:flex;gap:14px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--text);}
  .legend .sw{display:inline-flex;align-items:center;gap:6px;}
  .legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .tooltip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:7px 10px;border-radius:8px;opacity:0;transform:translate(-50%,-100%);transition:opacity .1s ease;white-space:nowrap;z-index:40;}
  :root[data-theme="dark"] .tooltip{background:#0d0a1c;}
  .tooltip.show{opacity:1;}

  .params{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:900px){.params{grid-template-columns:repeat(2,1fr);}}
  .pfield{display:flex;flex-direction:column;gap:4px;}
  .pfield label{font-size:11px;color:var(--muted);font-weight:700;}
  .pfield .u{font-size:10.5px;color:var(--muted);font-weight:400;}

  input.cell,select.cell{font:inherit;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);background:var(--field);border:1px solid var(--field-border);border-radius:8px;padding:6px 9px;text-align:right;width:100%;}
  select.cell{text-align:left;font-weight:600;}
  input.cell:focus,select.cell:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft);}
  input.sm{width:74px;}
  input.txt{text-align:left;font-weight:600;}

  table{width:100%;border-collapse:collapse;min-width:860px;}
  th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:8px 10px;font-size:13px;border-bottom:1px solid var(--paper);white-space:nowrap;}
  .r{text-align:right;}
  tr.parent{cursor:pointer;} tr.parent:hover{background:var(--paper);}
  tr.detail > td{background:var(--childbg);border-bottom:1px solid var(--border);white-space:normal;}
  .caret{display:inline-block;width:14px;color:var(--muted);font-size:10px;transition:transform .12s ease;}
  .caret.open{transform:rotate(90deg);}
  th.editcol{color:var(--violet);}

  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block;}
  .badge.ok{background:var(--green-soft);color:var(--green);}
  .badge.ko{background:var(--red-soft);color:var(--red);}
  .badge.warn{background:var(--amber-soft);color:var(--amber);}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--violet-soft);color:var(--violet);}
  .chip.grey{background:var(--track);color:var(--muted);}
  .chip.cc{background:var(--cc-soft);color:var(--cc);}
  .chip.ok{background:var(--green-soft);color:var(--green);}
  .chip.warn{background:var(--amber-soft);color:var(--amber);}
  .chip.bad{background:var(--red-soft);color:var(--red);}
  .chip.vio{background:var(--violet-soft);color:var(--violet);}

  .wf{font-size:12.5px;}
  .wf .l{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--border);}
  .wf .l:last-child{border-bottom:none;}
  .wf .l.tot{font-weight:800;border-top:2px solid var(--border);border-bottom:none;margin-top:4px;padding-top:8px;}
  .wf .neg{color:var(--red);}

  .cta{all:unset;cursor:pointer;background:var(--violet);color:#fff;font-size:13.5px;font-weight:700;padding:11px 20px;border-radius:11px;display:inline-block;}
  .cta:hover{background:var(--violet-dim);}
  .cta.ghost{background:var(--violet-soft);color:var(--violet);padding:8px 15px;font-size:12.5px;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:11px;opacity:0;transition:all .18s ease;pointer-events:none;z-index:60;}
  :root[data-theme="dark"] .toast{background:#0d0a1c;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .alertbox{background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber);padding:11px 15px;border-radius:11px;font-size:12.5px;font-weight:600;line-height:1.55;margin-top:10px;}
  .infobox{background:var(--green-soft);border:1px solid var(--green);color:var(--green);padding:11px 15px;border-radius:11px;font-size:12.5px;font-weight:600;line-height:1.55;margin-bottom:14px;}
  .foot{margin-top:6px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .foot b{color:var(--text);} .foot ul{margin:8px 0 0;padding-left:18px;} .foot li{margin-bottom:5px;line-height:1.5;}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;} @media (max-width:960px){.grid2{grid-template-columns:1fr;}}
  .grid2 > .card{min-width:0;}
  .reserve-box{border:1.5px dashed var(--border);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .subtab{all:unset;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);background:var(--track);padding:7px 13px;border-radius:9px;}
  .subtab.on{background:var(--violet-soft);color:var(--violet);}
  .subtab.off{opacity:.45;cursor:not-allowed;}
  section.pane{display:none;} section.pane.on{display:block;}

  /* ====== Module Conformité (16) — reconstruction fidèle §15.61, classes
     préfixées cfm- pour ne jamais entrer en collision avec le reste ====== */
  .cfm-att{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;font-size:13px;line-height:1.65;}
  .cfm-att h3{font-family:"Raleway",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;font-weight:800;margin:0 0 4px;}
  .cfm-att dl{display:grid;grid-template-columns:220px 1fr;gap:6px 14px;margin:14px 0;font-size:12.5px;}
  .cfm-att dt{color:var(--muted);}
  .cfm-att dd{margin:0;font-weight:700;}
  .cfm-fill{border-bottom:1px dashed var(--field-border);color:var(--muted);font-weight:400;}
  .cfm-layer{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border);}
  .cfm-layer:last-child{border-bottom:none;}
  .cfm-layer .n{flex:0 0 26px;height:26px;border-radius:8px;background:var(--violet);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .cfm-tree{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7;background:var(--childbg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow-x:auto;white-space:pre;}
  .cfm-tree .f{color:var(--violet);font-weight:700;}
  .cfm-tree .c{color:var(--muted);}
  .cfm-horloges{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}
  @media (max-width:760px){.cfm-horloges{grid-template-columns:1fr;}}
  .cfm-horloge{border:1px solid var(--border);border-radius:12px;padding:13px 15px;background:var(--surface);}
  .cfm-horloge .d{font-size:21px;font-weight:800;color:var(--violet);letter-spacing:-.02em;}

  /* ====== Module Wallet & campagnes + Carte Membre (20) — reconstruit fidèlement §15.63,
     classes préfixées wal- pour ne jamais entrer en collision avec le reste ====== */
  .wal-card{width:280px;max-width:100%;border-radius:16px;padding:18px;background:linear-gradient(135deg,var(--violet),#2b02a3);color:#fff;box-shadow:var(--shadow, 0 8px 24px -12px rgba(28,24,48,.3));}
  .wal-card .lieu{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.85;}
  .wal-card .nom{font-size:1.05rem;font-weight:800;margin:6px 0 12px;}
  .wal-card .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92rem;letter-spacing:.04em;background:rgba(255,255,255,.16);border-radius:8px;padding:6px 10px;display:inline-block;margin-bottom:10px;}
  .wal-card .pts{font-size:1.3rem;font-weight:800;}
  .wal-card .ptsl{font-size:11.5px;opacity:.85;}
  .wal-testbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .wal-testbtn{all:unset;cursor:pointer;background:var(--track);color:var(--muted);border-radius:8px;padding:7px 11px;font-size:11.5px;font-weight:700;}
  .wal-consent{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--muted);margin:4px 0 12px;line-height:1.5;}
  .wal-consent input{margin-top:3px;}

  /* ====== Module Commande & Journal (1+3) — intégration fidèle du
     prototype validé prototype-commande.html, classes préfixées cmd-
     pour ne jamais entrer en collision avec le reste de la coquille ====== */
  .cmd-topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
  .cmd-topbar .conf{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;}
  .cmd-topbar .conf.on{color:var(--green);background:var(--green-soft);}
  .cmd-topbar .conf.off{color:var(--red);background:var(--red-soft);}
  .cmd-topbar .note{margin-left:auto;font-size:12px;color:var(--muted);}
  .cmd-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .cmd-tabbtn,.jrn-tabbtn,.ger-tabbtn{padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);}
  .cmd-tabbtn.active,.jrn-tabbtn.active,.ger-tabbtn.active{border-color:var(--violet);background:var(--violet);color:#fff;}
  /* jrn-tabbtn (module 3, §15.62) est volontairement une classe séparée de cmd-tabbtn : le
     mécanisme d'onglets de Cmd (module 1, clos et validé) sélectionne ses boutons par
     querySelectorAll(".cmd-tabbtn") — lui donner cette classe ferait écraser silencieusement
     le gestionnaire de clic de ce nouvel onglet par celui de Cmd, sans toucher au code de Cmd.
     ger-tabbtn (§15.73, "Mes caisses", rôle Gérant) suit la même précaution : jamais affiché en
     même temps que les onglets de Cmd (rendu conditionnel par rôle), classe séparée par cohérence. */
  .cmd-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start;}
  @media (max-width:860px){.cmd-layout{grid-template-columns:1fr;}}
  .cmd-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .cmd-catbtn{padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);}
  .cmd-catbtn.active{border-color:var(--violet);background:var(--violet);color:#fff;}
  .cmd-pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .cmd-pcard{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;font:inherit;color:inherit;transition:transform .12s ease, border-color .18s ease;}
  .cmd-pcard:hover{border-color:var(--violet-dim);}
  .cmd-pcard:active{transform:scale(.97);}
  .cmd-pcard.zap{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
  .cmd-pname{font-weight:700;font-size:13.5px;line-height:1.25;}
  .cmd-prow{display:flex;justify-content:flex-end;align-items:center;margin-top:8px;}
  .cmd-ticket{position:sticky;top:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;}
  .cmd-thead{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .cmd-thead strong{font-size:15px;}
  .cmd-tcount{margin-left:auto;color:var(--muted);font-size:12.5px;}
  .cmd-empty{color:var(--muted);font-size:13px;padding:18px 0;text-align:center;}
  .cmd-line{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--paper);}
  .cmd-line .nom{font-size:13px;font-weight:700;}
  .cmd-line .prix{font-size:11.5px;color:var(--muted);}
  .cmd-stepbtn{width:24px;height:24px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-weight:800;}
  .cmd-qty{width:18px;text-align:center;}
  .cmd-blocklabel{font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:600;}
  .cmd-pillrow{display:flex;gap:6px;flex-wrap:wrap;}
  .cmd-pill{flex:1 1 auto;padding:6px 0;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);text-align:center;}
  .cmd-pill.on{border-color:var(--violet);background:var(--violet-soft);color:var(--violet);}
  .cmd-pill.abo{border-color:var(--violet);color:var(--violet);font-weight:800;}
  .cmd-pill.abo.on{background:var(--violet);color:#fff;}
  .cmd-pill.dimmed{opacity:.45;}
  .cmd-offert-row{display:flex;gap:8px;align-items:center;margin-top:6px;}
  .cmd-offert-row input{flex:1;padding:7px 9px;border-radius:8px;border:1px solid var(--field-border);background:var(--field);font:inherit;font-size:13px;text-align:right;color:var(--text);}
  .cmd-motif-box{margin-top:10px;padding:11px;border-radius:10px;background:var(--paper);border:1px dashed var(--border);}
  .cmd-motif-box.required{border-color:var(--red);}
  .cmd-motif-title{font-size:11.5px;font-weight:700;color:var(--text);margin-bottom:7px;display:flex;align-items:center;gap:6px;}
  .cmd-motif-title .req{color:var(--red);font-weight:800;}
  .cmd-motif-grid{display:flex;gap:6px;flex-wrap:wrap;}
  .cmd-motif-chip{padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);}
  .cmd-motif-chip.on{border-color:var(--violet);background:var(--violet);color:#fff;}
  .cmd-motif-txt{margin-top:7px;width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--field-border);font:inherit;font-size:12.5px;background:var(--field);color:var(--text);}
  .cmd-subtot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;}
  .cmd-total{display:flex;justify-content:space-between;margin:10px 0 14px;font-size:18px;font-weight:800;}
  .cmd-payrow{display:flex;gap:8px;margin-bottom:10px;}
  .cmd-paybtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text);}
  .cmd-paybtn.on{border-color:var(--violet);background:var(--violet-soft);color:var(--violet);}
  .cmd-cashbox{margin-bottom:10px;background:var(--paper);border-radius:10px;padding:11px;}

<script>
/* ============================================================
   DONNÉES RÉELLES — Les Spartiates de Marseille
   Source : dossier §15.31 (catalogue, stands, caisses) et §15.35
   (grille TVA confirmée par Rémi le 13/09, k_tva=1,0 pour ce lieu,
   points de retrait C&C). Rien ci-dessous n'est inventé : chaque
   valeur reprend un chiffre déjà écrit dans le dossier projet.
   ============================================================ */
const TVA = { boisson: 0.055, sucre: 0.055, food: 0.10, biere: 0.20 };
// Mapping catégorie → taux : reprend tel quel la grille confirmée par
// Rémi le 13/09 (boissons 5,5 % / bière 20 % / food 10 %), le bucket
// "boisson+dessert 5,5 %" du §6 couvrant aussi le sucré (cookies, brownie).
// Non ventilé produit par produit par Rémi lui-même : mapping déduit,
// pas une donnée qu'il a confirmée ligne à ligne — à vérifier avec lui
// si un produit précis devait relever d'un autre taux.

const SPARTIATES = {
  lieu: "Les Spartiates de Marseille",
  directeurFB: "Nicolas Cocandeau",
  kTva: 1.0, // §15.35 point 3 — TVA sur commission récupérée par ce lieu, réglage propre aux Spartiates
  commissionPct: 0.10, // valeur de test reprise de Config produits (15b) — non spécifique aux Spartiates, à confirmer au contrat réel
  stripePct: 0.025, // valeur de test (§15b) — taux réel non mesuré, panier moyen 27€ donné par Rémi comme estimation
  stands: [
    { id:"MHD", nom:"Comptoir Manhattan Hot Dog", caisses:[1,2] },
    { id:"SNK", nom:"Le Snack", caisses:[3,4] },
    { id:"BAR", nom:"Le Spartiate Bar", caisses:[5,6,7], pointRetraitCC:true },
    { id:"CAF", nom:"Le Spartiate Café", caisses:[8,9], pointRetraitCC:true },
  ],
  caissiers: {
    1:"Léa M.", 2:"Thomas R.", 3:"Inès B.", 4:"Nicolas F.",
    5:"Camille D.", 6:"Yanis T.", 7:"Chloé G.", 8:"Hugo P.", 9:"Manon S."
  },
  // Catalogue — 25 lignes, prix buvette confirmés (§15.31/§15.35).
  // coûtMatière : valeurs illustratives (aucun coût d'achat réel transmis
  // pour Les Spartiates) — signalées comme telles, jamais présentées
  // comme des données réelles. Sert uniquement à faire tourner les
  // calculateurs de marge de cette démo.
  catalogue: [
    { stand:"MHD", produit:"Hot dog", prix:7.00, tva:"food", cout:1.90 },
    { stand:"MHD", produit:"Nachos", prix:6.00, tva:"food", cout:1.60 },
    { stand:"MHD", produit:"Soda", prix:4.00, tva:"boisson", cout:0.90 },
    { stand:"MHD", produit:"Cookies", prix:3.00, tva:"sucre", cout:0.70 },
    { stand:"MHD", produit:"Brownie", prix:3.00, tva:"sucre", cout:0.75 },
    { stand:"MHD", produit:"Bière 50cl", prix:7.00, tva:"biere", cout:2.20 },
    { stand:"SNK", produit:"Hot dog", prix:7.00, tva:"food", cout:1.90 },
    { stand:"SNK", produit:"Nachos", prix:6.00, tva:"food", cout:1.60 },
    { stand:"SNK", produit:"Soda", prix:4.00, tva:"boisson", cout:0.90 },
    { stand:"SNK", produit:"Panini poulet", prix:8.50, tva:"food", cout:2.40 },
    { stand:"SNK", produit:"Panini jambon", prix:8.50, tva:"food", cout:2.30 },
    { stand:"SNK", produit:"Panini bœuf", prix:8.50, tva:"food", cout:2.60 },
    { stand:"SNK", produit:"Bière 50cl", prix:7.00, tva:"biere", cout:2.20 },
    { stand:"BAR", produit:"Hot dog", prix:7.00, tva:"food", cout:1.90 },
    { stand:"BAR", produit:"Nachos", prix:6.00, tva:"food", cout:1.60 },
    { stand:"BAR", produit:"Pizza", prix:12.00, tva:"food", cout:3.30 },
    { stand:"BAR", produit:"Brownie", prix:3.00, tva:"sucre", cout:0.75 },
    { stand:"BAR", produit:"Cookies", prix:3.00, tva:"sucre", cout:0.70 },
    { stand:"BAR", produit:"Bière 50cl", prix:7.00, tva:"biere", cout:2.20 },
    { stand:"CAF", produit:"Burger + frites", prix:13.00, tva:"food", cout:3.80 },
    { stand:"CAF", produit:"Fish and chips + frites", prix:13.00, tva:"food", cout:4.00 },
    { stand:"CAF", produit:"Tender + frites", prix:13.00, tva:"food", cout:3.60 },
    { stand:"CAF", produit:"Hot dog New Yorker + frites", prix:13.00, tva:"food", cout:2.90 },
    { stand:"CAF", produit:"Soda", prix:4.00, tva:"boisson", cout:0.90 },
    { stand:"CAF", produit:"Bière 50cl", prix:7.00, tva:"biere", cout:2.20 },
  ],
  sodaRefs: ["Coca-Cola","Coca Zéro","Fuze Tea","Évian","Sprite","Tropico","Coca Cherry","Cristalline citron"],
};

function standNom(id){ return (SPARTIATES.stands.find(s=>s.id===id)||{}).nom || id; }

/* ============================================================
   §15.88 — Gestion des stands & caisses : couche de mutation.
   SPARTIATES.stands/caissiers étaient jusqu'ici des constantes figées
   (4 stands/9 caisses des Spartiates). Ces fonctions les rendent
   modifiables (ajout de stand, ajout/réassignation de caisse,
   renommage) sans changer la forme des données lues par les 13
   emplacements déjà existants ailleurs dans le fichier (mêmes champs
   id/nom/caisses/pointRetraitCC). Phase 1 : ajout et renommage
   seulement — pas de suppression/désactivation d'un stand (voir §15.88,
   trop de données historiques y font déjà référence ailleurs).
   Un stand nouvellement créé démarre avec un catalogue vide dans
   Config produits (aucun bouton « ajouter un produit » n'existe
   aujourd'hui dans ce module) — limite déjà signalée au dossier.
   ============================================================ */
const SPARTIATES_LISTENERS = [];
function onSpartiatesChange(fn){ SPARTIATES_LISTENERS.push(fn); }
function notifySpartiatesChange(){ SPARTIATES_LISTENERS.forEach(fn=>{ try{ fn(); }catch(e){ console.error(e); } }); }

function prochainNumeroCaisse(){
  const nums = SPARTIATES.stands.flatMap(s=>s.caisses);
  return nums.length ? Math.max(...nums)+1 : 1;
}
function ajouterStand(nom){
  const propre = (nom||"").trim();
  if(!propre) return null;
  let base = propre.slice(0,3).toUpperCase().replace(/[^A-Z]/g,"") || "STD", id = base, n = 2;
  while(SPARTIATES.stands.some(s=>s.id===id)){ id = base+n; n++; }
  SPARTIATES.stands.push({ id, nom: propre, caisses: [] });
  notifySpartiatesChange();
  return id;
}
function renommerStand(id, nouveauNom){
  const s = SPARTIATES.stands.find(x=>x.id===id); const propre=(nouveauNom||"").trim();
  if(!s || !propre) return false;
  s.nom = propre; notifySpartiatesChange(); return true;
}
function ajouterCaisse(standId, nomCaissier){
  const s = SPARTIATES.stands.find(x=>x.id===standId); if(!s) return null;
  const num = prochainNumeroCaisse();
  s.caisses.push(num);
  SPARTIATES.caissiers[num] = (nomCaissier||"").trim() || `Caissier·ère caisse ${num}`;
  notifySpartiatesChange();
  return num;
}
function reassignerCaisse(caisseNum, nouveauStandId){
  const cible = SPARTIATES.stands.find(x=>x.id===nouveauStandId); if(!cible) return false;
  SPARTIATES.stands.forEach(s=>{ s.caisses = s.caisses.filter(c=>c!==caisseNum); });
  cible.caisses.push(caisseNum);
  notifySpartiatesChange();
  return true;
}
function renommerCaissier(caisseNum, nom){
  const propre = (nom||"").trim(); if(!propre) return false;
  SPARTIATES.caissiers[caisseNum] = propre; notifySpartiatesChange(); return true;
}
// La barre latérale (« X stands · Y caisses ») se réaffiche aussitôt un changement, sans
// attendre une navigation — renderSideNav() est hissée (function declaration), appelable ici
// même si définie plus bas dans le fichier.
onSpartiatesChange(()=>{ if(document.getElementById("sideNav")) renderSideNav(); });

/* ============================================================
   MOTEUR DE FORMULES — reprise exacte de cahier-des-formules.md
   Aucune formule n'est réinventée ici ; chaque fonction porte en
   commentaire la fiche du cahier des formules dont elle vient.
   ============================================================ */
const F = {
  // ht(ttc, tauxTva) — conversion TTC -> HT, utilisée dans presque toutes les fiches
  ht(ttc, taux){ return ttc / (1+taux); },

  // Fiche "Prix app conseillé" — moteur de prix Click & Collect (⚠ à revoir, §15.20)
  u(tauxTvaProduit){ return 1/(1+tauxTvaProduit); },
  prixAppConseille(prixBuvette, tauxTvaProduit, commissionPct, kTva, stripePct){
    const u = F.u(tauxTvaProduit);
    return prixBuvette * (u + commissionPct*kTva) / (u - stripePct);
  },
  // Fiche "Verdict du prix appliqué"
  resteComptoir(prixBuvette, tauxTvaProduit){ return prixBuvette * F.u(tauxTvaProduit); },
  resteApp(prixAppApplique, tauxTvaProduit, prixBuvette, commissionPct, kTva, stripePct){
    return prixAppApplique*F.u(tauxTvaProduit) - prixBuvette*commissionPct*kTva - prixAppApplique*stripePct;
  },
  verdict(prixAppApplique, prixBuvette, tauxTvaProduit, commissionPct, kTva, stripePct){
    return F.resteApp(prixAppApplique, tauxTvaProduit, prixBuvette, commissionPct, kTva, stripePct) - F.resteComptoir(prixBuvette, tauxTvaProduit);
  },

  // Fiche "Marge unitaire par canal" (module 5)
  margeComptoir(prixBuvette, tauxTvaProduit, coutMatiere){
    return F.ht(prixBuvette, tauxTvaProduit) - coutMatiere;
  },
  margeApp(prixApp, tauxTvaProduit, coutMatiere, stripePct, prixBuvette, commissionPct, kTva){
    return F.ht(prixApp, tauxTvaProduit) - coutMatiere - prixApp*stripePct - prixBuvette*commissionPct*kTva;
  },
  tauxMarge(margeBrute, caHt){ return caHt>0 ? margeBrute/caHt*100 : 0; },
};

/* ============================================================
   NAVIGATION — 9 sections validées par Rémi le 13/09 (§15.32)
   ============================================================ */

/* ============================================================
   PORTAIL DE RÔLE — demande de Rémi le 16/09 (§15.50) : un opérateur
   ne doit avoir accès qu'à la section Commande, pas au reste de
   l'application. IMPORTANT — limite documentée en §15.50 : ceci est
   un filtre d'AFFICHAGE côté client, pas une garantie de sécurité.
   Le fichier reste un unique document HTML/JS sans serveur : toutes
   les données (y compris marges/coûts/salaires) restent chargées en
   mémoire dans le navigateur quel que soit le rôle affiché, et
   restent lisibles via les outils de développement du navigateur.
   Le code Gérant ci-dessous est visible dans le code source par
   construction — ce n'est donc pas un secret, seulement un frein à
   une consultation involontaire ou occasionnelle.
   ============================================================ */
let appRole = null;           // "operateur" | "gerant" | null (portail non franchi)
let appNomSaisi = "";         // identification simple au niveau portail, distincte du
                               // champ operateurSaisi interne au module Commande (inchangé)
const GERANT_PIN = "0000";    // ⚠ valeur d'espace réservé — à remplacer par Rémi (§15.50) ;
                               // visible en clair dans ce fichier, donc non confidentielle.

function renderRoleGate(){
  const el = document.getElementById("roleGateZone");
  const err = renderRoleGate._err || "";
  el.innerHTML = `
    <h3>Accès à FlaiX Expert</h3>
    <p>Choisissez votre profil pour cette session (§15.50). L'accès « Opérateur » se limite à Ma caisse.</p>
    <label>Nom</label>
    <input id="rgNom" value="${appNomSaisi}" placeholder="Votre nom"/>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="cta" id="rgOperateur" style="flex:1;background:var(--violet-dim,var(--violet));">Opérateur</button>
      <button class="cta" id="rgGerant" style="flex:1;">Directeur</button>
    </div>
    <div id="rgPinZone" style="display:none;margin-top:14px;text-align:left;">
      <label>Code Gérant</label>
      <input id="rgPin" type="password" placeholder="Code"/>
      <button class="cta cmd-encaisser" id="rgPinBtn" style="margin-top:10px;">Valider</button>
    </div>
    ${err?`<div class="cmd-blockmsg">${err}</div>`:""}
    <div class="hint" style="margin-top:14px;text-align:left;font-size:11px;color:var(--muted);">⚠ Filtre d'affichage, pas une sécurité informatique — voir §15.50 du dossier projet. Les données restent chargées dans ce navigateur quel que soit le profil choisi.</div>
  `;
  document.getElementById("rgNom").oninput = e => { appNomSaisi = e.target.value; };
  document.getElementById("rgOperateur").onclick = () => {
    appRole = "operateur"; renderRoleGate._err = ""; currentSection = "commande"; navOpenSection = null;
    entrerApp();
  };
  document.getElementById("rgGerant").onclick = () => {
    document.getElementById("rgPinZone").style.display = "block";
  };
  document.getElementById("rgPinBtn").onclick = () => {
    const val = document.getElementById("rgPin").value;
    if(val === GERANT_PIN){
      appRole = "gerant"; renderRoleGate._err = "";
      entrerApp();
    } else {
      renderRoleGate._err = "Code incorrect.";
      renderRoleGate();
    }
  };
}
function entrerApp(){
  document.getElementById("roleGateZone").style.display = "none";
  document.getElementById("shellRoot").style.display = "";

  renderApp();
}
function changerDeRole(){
  appRole = null;
  document.getElementById("shellRoot").style.display = "none";
  document.getElementById("roleGateZone").style.display = "";

}
function visibleSections(){

  // sans dupliquer ni muter le tableau SECTIONS source.
  const withRoleLabel = SECTIONS.map(s => (s.id==="commande" && appRole==="gerant") ? { ...s, label:"Mes caisses", icon:"📊" } : s);
  return appRole === "operateur" ? withRoleLabel.filter(s=>s.id==="commande") : withRoleLabel;
}

let currentSection = "commande";
// État d'ouverture du sous-menu de la sidebar, VOLONTAIREMENT distinct de currentSection
// (§15.49) : avant cette correction, le sous-menu d'une section se calculait directement à
// partir de la section affichée, donc restait mécaniquement ouvert tant que son contenu était
// à l'écran — impossible de le refermer. navOpenSection permet de refermer le sous-menu sans
// changer ce qui est affiché.
let navOpenSection = null;

function renderSideNav(){
  const el = document.getElementById("sideNav");
  el.innerHTML = `
    <div class="brand">🏟️ FlaiX Expert</div>
    <div class="lieu"><b style="color:var(--text);">${SPARTIATES.lieu}</b><br>${SPARTIATES.stands.length} stand${SPARTIATES.stands.length>1?"s":""} · ${SPARTIATES.stands.reduce((a,s)=>a+s.caisses.length,0)} caisse${SPARTIATES.stands.reduce((a,s)=>a+s.caisses.length,0)>1?"s":""}<br>Directeur F&amp;B : ${SPARTIATES.directeurFB}</div>
    ${appRole==="operateur" ? `<div class="chip" style="display:block;text-align:center;margin-bottom:10px;">🧾 Mode opérateur${appNomSaisi?" · "+appNomSaisi:""}</div>` : ""}
    ${visibleSections().map(s=>{
      const mods = MODULES_BY_SECTION[s.id];
      const expanded = !!mods && s.id===navOpenSection;
      const sub = expanded ? `<div class="navsub">${mods.map(m=>`<a class="navsublink ${m.disabled?'off':(SUBTAB_STATE[s.id]===m.key?'on':'')}" data-sec="${s.id}" data-mod="${m.key}">${m.label}</a>`).join("")}</div>` : "";
      return `<a class="navlink ${s.id===currentSection?'active':''}" data-sec="${s.id}"><span class="ic">${s.icon}</span>${s.label}${mods?`<span class="navcaret ${expanded?'open':''}">▸</span>`:""}</a>${sub}`;
    }).join("")}
    <a class="navlink" id="navChangerRole" style="opacity:.75;">↩︎ Changer de rôle${appRole==="gerant"?" (Gérant)":" (Opérateur)"}</a>
    <div class="foot-side">⚠ Version fusionnée v1<br>Voir §15.36 du dossier projet.</div>
  `;
  document.getElementById("navChangerRole").onclick = () => changerDeRole();
  el.querySelectorAll(".navlink[data-sec]").forEach(a=>a.onclick=()=>{
    const sec = a.dataset.sec;
    const mods = MODULES_BY_SECTION[sec];
    if(mods){
      // Section à sous-menu : un clic sur une section déjà ouverte la referme (sans toucher
      // au contenu affiché) ; un clic sur une section fermée l'ouvre et affiche son module.
      if(navOpenSection===sec){ navOpenSection = null; }
      else { navOpenSection = sec; currentSection = sec; renderApp(); }
    } else {
      // Section à un seul module (Commande, Personnel, Conformité) : comportement inchangé.
      navOpenSection = null; currentSection = sec; renderApp();
    }
    renderSideNav(); window.scrollTo(0,0);
  });
  el.querySelectorAll(".navsublink:not(.off)").forEach(a=>a.onclick=(e)=>{
    e.stopPropagation();
    currentSection = a.dataset.sec;
    navOpenSection = a.dataset.sec;
    SUBTAB_STATE[a.dataset.sec] = a.dataset.mod;
    renderSideNav(); renderApp(); window.scrollTo(0,0);
  });
}

/* ============================================================
   MODULE ACTIF PAR SECTION — mécanisme demandé par Rémi le 13/09
   (§15.45) puis précisé le 13/09 (§15.47) : à l'intérieur d'une
   section, les modules d'origine qui la composent restent séparés
   (un seul visible à la fois), sélectionnés depuis le menu déroulant
   de la sidebar (voir renderSideNav) plutôt qu'un sous-onglet en
   haut du contenu. SUBTAB_STATE mémorise, par section, le dernier
   module choisi.
   ============================================================ */
const SUBTAB_STATE = {};
function activeModuleKey(sectionId){
  const mods = MODULES_BY_SECTION[sectionId];
  if(!mods) return null;
  if(!SUBTAB_STATE[sectionId] || (mods.find(m=>m.key===SUBTAB_STATE[sectionId])||{}).disabled){
    SUBTAB_STATE[sectionId] = mods.find(m=>!m.disabled).key;
  }
  return SUBTAB_STATE[sectionId];
}
function renderModulePane(sectionId, panes){
  const key = activeModuleKey(sectionId);
  return `<div id="${sectionId}Pane">${panes[key].render()}</div>`;
}
// Titre du MODULE actif, pas de la section (§15.49 — Rémi : « chaque module a son titre et
// pas le titre de la section entière »). Reprend le libellé du menu sidebar, qui ne porte
// plus ni repère ordinal ni numéro de module depuis le §15.51.
function moduleTitle(sectionId){
  const mods = MODULES_BY_SECTION[sectionId];
  if(!mods) return null;
  const key = activeModuleKey(sectionId);
  const m = mods.find(x=>x.key===key);
  return m ? m.label : null;
}
function mountModulePane(sectionId, panes){
  const key = activeModuleKey(sectionId);
  if(panes[key].mount) panes[key].mount();
}

function renderApp(){
  // Garde défensive (§15.50) : un opérateur ne doit jamais se retrouver avec une autre
  // section affichée, même si currentSection a été modifié ailleurs dans le code.
  if(appRole==="operateur" && currentSection!=="commande") currentSection = "commande";
  const el = document.getElementById("app");
  const fn = RENDERERS[currentSection];
  const topline = `<div class="topline"><span class="ctx">FlaiX Expert / Les Spartiates de Marseille</span><span class="badge-demo">⚠ Version fusionnée v1</span></div>`;
  el.innerHTML = topline + (fn ? fn() : "<p>Section en construction.</p>");
  if(window["wire_"+currentSection]) window["wire_"+currentSection]();
  wireRules();
}

const RENDERERS = {};

/* ============================================================
   MOTEUR STOCK (module 4) — porté fidèlement le 13/09 depuis
   l'artifact officiel "Stock — FlaiX Expert" (6d31aa2f…, maj 11/09),
   lu intégralement (915 lignes) suite au signalement de Rémi
   (§15.42/§15.44) : le premier portage avait réduit ce module à un
   tableau plat, perdant les 3 phases, la timeline et le moteur de
   suggestion. Ici, même moteur que l'artifact officiel : 3 phases
   (mise en place / pendant l'événement / comptage) pilotées par une
   variable `moment`, timeline mêlant soirées et inventaires réserve,
   solde de réserve recalculé depuis le dernier inventaire validé,
   CUMP par livraison, suggestion de mise en place d'après l'historique
   réel par emplacement, compensation comptoir↔C&C.
   Données : catalogue réel des Spartiates (25 lignes, 4 stands) et les
   3 soirées de démonstration déjà utilisées en Finances (§15.27 :
   Toulon/Grenoble/Bayonne) — pas un nouveau jeu de données inventé.
   Quantités de mise en place/vendu = démonstration déterministe
   (aucun historique réel n'existe pour Les Spartiates), signalé à
   l'écran. Onglet "Matières premières" désactivé et signalé comme tel :
   aucune recette/grammage réel n'a été transmis pour ce catalogue —
   pas de données inventées pour combler ce vide.
   ============================================================ */
const Stk = (function(){
  const num  = n => Math.round(n||0).toLocaleString("fr-FR");
  const dec  = n => (n||0).toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1});
  const eur3 = n => (n||0).toLocaleString("fr-FR",{minimumFractionDigits:3,maximumFractionDigits:3})+" €";
  const fq   = (it,n) => it.unite==="u" ? num(n) : dec(n)+" "+it.unite;

  // §15.88 : recalculée à chaque changement de SPARTIATES.stands (au lieu d'être figée une
  // fois pour toutes) — sinon un stand ajouté depuis Configuration n'apparaîtrait jamais ici.
  let STANDS = SPARTIATES.stands.map(s=>s.nom);
  onSpartiatesChange(()=>{ STANDS = SPARTIATES.stands.map(s=>s.nom); });
  // Proportionnel aux tickets des 3 soirées de démo déjà validées en Finances (§15.27) : 2180/2690/2510
  const EVT_FACTOR = { e1:0.81, e2:1.00, e3:0.93 };

  let TIMELINE = [
    { id:"inv0", type:"inventaire", date:"2026-08-15", lab:"Inventaire réserve — déclaration de départ", statut:"valide" },
    { id:"e1", type:"match", date:"2026-08-22", lab:"Toulon",   etat:"passe" },
    { id:"e2", type:"match", date:"2026-09-05", lab:"Grenoble", etat:"passe" },
    { id:"e3", type:"match", date:"2026-09-12", lab:"Bayonne",  etat:"passe" },
  ];
  const trier = () => TIMELINE.sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : (a.type==="inventaire"?-1:1));
  const EVENTS = () => TIMELINE.filter(t=>t.type==="match");
  const INVS   = () => TIMELINE.filter(t=>t.type==="inventaire");
  const noeud  = id => TIMELINE.find(t=>t.id===id);
  const jjmm   = d => d.slice(8,10)+"/"+d.slice(5,7);

  // Un emplacement par produit, canal "partage" : les points de retrait C&C des Spartiates
  // puisent dans le stock déjà configuré de leur stand, sans pile séparée (règle confirmée
  // §15.31 pt.6) — la compensation comptoir/C&C de l'engine reste câblée (compensLab) mais ne
  // s'active jamais ici, faute de cas réel à deux piles chez ce lieu.
  const products = SPARTIATES.catalogue.map((p,i)=>{
    const standLab = standNom(p.stand);
    const mepBase = 25 + (i*7)%55;
    const ev = {};
    ["e1","e2","e3"].forEach(eid=>{
      const mep = Math.max(1, Math.round(mepBase*EVT_FACTOR[eid]));
      const decal = eid==="e1"?0:eid==="e2"?13:26;
      const vendu = Math.round(mep*(0.55+((i*11+decal)%30)/100));
      ev[eid] = [{ stand: standLab, canal:"partage", restePrec:0, mep, reassort:0, vendu, compte:0, mepPar:"Directeur", mepLe:"18h30" }];
    });
    const reserveInit = Math.round(mepBase*3.6);
    return { id:"sp"+i, nom:p.produit, coutBase:p.cout, unite:"u", reserveInit, inv:{ inv0: reserveInit }, ev };
  });

  // Aucune livraison réelle saisie pour Les Spartiates : le CUMP = coût catalogue tant qu'aucune n'est ajoutée.
  let livraisons = [];
  let mvts = [];

  let ev="e1", moment="mep", view="unit", standF="all", prodF="all";
  let open = new Set(), allOpen = true, seeded = false;

  const canalLab = c => c==="comptoir" ? "Comptoir" : c==="cc" ? "C&C" : "";
  const locLabel = l => l.canal==="partage" ? l.stand : l.stand+" · "+canalLab(l.canal);
  const byId = id => products.find(x=>x.id===id);
  const noeudCourant = () => noeud(ev) || TIMELINE[0];
  const estInventaire = () => noeudCourant().type==="inventaire";
  const evtEtat = () => estInventaire() ? "inventaire" : noeudCourant().etat;

  const compteInv = (it,invId) => (it.inv && it.inv[invId]!=null) ? it.inv[invId] : null;
  function baseInventaire(it, date){
    const cands = INVS().filter(i=> i.date<=date && i.statut==="valide" && compteInv(it,i.id)!==null);
    return cands.length ? cands[cands.length-1] : null;
  }
  const sortiMatch = (it,mid) => (it.ev[mid]||[]).reduce((a,x)=>a+x.mep+x.reassort,0);
  function soldeReserve(it, date, inclureSortiesDuJour){
    const base = baseInventaire(it, date);
    const depuis = base ? base.date : "0000-00-00";
    const depart = base ? compteInv(it, base.id) : it.reserveInit;
    const livr = livraisons.filter(l=>l.pid===it.id && l.date>depuis && l.date<=date).reduce((a,l)=>a+l.qte,0);
    const sorties = EVENTS().filter(m=> m.date>depuis && (inclureSortiesDuJour ? m.date<=date : m.date<date))
                            .reduce((a,m)=>a+sortiMatch(it,m.id),0);
    return depart + livr - sorties;
  }
  function cump(it){
    let q = it.reserveInit, v = it.reserveInit*it.coutBase;
    livraisons.filter(l=>l.pid===it.id).forEach(l=>{ q+=l.qte; v+=l.qte*l.pu; });
    return q ? v/q : it.coutBase;
  }
  const livre = it => livraisons.filter(l=>l.pid===it.id).reduce((a,l)=>a+l.qte,0);

  function suggestionDe(it,l){
    const dateCourante = noeudCourant().date;
    const passes = EVENTS().filter(m => m.date < dateCourante && (it.ev[m.id]||[]).length);
    const obs = passes.map(m=>{
      const x = it.ev[m.id].find(y=>y.stand===l.stand && y.canal===l.canal);
      if(!x) return null;
      const dispo = x.restePrec + x.mep + x.reassort;
      return { vendu:x.vendu, rupture:(dispo - x.vendu) <= 0 };
    }).filter(Boolean);
    if(!obs.length) return null;
    const moy = obs.reduce((a,x)=>a+x.vendu,0)/obs.length;
    const cible = Math.ceil(moy);
    return { qte: Math.max(0, cible - restePrecOf(it,l)), moy, cible, n: obs.length, bride: obs.some(x=>x.rupture) };
  }
  function restePrecOf(it,l){
    const ms = EVENTS();
    const i = ms.findIndex(e=>e.id===ev);
    if(i<=0) return l.restePrec;
    const prev = (it.ev[ms[i-1].id]||[]).find(x=>x.stand===l.stand && x.canal===l.canal);
    return prev ? prev.compte : 0;
  }
  function calcLoc(it,l){
    const restePrec = restePrecOf(it,l);
    const dispo = restePrec + l.mep + l.reassort;
    const vendu = l.vendu;
    const attendu = dispo - vendu;
    const seuil = Math.round(dispo*0.15);
    return { ...l, restePrec, dispo, vendu, attendu, seuil,
      alerte: attendu<=0 ? "rupture" : attendu<=seuil ? "faible" : null,
      ecartU: l.compte - attendu };
  }
  function calcItem(it){
    const all = it.ev[ev] || [];
    const locs = all.filter(l=> standF==="all" || l.stand===standF).map(l=>calcLoc(it,l));
    const s = k => locs.reduce((a,x)=>a+x[k],0);
    const nd = noeudCourant();
    const sortiesEvt = nd.type==="match" ? sortiMatch(it, nd.id) : 0;
    const reserveAvant = soldeReserve(it, nd.date, false);
    const invBase = baseInventaire(it, nd.date);
    const cout = cump(it), ecartU = s("ecartU");
    return { ...it, locs, cout, livre:livre(it), sortiesEvt, invBase, reserveAvant,
      reserveApres: reserveAvant - sortiesEvt,
      compteInv: compteInv(it, nd.id),
      ecartInv: (nd.type==="inventaire" && compteInv(it,nd.id)!==null) ? compteInv(it,nd.id) - reserveAvant : null,
      mep:s("mep"), reassort:s("reassort"), dispo:s("dispo"), vendu:s("vendu"),
      attendu:s("attendu"), compte:s("compte"), ecartU, ecartEur: ecartU*cout,
      pireAlerte: locs.some(x=>x.alerte==="rupture") ? "rupture" : locs.some(x=>x.alerte==="faible") ? "faible" : null };
  }
  const rows = () => products.filter(it=> prodF==="all" || it.id===prodF).map(calcItem).filter(x=>x.locs.length);

  function compensLab(p,l){
    const sib = p.locs.find(x=>x.stand===l.stand && x.canal!==l.canal && x.canal!=="partage");
    if(!sib || l.canal==="partage") return "";
    const a=l.ecartU, b=sib.ecartU;
    if(a===0 || b===0 || (a<0)===(b<0)) return "";
    const compense = Math.min(Math.abs(a),Math.abs(b));
    return ` <span class="chip cc" title="Écarts opposés entre les deux piles du même stand : probablement un prélèvement d'une pile sur l'autre, pas une perte.">≈ ${fq(p,compense)} déplacés, pas perdus</span>`;
  }

  function seedComptes(){
    const ids = EVENTS().map(m=>m.id);
    products.forEach(it=>{
      let prevCompte = 0;
      ids.forEach((eid,idx)=>{
        const l = it.ev[eid][0];
        const restePrec = idx===0 ? 0 : prevCompte;
        l.restePrec = restePrec;
        const dispo = restePrec + l.mep + l.reassort;
        const attendu = dispo - l.vendu;
        l.compte = Math.max(0, Math.round(attendu));
        prevCompte = l.compte;
      });
    });
  }
  function seedMvts(){
    mvts = [];
    livraisons.forEach(l=>{ const p=byId(l.pid);
      mvts.push({h:jjmm(l.date), type:"livraison", nom:p.nom, q:l.qte, u:"", dest:"Réserve", who:l.four, pu:l.pu}); });
    EVENTS().forEach(m=>{
      products.forEach(it=>{
        const l = it.ev[m.id][0];

    });

    return `<span class="stk-gauge"><i style="width:${p}%;background:${c};"></i></span>`; }
  const badge = a => a==="rupture"?'<span class="badge ko">rupture</span>':a==="faible"?'<span class="badge warn">faible</span>':"";
  const canalChip = c => c==="cc" ? '<span class="chip cc">app</span>' : c==="comptoir" ? '<span class="chip grey">comptoir</span>' : "";

  // §15.67 : exemple chiffré vivant pour le panneau Règles, recalculé à chaque rendu — comme le
  // fait l'artifact officiel (ex. Hot-dog/Lait/Bière 25cl) — au lieu du seul texte générique figé
  // qui existait avant cette correction. Produit choisi : « Hot dog », réel, vendu à plusieurs
  // stands du catalogue des Spartiates.
  function rulesExempleHtml(){
    const it = products.find(p=>p.nom==="Hot dog");
    if(!it) return "";
    // Si l'événement sélectionné est un inventaire (pas de ventes match associées), l'exemple
    // retombe sur le dernier match réel plutôt que de laisser le panneau vide — signalé dans
    // la phrase elle-même, aucune donnée inventée.
    const surInventaire = !it.ev[ev];
    const eidUse = !surInventaire ? ev : (EVENTS().length ? EVENTS()[EVENTS().length-1].id : null);
    if(!eidUse) return "";
    const loc = (it.ev[eidUse]||[])[0];
    if(!loc) return "";
    const c = calcLoc(it, loc);
    const nd = noeud(eidUse);
    const ecartVal = (c.ecartU*it.coutBase).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
    const ecartTxt = c.compte ? `, compté ${c.compte}, écart ${c.ecartU>0?"+":""}${c.ecartU} unité${Math.abs(c.ecartU)>1?"s":""} (${ecartVal} €)` : ", comptage pas encore saisi pour cet événement";
    const noteInv = surInventaire ? ` <i>(inventaire sélectionné, sans ventes propres — exemple montré sur le dernier match, ${jjmm(nd.date)})</i>` : "";
    return `<p><b>Exemple réel, recalculé à chaque écran</b>${noteInv} — « ${it.nom} » à ${c.stand}, événement du ${jjmm(nd.date)} : disponible ${c.dispo} (reste avant ${c.restePrec} + mise en place ${c.mep} + réassort ${c.reassort}), vendu ${c.vendu}, attendu ${c.attendu}${ecartTxt}.</p>`;
  }

          ? `<button class="stk-addbtn sugg" data-sugg="${p.id}" data-loc="${l.stand}|${l.canal}" data-q="${sg.qte}"
               title="D'après ${fq(p,sg.cible)} vendus en moyenne sur ${sg.n} match${sg.n>1?"s":""} à cet emplacement, moins ${fq(p,l.restePrec)} déjà sur place.${sg.bride?" ⚠ Rupture observée sur un match passé : la demande réelle était probablement supérieure.":""}">suggéré ${fq(p,sg.qte)}${sg.bride?" ⚠":""}</button>`
          : `<span style="font-size:10px;color:var(--muted);">pas d'historique</span>`;
        return `<td class="stk-who">↳ ${locLabel(l)} ${canalChip(l.canal)}</td>
        <td class="r" style="color:var(--muted);font-size:11.5px;">reste évt précédent&nbsp;: ${fq(p,l.restePrec)}</td>
        <td class="r">${sgHtml}</td>
        <td class="r"><input class="cell sm" style="width:64px;" type="number" min="0" step="1" data-id="${p.id}" data-loc="${l.stand}|${l.canal}" data-f="mep" value="${l.mep}">
          <div id="stkAuth_${p.id}" style="font-size:10px;color:var(--muted);text-align:right;margin-top:2px;">${l.mep>0 ? `${l.mepPar||"Directeur"} · ${l.mepLe||"18h30"}` : "rien envoyé"}</div></td>
        <td class="r num" style="font-weight:600;" id="stkDispo_${p.id}">dispo ${fq(p,l.dispo)}</td>`;
      };
      foot = () => `<td>Totaux (valorisés)</td><td class="r num">${eur(sv("reserveAvant"))}</td><td></td><td class="r num">${eur(sv("mep"))}</td><td class="r num">${eur(sv("reserveApres"))}</td>`;
      const dispoSugg = rs.some(p=>p.locs.some(l=>suggestionDe(p,l)));
      cta.innerHTML = (dispoSugg ? `<button class="cta ghost" id="stkAppliquerSugg" style="margin-top:14px;">Appliquer toutes les suggestions</button> ` : "")
        + `<button class="cta" id="stkValider">Valider la mise en place</button>`;
    } else if(moment==="pendant"){
      head = `<th>Produit</th><th class="r">Disponible</th><th class="r" style="color:var(--violet);">Réassort</th><th class="r">Vendu</th><th class="r">Restant</th><th class="r">État</th>`;
      parent = p => `<td style="font-weight:600;"><span class="caret ${open.has(p.id)?'open':''}">▶</span> ${p.nom}</td>
        <td class="r num">${fq(p,p.dispo)}</td>
        <td class="r num" style="color:var(--muted);">${p.reassort?"+"+fq(p,p.reassort):"—"}</td>
        <td class="r num">${fq(p,p.vendu)}</td>
        <td class="r num" style="font-weight:700;">${fq(p,p.attendu)}</td>
        <td class="r">${badge(p.pireAlerte)||'<span style="color:var(--muted);font-size:11.5px;">ok</span>'}</td>`;
      child = (p,l) => `<td class="stk-who">↳ ${locLabel(l)} ${canalChip(l.canal)}</td>
        <td class="r num">${fq(p,l.dispo)}</td>
        <td class="r"><div style="display:flex;align-items:center;gap:5px;justify-content:flex-end;">
          <button class="stk-addbtn minus" data-sub="${p.id}" data-loc="${l.stand}|${l.canal}" title="Retirer">−</button>
          <input class="cell sm" style="width:52px;" type="number" min="0" step="1" value="10" id="stkQ_${p.id}">
          <button class="stk-addbtn" data-add="${p.id}" data-loc="${l.stand}|${l.canal}" title="Envoyer depuis la réserve">+</button>
          </div>${l.reassort?`<div style="font-size:10.5px;color:var(--violet);text-align:right;margin-top:2px;">déjà +${fq(p,l.reassort)}</div>`:""}</td>
        <td class="r num">${fq(p,l.vendu)}</td>
        <td class="r num" style="color:${l.alerte==='rupture'?'var(--red)':l.alerte==='faible'?'var(--amber)':'inherit'};font-weight:600;">${fq(p,l.attendu)}${l.alerte?` / ${fq(p,l.seuil)}`:""}</td>
        <td class="r">${gauge(l.attendu,l.dispo,l.alerte)} ${badge(l.alerte)}</td>`;
      foot = () => `<td colspan="1">Totaux (valorisés)</td><td class="r num">${eur(sv("dispo"))}</td><td class="r num">${eur(sv("reassort"))}</td><td class="r num">${eur(sv("vendu"))}</td><td class="r num">${eur(sv("attendu"))}</td><td></td>`;
    } else {
      head = `<th>Produit</th><th class="r">Coût CUMP</th><th class="r">Restant attendu</th><th class="r" style="color:var(--violet);">Compté</th><th class="r">Écart</th><th class="r">Écart €</th>`;
      parent = p => `<td style="font-weight:600;"><span class="caret ${open.has(p.id)?'open':''}">▶</span> ${p.nom}</td>
        <td class="r num" style="color:var(--muted);">${eur3(p.cout)}</td>
        <td class="r num">${fq(p,p.attendu)}</td><td class="r num">${fq(p,p.compte)}</td>
        <td class="r num" style="color:${p.ecartU<0?'var(--red)':'var(--muted)'};">${p.ecartU>0?"+":""}${fq(p,p.ecartU)}</td>

      child = (p,l) => `<td class="stk-who">↳ ${locLabel(l)} ${canalChip(l.canal)}<span id="stkComp_${p.id}">${compensLab(p,l)}</span></td><td></td>
        <td class="r num" id="stkAtt_${p.id}">${fq(p,l.attendu)}</td>
        <td class="r"><input class="cell sm" style="width:64px;" type="number" min="0" step="1" data-id="${p.id}" data-loc="${l.stand}|${l.canal}" data-f="compte" value="${l.compte}"></td>
        <td class="r num" id="stkEc_${p.id}" style="color:${l.ecartU<0?'var(--red)':'var(--muted)'};">${l.ecartU>0?"+":""}${fq(p,l.ecartU)}</td>
        <td class="r num" id="stkEce_${p.id}" style="color:${l.ecartU<0?'var(--red)':'var(--muted)'};">${Math.abs(l.ecartU*p.cout)>0.004?eur(l.ecartU*p.cout):"—"}</td>`;
      foot = () => { const ecTot = rows().reduce((a,p)=>a+p.ecartEur,0);
        return `<td colspan="2">Totaux (valorisés)</td><td class="r num">${eur(sv("attendu"))}</td><td class="r num">${eur(sv("compte"))}</td><td></td>
        <td class="r num" style="color:${ecTot<0?'var(--red)':'var(--green)'};">${eur(ecTot)}</td>`; };
      cta.innerHTML = `<button class="cta" id="stkValider">Clôturer le comptage</button>`;
    }

    curParent = parent; curFoot = foot;
    t.innerHTML = `<thead><tr>${head}</tr></thead><tbody>${
      rs.map(p=>`<tr class="parent" data-tog="${p.id}">${parent(p)}</tr>`
        + (open.has(p.id) ? p.locs.map(l=>`<tr class="detail">${child(p,l)}</tr>`).join("") : "")).join("")
    }</tbody><tfoot><tr>${foot()}</tr></tfoot>`;
    wireTable();
  }

  function patchLive(itId){
    if(!curParent) return;
    const it = calcItem(byId(itId));
    const tr = document.querySelector(`tr.parent[data-tog="${itId}"]`);
    if(tr) tr.innerHTML = curParent(it);
    it.locs.forEach(l=>{
      const c = document.getElementById(`stkDispo_${itId}`);
      if(c) c.textContent = (moment==="mep" ? "dispo " : "") + fq(it,l.dispo);
      const a = document.getElementById(`stkAtt_${itId}`);
      if(a) a.textContent = fq(it,l.attendu);
      const e = document.getElementById(`stkEc_${itId}`);
      if(e){ e.textContent = (l.ecartU>0?"+":"")+fq(it,l.ecartU); e.style.color = l.ecartU<0 ? "var(--red)" : "var(--muted)"; }
      const ee = document.getElementById(`stkEce_${itId}`);
      if(ee){ ee.textContent = Math.abs(l.ecartU*it.cout)>0.004 ? eur(l.ecartU*it.cout) : "—"; ee.style.color = l.ecartU<0 ? "var(--red)" : "var(--muted)"; }
      const cp = document.getElementById(`stkComp_${itId}`);
      if(cp) cp.innerHTML = compensLab(it,l);
      const au = document.getElementById(`stkAuth_${itId}`);
      if(au) au.textContent = l.mep>0 ? `${l.mepPar||"Directeur"} · ${l.mepLe||"18h30"}` : "rien envoyé";
    });
    const tf = document.querySelector("#stkMainTable tfoot tr");
    if(tf && curFoot) tf.innerHTML = curFoot();
  }

    const col = t => t==="livraison"?"var(--green)":"var(--violet)";
    document.getElementById("stkMvtList").innerHTML = mvts.slice().reverse().map(m=>
      `<div class="stk-mvt"><span class="h">${m.h}</span><span class="q" style="color:${col(m.type)};">+${dec(m.q)}${m.u||""}</span>
       <span>${m.nom} <span style="color:var(--muted);">→ ${m.dest}</span>${m.pu?` <span style="color:var(--muted);">à ${eur3(m.pu)}</span>`:""}</span>
       <span class="w">${m.type} · ${m.who}</span></div>`).join("");
  }

      `<thead><tr><th>Date</th><th>Produit</th><th class="r">Quantité</th><th class="r">Prix u.</th><th class="r">Total</th><th>Fournisseur</th><th class="r">CUMP</th></tr></thead><tbody>`
      + (livraisons.length ? livraisons.map(l=>{ const p=byId(l.pid);
          return `<tr><td style="color:var(--muted);">${jjmm(l.date)}</td><td style="font-weight:600;">${p.nom}</td>
            <td class="r num">${num(l.qte)}</td><td class="r num">${eur3(l.pu)}</td>

      + `</tbody>`;
    const sel=document.getElementById("stkLvProd");

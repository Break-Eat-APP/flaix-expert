  function renderInvEvent(){
    const nd = noeudCourant();
    const list = products.filter(it=> prodF==="all" || it.id===prodF).map(calcItem);
    const t = document.getElementById("stkMainTable"), cta = document.getElementById("stkCtaZone");
    document.getElementById("stkTableTitle").textContent = `${nd.lab} du ${jjmm(nd.date)} — comptage du dépôt`;
    document.getElementById("stkTableHint").innerHTML = nd.statut==="valide"
      ? `Inventaire <b>validé</b> : il sert de point de départ au solde du dépôt pour tout ce qui suit.`
      : `Compte physiquement le dépôt. L'écart se calcule contre le solde théorique à cette date.`;
    t.innerHTML = `<thead><tr><th>Référence</th><th class="r">Point de départ</th><th class="r">Livré depuis</th><th class="r">Sorti depuis</th><th class="r">Solde théorique</th><th class="r" style="color:var(--violet);">Compté au dépôt</th><th class="r">Écart</th><th class="r">Écart €</th></tr></thead><tbody>`
      + list.map(p=>{
          const base = p.invBase, depuis = base ? base.date : "0000-00-00";
          const depart = base ? compteInv(p, base.id) : p.reserveInit;
          const lv = livraisons.filter(l=>l.pid===p.id && l.date>depuis && l.date<=nd.date).reduce((a,l)=>a+l.qte,0);
          const so = EVENTS().filter(m=>m.date>depuis && m.date<nd.date).reduce((a,m)=>a+sortiMatch(p,m.id),0);
          const ec = p.ecartInv;
          return `<tr><td style="font-weight:600;">${p.nom}
              ${base && base.id!==nd.id ? `<div style="font-size:10.5px;color:var(--muted);font-weight:400;">depuis l'inventaire du ${jjmm(base.date)}</div>`:""}</td>
            <td class="r num" style="color:var(--muted);">${base && base.id!==nd.id ? fq(p,depart) : "—"}</td>
            <td class="r num" style="color:var(--muted);">${lv?"+"+fq(p,lv):"—"}</td>
            <td class="r num" style="color:var(--muted);">${so?"−"+fq(p,so):"—"}</td>
            <td class="r num" style="font-weight:600;">${fq(p,p.reserveAvant)}</td>
            <td class="r"><input class="cell sm" style="width:64px;" type="number" min="0" step="1" data-inv="${p.id}" value="${p.compteInv===null?"":p.compteInv}" placeholder="—"></td>
            <td class="r num" style="color:${ec<0?'var(--red)':ec>0?'var(--green)':'var(--muted)'};">${ec===null?"—":(ec>0?"+":"")+fq(p,ec)}</td>
            <td class="r num" style="font-weight:700;color:${ec<0?'var(--red)':ec>0?'var(--green)':'var(--muted)'};">${ec===null||Math.abs(ec*p.cout)<0.005?"—":eur(ec*p.cout)}</td></tr>`;
        }).join("");
    const ecTot = list.reduce((a,p)=>a+((p.ecartInv||0)*p.cout),0);
    const nbSaisi = list.filter(p=>p.compteInv!==null).length;
    t.innerHTML += `</tbody><tfoot><tr><td colspan="6">Écart d'inventaire total — ${nbSaisi}/${list.length} références comptées</td>
      <td class="r"></td><td class="r num" style="color:${ecTot<0?'var(--red)':'var(--green)'};">${eur(ecTot)}</td></tr></tfoot>`;
    cta.innerHTML = nd.statut==="valide"
      ? `<div style="margin-top:14px;font-size:12.5px;color:var(--muted);">Inventaire validé le ${jjmm(nd.date)} — il fait référence pour la suite.</div>`
      : `<button class="cta" id="stkValInv">Valider l'inventaire du ${jjmm(nd.date)}</button>`;
    document.querySelectorAll("input[data-inv]").forEach(i=>{
      i.oninput = e => { const p=byId(e.target.dataset.inv);
        p.inv[nd.id] = e.target.value==="" ? null : Math.max(0,parseFloat(e.target.value)||0);
        renderKpis(); renderInvEvent(); };
    });
    const vb=document.getElementById("stkValInv");
    if(vb) vb.onclick = ()=>{
      nd.statut="valide";
      list.forEach(p=>{ if(p.ecartInv) mvts.push({h:jjmm(nd.date), type:"inventaire", nom:p.nom, q:p.ecartInv, u:"", dest:"Réserve", who:"Directeur"}); });
      render(); toast(`Inventaire du ${jjmm(nd.date)} validé — le solde du dépôt repart du compté réel`);
    };
  }
  function renderInvList(){
    document.getElementById("stkInvList").innerHTML = INVS().map(i=>{
      const list = products.map(it=>{
        const av = soldeReserve(it, i.date, false);
        const c = compteInv(it,i.id);
        return c===null ? 0 : (c-av)*cump(it);
      });
      const ecT = list.reduce((a,x)=>a+x,0);
      const sel = i.id===ev;
      return `<div class="stk-mvt" style="cursor:pointer;${sel?'background:var(--violet-soft);border-radius:8px;padding-left:8px;':''}" data-goinv="${i.id}">
        <span class="h">${jjmm(i.date)}</span>
        <span style="font-weight:600;">${i.lab}</span>
        <span class="chip ${i.statut==='valide'?'':'grey'}" style="margin-left:8px;">${i.statut==='valide'?'validé':'brouillon'}</span>
        <span class="w">écart ${eur(ecT)}</span></div>`;
    }).join("");
    document.querySelectorAll("[data-goinv]").forEach(d=>{
      d.onclick = ()=>{ ev=d.dataset.goinv; refreshEvSel(); render(); };
    });
  }

  const findLoc = (it,key) => { const [st,ca]=key.split("|"); return (it.ev[ev]||[]).find(l=>l.stand===st && l.canal===ca); };
  function wireTable(){
    document.querySelectorAll("#stkMainTable tr.parent[data-tog]").forEach(tr=>{
      tr.onclick = e => { if(e.target.closest("input,button")) return;
        const id=tr.dataset.tog; open.has(id)?open.delete(id):open.add(id); renderTable(); };
    });
    document.querySelectorAll("#stkMainTable input.cell[data-id]").forEach(inp=>{
      inp.oninput = e => { const it=byId(e.target.dataset.id);
        const lc = findLoc(it,e.target.dataset.loc);
        lc[e.target.dataset.f] = Math.max(0,parseFloat(e.target.value)||0);
        if(e.target.dataset.f==="mep"){ lc.mepPar="Directeur"; lc.mepLe=nowHM(); }
        patchLive(e.target.dataset.id); renderKpis(); renderBanner(); renderInvList(); };
    });
    document.querySelectorAll(".stk-addbtn[data-add]").forEach(b=>{
      b.onclick = ev2 => { ev2.stopPropagation();
        const it=byId(b.dataset.add), l=findLoc(it,b.dataset.loc);
        const inp=document.getElementById(`stkQ_${it.id}`);
        const q=Math.max(0,parseFloat(inp?inp.value:0)||0);
        if(q<=0){ toast("Saisis une quantité de réassort"); return; }
        l.reassort += q;
        mvts.push({h:nowHM(), type:"réassort", nom:it.nom, q, u:"", dest:locLabel(l), who:"Directeur"});
        render(); toast(`Réassort +${fq(it,q)} · ${it.nom} → ${locLabel(l)}`); };
    });
    document.querySelectorAll(".stk-addbtn[data-sub]").forEach(b=>{
      b.onclick = ev2 => { ev2.stopPropagation();
        const it=byId(b.dataset.sub), l=findLoc(it,b.dataset.loc);
        const inp=document.getElementById(`stkQ_${it.id}`);
        const q=Math.max(0,parseFloat(inp?inp.value:0)||0);
        if(q<=0){ toast("Saisis la quantité à retirer"); return; }
        if(l.reassort<=0){ toast(`Aucun réassort à corriger sur ${locLabel(l)}`); return; }
        const r=Math.min(q,l.reassort); l.reassort -= r;
        mvts.push({h:nowHM(), type:"correction", nom:it.nom, q:-r, u:"", dest:locLabel(l), who:"Directeur"});
        render(); toast(`Correction −${fq(it,r)} · ${it.nom}`); };
    });
    document.querySelectorAll(".stk-addbtn[data-sugg]").forEach(b=>{
      b.onclick = ev2 => { ev2.stopPropagation();
        const it=byId(b.dataset.sugg), l=findLoc(it,b.dataset.loc);
        l.mep = parseFloat(b.dataset.q)||0; l.mepPar="Directeur"; l.mepLe=nowHM();
        render(); toast(`Suggestion appliquée · ${it.nom} → ${locLabel(l)} : ${fq(it,l.mep)}`); };
    });
    const ap=document.getElementById("stkAppliquerSugg");
    if(ap) ap.onclick = ()=>{
      let n=0;
      rows().forEach(p=>{ const it=byId(p.id);
        (it.ev[ev]||[]).forEach(l=>{ const s=suggestionDe(it,l);
          if(s){ l.mep=s.qte; l.mepPar="Directeur"; l.mepLe=nowHM(); n++; } }); });
      render(); toast(`${n} suggestion${n>1?"s":""} appliquée${n>1?"s":""}`);
    };
    const v=document.getElementById("stkValider");
    if(v) v.onclick = () => toast(moment==="mep"
      ? "Mise en place validée — réserve décrémentée (simulation)"
      : "Comptage clôturé — écarts envoyés vers Clôture de soirée (simulation)");
  }

  function renderChrome(){
    // §15.67 : futur recalculé depuis evtEtat() (au lieu d'être figé à false) — restaure le
    // gating "événement à venir" de l'artifact officiel. Inerte avec le jeu de données actuel
    // des Spartiates (e1/e2/e3 sont tous "passe"), disclosed dans le dossier §15.67.
    const inv = estInventaire(), futur = evtEtat()==="a_venir";
    document.getElementById("stkStepsCard").style.display = (inv||view==="mat") ? "none" : "";
    document.querySelectorAll(".stk-step").forEach(b=>{
      b.classList.toggle("active", b.dataset.moment===moment);
      b.classList.toggle("off", futur && b.dataset.moment!=="mep");
    });
    document.getElementById("stkStepNote").innerHTML = futur
      ? "Cet événement est <b>à venir</b> : seule la mise en place peut être préparée à l'avance. Le réassort et le comptage restent verrouillés tant que le match n'a pas eu lieu."
      : "Les chiffres de réserve sont lus <b>à la date de l'événement sélectionné</b>, en repartant du dernier inventaire validé du dépôt.";
    document.getElementById("stkTabUnit").classList.toggle("on", view==="unit");
    document.getElementById("stkTabMat").classList.toggle("on", view==="mat");
    document.getElementById("stkExpandAll").textContent = allOpen ? "Tout replier" : "Tout déplier";
    document.getElementById("stkLivrCard").style.display = (moment==="mep" && view==="unit" && !inv) ? "" : "none";
    document.getElementById("stkMatCard").style.display = view==="mat" ? "" : "none";
    document.getElementById("stkProdFilter").style.display = view==="mat" ? "none" : "";
    document.getElementById("stkStandFilter").style.display = view==="mat" ? "none" : "";
  }
  function renderRulesExemple(){ const el=document.getElementById("stkRulesExemple"); if(el) el.innerHTML = rulesExempleHtml(); }
  function render(){ renderChrome(); renderBanner(); renderKpis(); renderTable(); renderMvts(); renderLivr(); renderInvList(); renderRulesExemple(); }

  function refreshProdFilter(){
    const sel=document.getElementById("stkProdFilter");
    sel.innerHTML = `<option value="all">Tous les produits (${products.length})</option>` + products.map(p=>`<option value="${p.id}">${p.nom}</option>`).join("");
    if(!products.some(p=>p.id===prodF)) prodF="all";
    sel.value = prodF;
  }
  function openAll(){ open = new Set(products.map(i=>i.id)); allOpen=true; }
  function refreshEvSel(){
    trier();
    const evSel=document.getElementById("stkEvFilter");
    evSel.innerHTML = TIMELINE.map(t=>{
      const suffixe = t.type==="inventaire" ? (t.statut==="valide"?" — validé":" — à saisir") : "";
      const icone = t.type==="inventaire" ? "📦 " : "⚽ ";
      return `<option value="${t.id}">${icone}${t.lab} · ${jjmm(t.date)}${suffixe}</option>`;
    }).join("");
    evSel.value = ev;
  }

  function mount(){
    if(!seeded){ seedComptes(); seedMvts(); seeded = true; }
    refreshEvSel(); refreshProdFilter(); openAll();
    document.querySelectorAll(".stk-step").forEach(b=> b.onclick = ()=>{
      if(evtEtat()==="a_venir" && b.dataset.moment!=="mep"){ toast("Événement à venir : réassort et comptage verrouillés jusqu'au match"); return; }
      moment=b.dataset.moment; render();
    });
    document.getElementById("stkTabUnit").onclick = ()=>{ view="unit"; refreshProdFilter(); openAll(); render(); };
    document.getElementById("stkTabMat").onclick  = ()=>{ view="mat";  render(); };
    document.getElementById("stkExpandAll").onclick = ()=>{ allOpen ? (open=new Set(), allOpen=false) : openAll(); render(); };
    document.getElementById("stkEvFilter").onchange = e => { ev=e.target.value; openAll(); render(); };
    const sf=document.getElementById("stkStandFilter");
    sf.innerHTML = `<option value="all">Tous les stands (${STANDS.length})</option>` + STANDS.map(s=>`<option value="${s}">${s}</option>`).join("");
    sf.onchange = e => { standF=e.target.value; render(); };
    document.getElementById("stkProdFilter").onchange = e => { prodF=e.target.value; render(); };
    document.getElementById("stkNewInv").onclick = ()=>{
      const d = document.getElementById("stkNewInvDate").value;
      if(!d){ toast("Choisis la date de l'inventaire"); return; }
      if(TIMELINE.some(t=>t.type==="inventaire" && t.date===d)){ toast("Un inventaire existe déjà à cette date"); return; }
      const id = "inv"+(INVS().length+1)+"_"+Date.now().toString().slice(-4);
      TIMELINE.push({id, type:"inventaire", date:d, lab:"Inventaire réserve", statut:"brouillon"});
      trier(); ev=id; refreshEvSel(); render();
      toast(`Inventaire réserve créé au ${jjmm(d)} — saisis les quantités comptées`);
    };
    document.getElementById("stkLvAdd").onclick = () => {
      const pid=document.getElementById("stkLvProd").value;
      const qte=Math.max(1,parseInt(document.getElementById("stkLvQte").value)||0);
      const pu=Math.max(0,parseFloat(document.getElementById("stkLvPu").value)||0);
      const four=document.getElementById("stkLvFour").value.trim()||"Fournisseur";
      const p=byId(pid), avant=cump(p);
      const dv=document.getElementById("stkLvDate").value;
      const d = dv || new Date().toISOString().slice(0,10);
      livraisons.push({date:d,pid,qte,pu,four});
      mvts.push({h:jjmm(d), type:"livraison", nom:p.nom, q:qte, u:"", dest:"Réserve", who:four, pu});
      render(); toast(`Livraison · ${p.nom} +${qte} · coût ${eur3(avant)} → ${eur3(cump(p))}`);
    };
    function toggler(btn,body,chev){
      document.getElementById(btn).onclick = ()=>{ const b=document.getElementById(body), o=b.style.display!=="none";
        b.style.display=o?"none":"block"; if(chev) document.getElementById(chev).textContent=o?"Afficher ▾":"Masquer ▴"; };
    }
    toggler("stkMvtToggle","stkMvtBody","stkMvtChevron");
    render();
  }

  return { markup, mount };
})();

/* ============================================================
   SECTION 2 — Configuration (ex-« Produits », renommée §15.81)
   Modules regroupés : 15b (Config produits — produits des stands
   classiques uniquement depuis §15.76), 15c (recette simple — sous-
   recettes en pause, §15.25), 13 (Click & Collect, qui fait désormais
   autorité sur le prix app depuis §15.76), Configuration cible &
   marge (nouveau, §15.81). Stock (module 4) en est sorti le 28/09
   (§15.81) — devenu module autonome, voir RENDERERS.stock plus bas.
   ============================================================ */
/* ---------------- Module 15b — Config produits ----------------
   Reconstruit fidèlement le 17/09 (§15.57) depuis l'artifact officiel
   dédié (618212a9…), lu intégralement suite au signalement de Rémi
   (« tu n'as pas intégré le bon module, c'est encore un module
   résumé »). Catalogue réel des Spartiates (25 lignes), moteur F déjà
   partagé (aucune formule nouvelle). Paramètres commerciaux du lieu
   VOLONTAIREMENT laissés ici, pas déplacés vers Click & Collect (13) —
   décision motivée au §15.57 : ce module reste la source unique, le
   calculateur C&C (13) n'en est qu'un simulateur en lecture.
   Non porté depuis l'artifact, et pourquoi (disclosure, pas un oubli) :
   éditeur multi-stand par produit (inutile — un produit = un stand ici,
   modèle de données différent du jeu de démo de l'artifact) ; mode de
   stock C&C et suivi de stock par produit (éviterait un doublon avec
   le module Stock déjà validé) ; table ingrédients/recette (aucune
   recette ni prix d'achat réel transmis pour Les Spartiates — inventer
   ces coûts est exclu). */
const Cfg = (function(){
  const GENESE = "0".repeat(64);
  async function sha256Hex(str){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  function court(h){ return h ? h.slice(0,10)+"…"+h.slice(-6) : "—"; }
  function serialiser(evt){ const { empreinte, ...champs } = evt; return JSON.stringify(champs); }
  async function sceller(evtSansEmpreinte, precedente){
    const avecPrec = { ...evtSansEmpreinte, empreinte_precedente: precedente };
    const empreinte = await sha256Hex(serialiser(avecPrec));
    return { ...avecPrec, empreinte };
  }

  // Chaque ligne du catalogue réel des Spartiates reçoit un id, un prix app appliqué
  // (initialisé au prix conseillé) et son propre historique tarifaire — étendu en place
  // sur SPARTIATES.catalogue pour que Marges & ratios (5), Optimisation (6), Alertes (18)
  // et Ventes & CA continuent de lire une seule et même source, jamais une copie séparée.
  SPARTIATES.catalogue.forEach((p,i)=>{
    if(p.id) return; // déjà initialisé (le script ne tourne qu'une fois, garde par sécurité)
    p.id = "cp"+i;
    p.prixApp = Math.round(F.prixAppConseille(p.prix, TVA[p.tva], SPARTIATES.commissionPct, SPARTIATES.kTva, SPARTIATES.stripePct)*100)/100;
    p.tarifs = [{ prix:p.prix, valide_du:"01/01/2026 (initialisation catalogue)" }];
    // §15.71 : deux réglages ajoutés à la demande de Rémi, repris de l'artifact officiel — de
    // simples réglages, rien à inventer pour les ajouter. Stock (§15.67) ne les lit pas encore,
    // disclosed explicitement à l'écran (voir detail()).
    p.modeCC = "partage";
    p.suivi = "unitaire";
    // §15.77 : recette/ingrédients — structure vide, à remplir par Rémi (rien à inventer).
    p.recette = [];
  });
  const items = SPARTIATES.catalogue;
  const item = id => items.find(x=>x.id===id);

  const open = new Set();
  const state = { chaine:[], panierApp:27, stripeContratPct:1.5, stripeContratFixe:0.25 };

  function verdictDe(it){
    const tva = TVA[it.tva];
    const conseille = F.prixAppConseille(it.prix, tva, SPARTIATES.commissionPct, SPARTIATES.kTva, SPARTIATES.stripePct);
    const net = F.resteApp(it.prixApp, tva, it.prix, SPARTIATES.commissionPct, SPARTIATES.kTva, SPARTIATES.stripePct);
    const ecart = F.verdict(it.prixApp, it.prix, tva, SPARTIATES.commissionPct, SPARTIATES.kTva, SPARTIATES.stripePct);
    return { conseille, net, ecart, ecartPctComptoir: it.prix>0 ? (it.prixApp-it.prix)/it.prix*100 : 0 };
  }
  const stripeEffectif = () => state.panierApp>0
    ? (state.stripeContratPct/100*state.panierApp + state.stripeContratFixe) / state.panierApp * 100 : 0;

  async function nouveauTarif(it, nouveauPrix, valideDu){
    const ancienPrix = it.prix;
    it.tarifs.push({ prix:nouveauPrix, valide_du:valideDu });
    it.prix = nouveauPrix;
    const evt = { type:"changement_tarif", produit_id:it.id, produit_nom:it.produit, stand:standNom(it.stand),
      ancien_prix:ancienPrix, nouveau_prix:nouveauPrix, valide_du:valideDu, horodatage:new Date().toLocaleString("fr-FR") };
    const precedente = state.chaine.length ? state.chaine[state.chaine.length-1].empreinte : GENESE;
    const s = await sceller(evt, precedente);
    state.chaine.push(s);
    renderCat(); renderJournalTarifs();
    toast(`${it.produit} (${standNom(it.stand)}) : nouveau tarif ${eur(nouveauPrix)} enregistré, effectif au ${valideDu} — inscrit au journal`);
  }
  async function verifierIntegriteTarifs(){
    let precedente = GENESE, rompt = null;
    for(let i=0;i<state.chaine.length;i++){
      const e = state.chaine[i];
      if(e.empreinte_precedente !== precedente){ rompt = i; break; }
      const attendue = await sha256Hex(serialiser({...e, empreinte:undefined}));
      if(attendue !== e.empreinte){ rompt = i; break; }
      precedente = e.empreinte;
    }
    return rompt;
  }

  function renderParams(){
    document.getElementById("cfgParamRow").innerHTML =
        `<div class="pfield"><label>Commission Break Eat</label><input class="cell" id="cfgCommission" value="${(SPARTIATES.commissionPct*100).toFixed(1)}"><span class="u">% du prix buvette — valeur de test, contrat réel à confirmer</span></div>
        <div class="pfield"><label>Taux Stripe appliqué</label><input class="cell" id="cfgStripe" value="${(SPARTIATES.stripePct*100).toFixed(2)}"><span class="u">% du prix app encaissé — valeur de test</span></div>
        <div class="pfield"><label>k_tva (TVA sur commission)</label><input class="cell" id="cfgKtva" value="${SPARTIATES.kTva.toFixed(1)}"><span class="u">1,0 = récupérée par le lieu (§15.35) · 1,2 = répercutée au client</span></div>
        <div class="pfield"><label>Panier moyen app observé</label><input class="cell" id="cfgPanierApp" value="${state.panierApp.toFixed(2)}"><span class="u">€ TTC — estimation Rémi, sert au contrôle Stripe ci-dessous</span></div>`;
    const maj = () => { patchTout(); };
    document.getElementById("cfgCommission").oninput = e => { SPARTIATES.commissionPct = Math.max(0,(parseFloat(e.target.value.replace(",","."))||0))/100; maj(); };
    document.getElementById("cfgStripe").oninput = e => { SPARTIATES.stripePct = Math.max(0,(parseFloat(e.target.value.replace(",","."))||0))/100; maj(); };
    document.getElementById("cfgKtva").oninput = e => { SPARTIATES.kTva = parseFloat(e.target.value.replace(",","."))||1.0; maj(); };
    document.getElementById("cfgPanierApp").oninput = e => { state.panierApp = Math.max(0,parseFloat(e.target.value.replace(",","."))||0); patchStripe(); };
  }

  function renderStripeAide(){
    document.getElementById("cfgStripeAide").innerHTML = `
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
        <div style="font-size:12.5px;font-weight:700;margin-bottom:4px;">Contrôle — ton forfait Stripe couvre-t-il vraiment tes frais ?</div>
        <div class="hint" style="margin-bottom:8px;">Un contrat Stripe est en général de la forme <i>pourcentage + frais fixe par transaction</i>. Le fixe pèse d'autant plus lourd que le panier est petit — reste à mesurer pour Les Spartiates (§15.20 quater).</div>
        <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
          <div class="pfield" style="width:130px;"><label>Taux du contrat</label><input class="cell" id="cfgSPct" value="${state.stripeContratPct}"><span class="u">%</span></div>
          <div class="pfield" style="width:150px;"><label>Frais fixe</label><input class="cell" id="cfgSFix" value="${state.stripeContratFixe}"><span class="u">€ par transaction</span></div>
          <div style="flex:1;min-width:240px;" id="cfgStripeCout"></div>
        </div>
        <div id="cfgStripeVerdict"></div>
      </div>`;
    document.getElementById("cfgSPct").oninput = e => { state.stripeContratPct = Math.max(0,parseFloat(e.target.value.replace(",","."))||0); patchStripe(); };
    document.getElementById("cfgSFix").oninput = e => { state.stripeContratFixe = Math.max(0,parseFloat(e.target.value.replace(",","."))||0); patchStripe(); };
    patchStripe();
  }
  function patchStripe(){
    const eff = stripeEffectif();
    const ecartPts = eff - SPARTIATES.stripePct*100;
    const perteCmd = ecartPts/100 * state.panierApp;
    const seuil = state.stripeContratPct/100 < SPARTIATES.stripePct
      ? state.stripeContratFixe / (SPARTIATES.stripePct - state.stripeContratPct/100) : null;
    const c = document.getElementById("cfgStripeCout");
    if(c) c.innerHTML = `<div style="font-size:12.5px;">Sur un panier de <b>${eur(state.panierApp)}</b>, ton coût réel est de <b>${eur(state.stripeContratPct/100*state.panierApp + state.stripeContratFixe)}</b>, soit <b>${pct(eff)}</b>.</div>`;
    const v = document.getElementById("cfgStripeVerdict");
    if(!v) return;
    v.innerHTML = Math.abs(ecartPts) < 0.05
      ? `<div style="margin-top:10px;font-size:12.5px;color:var(--green);font-weight:700;">✓ Ton forfait de ${pct(SPARTIATES.stripePct*100)} correspond à ton coût réel à ce panier.</div>`
      : ecartPts > 0
      ? `<div class="alertbox">⚠ Ton forfait de <b>${pct(SPARTIATES.stripePct*100)}</b> sous-couvre de <b>${pct(ecartPts)}</b> : tu perds environ <b>${eur(perteCmd)}</b> sur chaque commande, sans que ça apparaisse nulle part.${seuil ? ` Ce forfait ne s'équilibre qu'à partir d'un panier de <b>${eur(seuil)}</b>.` : ""}</div>`
      : `<div style="margin-top:10px;font-size:12.5px;color:var(--green);font-weight:700;">✓ Ton forfait de ${pct(SPARTIATES.stripePct*100)} couvre ton coût réel (${pct(eff)}) avec ${pct(-ecartPts)} de marge${seuil?` — mais il cesserait de le couvrir si ton panier moyen descendait sous ${eur(seuil)}`:""}.</div>`;
  }

  function prixBuvetteCell(it){
    return `<div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;">
      <span class="num" style="font-weight:700;">${eur(it.prix)}</span>
      <button data-tarif="${it.id}" title="Nouveau tarif daté / historique" style="all:unset;cursor:pointer;font-size:12px;padding:2px 5px;border-radius:6px;background:var(--violet-soft);color:var(--violet);">🕓</button>
    </div>`;
  }
  function histTarifsHtml(it){
    const liste = [...it.tarifs].reverse();
    return `<div class="wf">${liste.map((t,i)=>`<div class="l${i===0?' tot':''}"><span>${i===0?'Prix en vigueur':'Prix précédent'} — depuis le ${t.valide_du}</span><span class="num">${eur(t.prix)}</span></div>`).join("")}</div>`;
  }
  function cellMarge(it){
    const m = F.margeComptoir(it.prix, TVA[it.tva], it.cout);
    const tauxC = F.tauxMarge(m, F.ht(it.prix, TVA[it.tva]));
    return `${eur(m)} <span style="color:var(--muted);">· ${pct(tauxC)}</span>`;
  }
  function verdictHtml(it,v,ok){
    if(ok) return `<span class="badge ok">couvre</span> <span style="font-size:11px;color:var(--muted);">+${eur(v.ecart)} / vente</span>`;
    return `<span class="badge ko">manque ${eur(-v.ecart)}</span>`;
  }
  function cascadeHtml(it){
    const tva = TVA[it.tva], v = verdictDe(it);
    const comHt  = it.prix*SPARTIATES.commissionPct;
    const comTva = comHt*(SPARTIATES.kTva-1);
    const strMontant = it.prixApp*SPARTIATES.stripePct;
    const tvaProduit = it.prixApp - it.prixApp*F.u(tva);
    return `<div class="wf">
        <div class="l"><span>Le client paie (prix app appliqué)</span><span class="num">${eur(it.prixApp)}</span></div>
        <div class="l"><span class="neg">− TVA ${pct(tva*100)} du produit, reversée à l'État</span><span class="num neg">−${eur(tvaProduit)}</span></div>
        <div class="l"><span class="neg">− Frais de paiement ${pct(SPARTIATES.stripePct*100)} sur le prix app</span><span class="num neg">−${eur(strMontant)}</span></div>
        <div class="l"><span class="neg">− Commission ${pct(SPARTIATES.commissionPct*100)} sur le prix buvette</span><span class="num neg">−${eur(comHt)}</span></div>
        ${comTva>0.0001?`<div class="l"><span class="neg">− TVA 20 % sur la commission, répercutée</span><span class="num neg">−${eur(comTva)}</span></div>`:""}
        <div class="l tot"><span>Il te reste, hors taxes</span><span class="num">${eur(v.net)}</span></div>
        <div class="l" style="border-top:1px dashed var(--border);margin-top:6px;padding-top:8px;"><span>Objectif : ta marge hors taxes au comptoir</span><span class="num">${eur(F.resteComptoir(it.prix,tva))}</span></div>
        <div class="l"><span style="font-weight:700;">${v.ecart>=-0.005?"Surplus":"Manque"}</span><span class="num" style="font-weight:800;color:${v.ecart>=-0.005?'var(--green)':'var(--red)'};">${eur(Math.abs(v.ecart))}</span></div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button class="cta ghost" data-appliquer="${it.id}">Appliquer le prix conseillé (${eur(v.conseille)})</button>
        <span style="font-size:11.5px;color:var(--muted);">écart vs comptoir : <b style="color:${v.ecartPctComptoir>20?'var(--amber)':'var(--text)'};">${pct(v.ecartPctComptoir)}</b></span>
      </div>
      ${v.ecartPctComptoir > 20 ? `<div class="alertbox">⚠ Le prix app dépasse le prix comptoir de ${pct(v.ecartPctComptoir)}. Arbitrage à faire en connaissance de cause.</div>` : ""}`;
  }
  // §15.77 : Recette / ingrédients — levée de la pause §15.25 à la demande de Rémi. Structure de
  // saisie manuelle VIDE par produit (nom, quantité, unité) — aucune recette ni coût d'ingrédient
  // réel n'a été transmis pour Les Spartiates, rien n'est inventé pour préremplir. Ne recalcule
  // pas le coût matière (it.cout reste saisi indépendamment) : établir ce lien supposerait un prix
  // d'achat par ingrédient fiable, qui n'existe pas encore (règle absolue : ne rien inventer).
  function recetteHtml(it){
    const lignes = it.recette || [];
    return `<div id="cfgRec_${it.id}">
      ${lignes.length===0 ? `<div class="hint" style="margin-bottom:8px;">Aucune ligne — ajoute les ingrédients de ce produit ci-dessous.</div>` : `
      <table style="margin-bottom:8px;"><thead><tr><th>Ingrédient</th><th class="r">Quantité</th><th>Unité</th><th></th></tr></thead><tbody>
      ${lignes.map((l,i)=>`<tr>
        <td><input class="cell txt" style="text-align:left;" data-recnom="${it.id}_${i}" value="${l.nom}" placeholder="Nom de l'ingrédient"></td>
        <td class="r"><input class="cell sm" type="number" step="0.01" min="0" data-recqte="${it.id}_${i}" value="${l.qte}"></td>
        <td><input class="cell txt" style="width:70px;text-align:left;" data-recunite="${it.id}_${i}" value="${l.unite}" placeholder="g, cl, pièce…"></td>
        <td class="r"><button class="cta ghost" style="padding:3px 8px;font-size:11px;" data-recdel="${it.id}_${i}">Retirer</button></td>
      </tr>`).join("")}
      </tbody></table>`}
      <button class="cta ghost" data-recadd="${it.id}">+ Ajouter un ingrédient</button>
    </div>`;
  }

  function detail(it){
    return `<div class="dgrid" style="display:grid;grid-template-columns:1.1fr 1fr;gap:18px;padding:4px 2px 8px;">
      <div class="dbox" style="background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px;">
        <h4 style="margin:0 0 8px;font-size:12.5px;font-weight:800;">Suivi du stock <span class="chip warn">réglage non encore lu par Stock</span></h4>
        <div class="sub" style="font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5;">Ajouté le 28/09 (§15.71) à la demande de Rémi : ce réglage est enregistré ici, mais le module Stock (§15.67) ne le lit pas encore.</div>
        ${[["unitaire","À l'unité","on compte des objets"],
           ["matiere","Au poids ou au volume","vendu à la portion, stocké en vrac"]]
          .map(([val,lab,d])=>`<label class="opt" style="display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:12.5px;cursor:pointer;"><input type="radio" name="cfgsv_${it.id}" data-sv="${val}" data-id="${it.id}" ${it.suivi===val?"checked":""} style="margin-top:2px;flex-shrink:0;">
            <span><b>${lab}</b><div class="d" style="font-size:10.5px;color:var(--muted);">${d}</div></span></label>`).join("")}
      </div>
      <div class="dbox" style="background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px;">
        <h4 style="margin:0 0 8px;font-size:12.5px;font-weight:800;">Historique tarifaire — prix buvette</h4>
        <div class="sub" style="font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5;">Le prix ne se modifie plus en place (§15.30) : chaque changement est daté, conservé, et inscrit au journal des tarifs ci-dessous.</div>
        <div>${histTarifsHtml(it)}</div>
        <div style="display:flex;gap:8px;align-items:flex-end;margin-top:10px;flex-wrap:wrap;">
          <div class="pfield" style="width:150px;"><label>Nouveau tarif effectif au</label><input class="cell" type="date" id="cfgTarifDate_${it.id}" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="pfield" style="width:110px;"><label>Nouveau prix</label><input class="cell" id="cfgTarifPrix_${it.id}" value="${it.prix.toFixed(2)}"><span class="u">€</span></div>
          <button class="cta ghost" data-newtarif="${it.id}">Enregistrer</button>
        </div>

/* ---------------- Module 13 — Click & Collect (calculateur de prix) ----------------
   Porté fidèlement le 14/09 (§15.48) depuis l'artifact officiel dédié
   (98002341…), lu intégralement suite au signalement de Rémi (« on a
   oublié ce module », deux fois). Calculateur autonome : réutilise
   exactement le moteur F déjà construit pour Config produits (15b),
   aucune formule nouvelle. Démarre sur un produit réel des Spartiates
   (premier produit d'un stand avec point de retrait C&C) et les
   réglages réels (commission/Stripe/k_tva de Config produits) plutôt
   que sur le jeu de test générique de l'artifact officiel — entièrement
   modifiable pour simuler n'importe quel scénario. */
const Cc = (function(){
  const eur2 = n => (Math.round(n*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
  const pct1 = n => (Math.round(n*10)/10).toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1})+" %";

  const defautProduit = SPARTIATES.catalogue.find(p=>{
    const s = SPARTIATES.stands.find(x=>x.id===p.stand);
    return s && s.pointRetraitCC;
  }) || SPARTIATES.catalogue[0];

  const state = {
    prixBuvette: defautProduit.prix,
    tva: TVA[defautProduit.tva]*100,
    commission: SPARTIATES.commissionPct*100,
    stripe: SPARTIATES.stripePct*100,
    kTva: SPARTIATES.kTva>=1.2,
    prixApp: null,
  };
  function conseilleActuel(){
    return F.prixAppConseille(state.prixBuvette, state.tva/100, state.commission/100, state.kTva?1.2:1.0, state.stripe/100);
  }
  if(state.prixApp===null) state.prixApp = Math.round(conseilleActuel()*100)/100;

  // §15.68 : resynchronise commission/Stripe/k_tva depuis les paramètres du lieu (source unique,
  // désormais réglés ici même — §15.76) à chaque OUVERTURE du simulateur libre. N'écrase pas une
  // simulation en cours dans les champs : appelée uniquement à l'ouverture, pas à chaque frappe.
  function syncFromConfig(){
    state.commission = SPARTIATES.commissionPct*100;
    state.stripe = SPARTIATES.stripePct*100;
    state.kTva = SPARTIATES.kTva>=1.2;
  }

  // ---------------------------------------------------------------
  // §15.76 — Paramètres commerciaux du lieu (déplacés depuis Config produits, §15.57 renversée

  // Click & Collect, donc ils vivent ici désormais. Repris tel quel, aucune formule changée.
  // ---------------------------------------------------------------
  const lieu = { stripeContratPct:1.5, stripeContratFixe:0.25, panierApp:27 };
  const stripeEffectif = () => lieu.panierApp>0
    ? (lieu.stripeContratPct/100*lieu.panierApp + lieu.stripeContratFixe) / lieu.panierApp * 100 : 0;

  function renderParamsLieu(){
    return `<div class="card">

  }
  function renderParamRow(){

      <div class="pfield"><label>Taux Stripe appliqué</label><input class="cell" id="ccLieuStripe" value="${(SPARTIATES.stripePct*100).toFixed(2)}"><span class="u">% du prix app encaissé — valeur de test</span></div>

    document.getElementById("ccLieuSFix").oninput = e => { lieu.stripeContratFixe = Math.max(0,parseFloat(e.target.value.replace(",","."))||0); patchStripeAide(); };

  function patchStripeAide(){

  // ---------------------------------------------------------------

  function calc(){
    const tauxTva=state.tva/100, commission=state.commission/100, stripe=state.stripe/100, kTva=state.kTva?1.2:1.0;
    const conseille = F.prixAppConseille(state.prixBuvette, tauxTva, commission, kTva, stripe);
    const resteComptoir = F.resteComptoir(state.prixBuvette, tauxTva);
    const resteApp = F.resteApp(state.prixApp, tauxTva, state.prixBuvette, commission, kTva, stripe);
    const verdict = F.verdict(state.prixApp, state.prixBuvette, tauxTva, commission, kTva, stripe);
    const u = F.u(tauxTva);
    const commissionHt = state.prixBuvette*commission;
    const commissionMontant = state.prixBuvette*commission*kTva;
    const commissionTva = commissionMontant-commissionHt;
    const tvaProduitMontant = state.prixApp - state.prixApp*u;
    const stripeMontant = state.prixApp*stripe;
    const ecartPct = state.prixBuvette>0 ? (state.prixApp-state.prixBuvette)/state.prixBuvette*100 : 0;
    const ecartConseillePct = state.prixBuvette>0 ? (conseille-state.prixBuvette)/state.prixBuvette*100 : 0;
    return { tauxTva, commission, stripe, kTva, conseille, resteComptoir, resteApp, verdict, commissionHt, commissionTva, tvaProduitMontant, stripeMontant, ecartPct, ecartConseillePct };

const PILOTAGE_CIBLES_PRODUIT = {};
function cibleEffective(produitId, categorie){

function demoVenduCatalogue(i, eid){
  const mepBase = 25 + (i*7)%55;
  const mep = Math.max(1, Math.round(mepBase*PIL_EVT_FACTOR[eid]));

}

const Mrg = (function(){
  const eur0 = n => Math.round(n||0).toLocaleString("fr-FR")+" €";
  const eur3 = n => (n||0).toLocaleString("fr-FR",{minimumFractionDigits:3,maximumFractionDigits:3})+" €";
  const fq = n => n.toLocaleString("fr-FR",{maximumFractionDigits:3});

  // Prix d'achat fournisseurs — jeu de test officiel (artifact "Marges & ratios", 613e5e12…)
  // repris tel quel : Stock n'a aujourd'hui aucune livraison réelle saisie pour Les Spartiates
  // (§15.44), donc rien de réel à comparer. Signalé comme générique à l'écran.
  const FOURNISSEURS = [{id:"f1",nom:"Metro"},{id:"f2",nom:"Brake France"},{id:"f3",nom:"Promocash"}];
  const ACHATS = [
    {gid:"g5", ing:"Bière blonde pression", unite:"L",  fid:"f1", cond:"Fût",    contenance:30, prix:144.00, date:"18/08/2026"},
    {gid:"g5", ing:"Bière blonde pression", unite:"L",  fid:"f2", cond:"Fût",    contenance:50, prix:225.00, date:"20/08/2026"},
    {gid:"g5", ing:"Bière blonde pression", unite:"L",  fid:"f3", cond:"Fût",    contenance:30, prix:151.50, date:"02/09/2026"},
    {gid:"g0", ing:"Pommes de terre / frites", unite:"kg", fid:"f1", cond:"Sac", contenance:10, prix:22.00, date:"18/08/2026"},
    {gid:"g0", ing:"Pommes de terre / frites", unite:"kg", fid:"f2", cond:"Sac", contenance:25, prix:53.75, date:"02/09/2026"},
    {gid:"g3", ing:"Pain à hot-dog", unite:"u",  fid:"f1", cond:"Sachet", contenance:8,  prix:2.00, date:"18/08/2026"},
    {gid:"g3", ing:"Pain à hot-dog", unite:"u",  fid:"f3", cond:"Carton", contenance:96, prix:22.08, date:"02/09/2026"},
    {gid:"g4", ing:"Saucisse", unite:"u",        fid:"f1", cond:"Colis",  contenance:50, prix:47.50, date:"18/08/2026"},
    {gid:"g4", ing:"Saucisse", unite:"u",        fid:"f2", cond:"Colis",  contenance:100,prix:92.00, date:"02/09/2026"},
    {gid:"g8", ing:"Pâte à tartiner", unite:"kg", fid:"f1", cond:"Pot",    contenance:1,  prix:6.90, date:"18/08/2026"},
    {gid:"g8", ing:"Pâte à tartiner", unite:"kg", fid:"f2", cond:"Seau",   contenance:5,  prix:28.50, date:"02/09/2026"},
    {gid:"g8", ing:"Pâte à tartiner", unite:"kg", fid:"f3", cond:"Pot",    contenance:1,  prix:6.50, date:"02/09/2026"},
  ];
  const CONSO_EVT = { g5:62, g0:24, g3:118, g4:118, g8:1.4 };
  const prixU = a => a.prix/a.contenance;

  let sel = "all", onglet = "produits";
  // §15.90 : filtres de l'onglet « Par produit », demandés par Rémi pour retrouver un produit
  // vendu sous le même nom sur plusieurs stands (Hot dog, Nachos, Soda, Bière 50cl...) sans les
  // voir tous mélangés dans le tableau.
  let filtreStand = "all", filtreProduit = "";
  const ouvertes = new Set();
  const evts = () => sel==="all" ? PIL_SOIREES : PIL_SOIREES.filter(e=>e.id===sel);

  function ligne(p, i, es){
    const tauxTva = TVA[p.tva];
    const stand = SPARTIATES.stands.find(s=>s.id===p.stand);
    let qC=0, qA=0;
    es.forEach(e=>{
      const v = demoVenduCatalogue(i, e.id);
      if(stand.pointRetraitCC){ const a=Math.round(v*0.22); qA+=a; qC+=v-a; }
      else qC+=v;
    });
    const pa = F.prixAppConseille(p.prix, tauxTva, SPARTIATES.commissionPct, SPARTIATES.kTva, SPARTIATES.stripePct);
    const margeUC = F.margeComptoir(p.prix, tauxTva, p.cout);
    const margeUA = F.margeApp(pa, tauxTva, p.cout, SPARTIATES.stripePct, p.prix, SPARTIATES.commissionPct, SPARTIATES.kTva);
    const stripeU = pa*SPARTIATES.stripePct, commU = p.prix*SPARTIATES.commissionPct*SPARTIATES.kTva;
    const caHtC = F.ht(p.prix,tauxTva)*qC, coutC=p.cout*qC, margeC=margeUC*qC;
    const caHtA = F.ht(pa,tauxTva)*qA, coutA=p.cout*qA, margeA=margeUA*qA;
    const tauxC = caHtC>0 ? F.tauxMarge(margeC,caHtC) : null;
    const tauxA = caHtA>0 ? F.tauxMarge(margeA,caHtA) : null;
    const caHt=caHtC+caHtA, cout=coutC+coutA, marge=margeC+margeA;
    const taux = caHt>0 ? F.tauxMarge(marge,caHt) : null;
    const ecart = (qC>0 && qA>0) ? margeUA-margeUC : null;
    const encaisseTtc = p.prix*qC + pa*qA;
    return { p, i, stand, qC,qA,q:qC+qA, pa, encaisseTtc, caHt,cout,marge,taux, caHtC,coutC,margeC,tauxC, caHtA,coutA,margeA,tauxA, stripeU,commU, margeUC,margeUA, ecart, cat: CATEGORIE_TVA[p.tva] };
  }
  const lignes = () => SPARTIATES.catalogue.map((p,i)=>ligne(p,i,evts()));
  // Instantané saison complète — utilisé par Optimisation (6) et Centre d'alertes (18)
  // pour lire sans recalculer, quel que soit le filtre période choisi ici.
  const snapshotSaison = () => SPARTIATES.catalogue.map((p,i)=>ligne(p,i,PIL_SOIREES));

  const etatCible = L => {
    const c = cibleEffective(L.p.id, L.cat);
    if(c===null || c===undefined || L.taux===null) return null;
    return L.taux >= c ? "ok" : (L.taux >= c-5 ? "warn" : "bad");
  };

  function renderBar(){
    return `<div class="pfield" style="max-width:300px;"><label>Période analysée</label>
      <select class="cell" id="mrgEvt" style="width:100%;text-align:left;">
        <option value="all" ${sel==="all"?"selected":""}>Les ${PIL_SOIREES.length} soirées de la saison</option>
        ${PIL_SOIREES.map(e=>`<option value="${e.id}" ${sel===e.id?"selected":""}>${e.lab} — ${e.date}</option>`).join("")}
      </select></div>`;
  }
  function renderPeriode(){
    const es = evts();
    return `<div class="card" style="background:var(--violet-soft);border-color:var(--field-border);padding:10px 14px;"><b>${es.length===1?`${es[0].lab} — ${es[0].date}`:`${es.length} soirées · ${es.map(e=>e.lab).join(" · ")}`}</b></div>`;
  }
  function renderKpis(){
    const L = lignes();
    const enc=L.reduce((a,x)=>a+x.encaisseTtc,0), caHt=L.reduce((a,x)=>a+x.caHt,0), cout=L.reduce((a,x)=>a+x.cout,0), marge=L.reduce((a,x)=>a+x.marge,0);
    const taux = caHt>0?marge/caHt*100:0;
    return `<div class="kpis">
      <div class="kpi"><div class="v num">${eur0(enc)}</div><div class="l">Encaissé TTC</div><div class="s">ce que les clients ont payé, TVA comprise</div></div>
      <div class="kpi"><div class="v num">${eur0(caHt)}</div><div class="l">Chiffre d'affaires HT</div><div class="s">l'encaissé moins la TVA collectée</div></div>
      <div class="kpi"><div class="v num">${eur0(cout)}</div><div class="l">Coût matière HT</div><div class="s">valeurs illustratives — non transmises pour ce lieu</div></div>
      <div class="kpi"><div class="v num">${eur0(marge)} <span style="font-size:13px;color:var(--muted);">· ${pct(taux)}</span></div><div class="l">Marge brute</div><div class="s">avant salaires, loyer et charges</div></div>
    </div>`;
  }

  function ecartHtml(x){
    if(x.ecart===null) return `<span class="chip grey">un seul canal</span>`;
    const e = x.ecart;
    const cls = e >= -0.005 ? "ok" : e >= -0.15 ? "warn" : "bad";
    return `<span style="color:var(--muted);font-size:11.5px;">${eur(x.margeUC)} → ${eur(x.margeUA)}</span> <span class="chip ${cls}">${e>=0?"+":"−"}${eur(Math.abs(e))}</span>`;
  }

  function detail(x){
    return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding:4px 0;">
      <div>
        <div style="font-weight:700;margin-bottom:6px;">Comptoir <span class="chip">${x.qC} vendus</span></div>
        <div class="wf">
          <div class="l"><span>Prix buvette TTC</span><span class="num">${eur(x.p.prix)}</span></div>
          <div class="l"><span class="neg">− TVA ${pct(TVA[x.p.tva]*100)}</span><span class="num neg">−${eur(x.p.prix-F.ht(x.p.prix,TVA[x.p.tva]))}</span></div>
          <div class="l"><span>CA HT par unité</span><span class="num">${eur(F.ht(x.p.prix,TVA[x.p.tva]))}</span></div>
          <div class="l"><span class="neg">− Coût matière</span><span class="num neg">−${eur(x.p.cout)}</span></div>
          <div class="l tot"><span>Marge brute par unité</span><span class="num">${eur(x.margeUC)}</span></div>
        </div>
        <div style="margin-top:8px;font-size:12.5px;">Sur la période : <b>${eur(x.margeC)}</b> de marge${x.tauxC!==null?`, soit ${pct(x.tauxC)}`:""}</div>
      </div>
      <div>
        <div style="font-weight:700;margin-bottom:6px;">Click &amp; Collect <span class="chip cc">${x.qA} vendus</span></div>
        ${!x.stand.pointRetraitCC ? `<div style="color:var(--muted);font-size:12px;">${standNom(x.p.stand)} n'a pas de point de retrait C&amp;C (§15.31).</div>` : `
        <div class="wf">
          <div class="l"><span>Prix app conseillé TTC</span><span class="num">${eur(x.pa)}</span></div>
          <div class="l"><span class="neg">− TVA ${pct(TVA[x.p.tva]*100)}</span><span class="num neg">−${eur(x.pa-F.ht(x.pa,TVA[x.p.tva]))}</span></div>
          <div class="l"><span>CA HT par unité</span><span class="num">${eur(F.ht(x.pa,TVA[x.p.tva]))}</span></div>
          <div class="l"><span class="neg">− Coût matière</span><span class="num neg">−${eur(x.p.cout)}</span></div>
          <div class="l"><span class="neg">− Frais Stripe ${pct(SPARTIATES.stripePct*100)}</span><span class="num neg">−${eur(x.stripeU)}</span></div>
          <div class="l"><span class="neg">− Commission ${pct(SPARTIATES.commissionPct*100)}${SPARTIATES.kTva!==1?` ×${SPARTIATES.kTva}`:""}</span><span class="num neg">−${eur(x.commU)}</span></div>
          <div class="l tot"><span>Marge brute par unité</span><span class="num">${eur(x.margeUA)}</span></div>
        </div>
        <div style="margin-top:8px;font-size:12.5px;">Sur la période : <b>${eur(x.margeA)}</b> de marge${x.tauxA!==null?`, soit ${pct(x.tauxA)}`:""}</div>`}
      </div>
      <div>
        <div style="font-weight:700;margin-bottom:6px;">Lecture de l'écart</div>
        ${x.ecart===null
          ? `<div style="font-size:12.5px;color:var(--muted);">Ce produit n'est vendu que sur un seul canal sur cette période — rien à comparer.</div>`
          : `<div style="font-size:12.5px;line-height:1.6;">Une vente C&amp;C rapporte <b>${eur(x.margeUA)}</b>, contre <b>${eur(x.margeUC)}</b> au comptoir, soit <b style="color:${x.ecart>=0?'var(--green)':'var(--red)'};">${x.ecart>=0?"+":"−"}${eur(Math.abs(x.ecart))} par vente</b>. ${x.ecart>=-0.005?"Le prix app conseillé couvre les frais du canal — le réglage tient.":"Le prix app ne couvre pas les frais du canal — ça se corrige dans Config produits, pas ici."}
          <div style="background:var(--violet-soft);border:1px solid var(--field-border);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:11.5px;">Entre deux canaux, seule la marge en euros par vente se compare — le taux est mécaniquement plus bas sur l'app car le prix (donc le dénominateur) y est plus élevé.</div>`}
      </div>
    </div>`;
  }

  function vueProduits(){
    let L = lignes();
    if(filtreStand!=="all") L = L.filter(x=>x.p.stand===filtreStand);
    if(filtreProduit.trim()){ const q=filtreProduit.trim().toLowerCase(); L = L.filter(x=>x.p.produit.toLowerCase().includes(q)); }
    L = L.sort((a,b)=>b.marge-a.marge);
    const sansCible = Object.values(PILOTAGE_CIBLES).every(c=>c===null);
    let h = `<div class="card">
      <strong class="title">Marge par produit — comptoir et Click &amp; Collect séparés</strong>
      <div class="hint">Un même produit ne rapporte pas la même chose selon le canal (commission + frais Stripe sur l'app). Déplie une ligne pour voir le détail. Volumes de vente : aucun historique réel pour Les Spartiates — même génération déterministe que Stock (module 4), signalée.</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 12px;">
        <div class="pfield" style="max-width:220px;"><label>Stand</label>
          <select class="cell" id="mrgFiltreStand">
            <option value="all" ${filtreStand==="all"?"selected":""}>Tous les stands</option>
            ${SPARTIATES.stands.map(s=>`<option value="${s.id}" ${filtreStand===s.id?"selected":""}>${s.nom}</option>`).join("")}
          </select>
        </div>
        <div class="pfield" style="max-width:280px;flex:1;"><label>Rechercher un produit</label>
          <input class="cell" id="mrgFiltreProduit" type="text" placeholder="ex. Hot dog, Bière 50cl…" value="${filtreProduit.replace(/"/g,"&quot;")}">
        </div>
      </div>
      ${sansCible?`<div class="alertbox" style="margin-bottom:12px;">Aucune cible de marge n'est saisie (onglet « Cibles de marge ») — les taux réels s'affichent sans jugement, volontairement : une cible inventée ne vaudrait rien.</div>`:""}
      ${L.length===0?`<div class="hint">Aucun produit ne correspond à ce filtre.</div>`:""}
      <div style="overflow-x:auto;"><table>
        <tr><th>Stand</th><th>Produit</th><th class="r">Vendus</th><th class="r">Encaissé TTC</th><th class="r">CA HT</th><th class="r">Coût matière</th><th class="r">Marge brute</th><th class="r">Taux</th><th class="r">Marge/vente — app vs comptoir</th></tr>`;
    L.forEach(x=>{
      const id = x.p.stand+"_"+x.p.produit.replace(/\s+/g,"");
      const st = etatCible(x);
      h += `<tr class="parent" data-tog="${id}">
        <td>${standNom(x.p.stand)}</td>
        <td style="font-weight:600;"><span class="caret ${ouvertes.has(id)?'open':''}">▶</span> ${x.p.produit}<div style="font-size:11px;color:var(--muted);font-weight:400;">${x.cat} · TVA ${pct(TVA[x.p.tva]*100)}</div></td>
        <td class="r num">${x.q}</td>
        <td class="r num" style="color:var(--muted);">${eur(x.encaisseTtc)}</td>
        <td class="r num">${eur(x.caHt)}</td>
        <td class="r num" style="color:var(--muted);">${eur(x.cout)} <span class="chip warn">démo</span></td>
        <td class="r num" style="font-weight:700;">${eur(x.marge)}</td>
        <td class="r num">${x.taux===null?"—":pct(x.taux)} ${st?`<span class="chip ${st}">${st==="ok"?"cible tenue":st==="warn"?"sous la cible":"décroche"}</span>`:""}</td>
        <td class="r">${ecartHtml(x)}</td></tr>`;
      if(ouvertes.has(id)) h += `<tr class="detail"><td colspan="9">${detail(x)}</td></tr>`;
    });
    const T = L.reduce((a,x)=>({enc:a.enc+x.encaisseTtc,ca:a.ca+x.caHt,co:a.co+x.cout,mg:a.mg+x.marge,q:a.q+x.q}),{enc:0,ca:0,co:0,mg:0,q:0});
    h += `</table></div>
      <div class="hint" style="margin-top:8px;">Total ${L.length} lignes catalogue · ${T.q} ventes · ${eur(T.mg)} de marge (${pct(T.ca>0?T.mg/T.ca*100:0)})</div>
    </div>`;
    return h;
  }
  function wireProduits(){
    document.querySelectorAll("#mrgPanel tr.parent[data-tog]").forEach(tr=>{
      tr.onclick = () => { const id=tr.dataset.tog; ouvertes.has(id)?ouvertes.delete(id):ouvertes.add(id); renderPanel(); wirePanel(); };
    });
    const fs = document.getElementById("mrgFiltreStand");
    if(fs) fs.onchange = e => { filtreStand = e.target.value; renderPanel(); wirePanel(); };
    const fp = document.getElementById("mrgFiltreProduit");
    if(fp) fp.oninput = e => {
      filtreProduit = e.target.value;
      const pos = e.target.selectionStart;
      renderPanel(); wirePanel();
      // Garde le focus et la position du curseur après le réaffichage du tableau filtré
      // (sinon chaque frappe fait perdre le focus — même souci déjà résolu ailleurs, §15.83).
      const el = document.getElementById("mrgFiltreProduit");
      if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){ } }
    };
  }

  function vueFournisseurs(){
    const gids = [...new Set(ACHATS.map(a=>a.gid))];

    gids.forEach(gid=>{
      const rows = ACHATS.filter(a=>a.gid===gid).sort((a,b)=>prixU(a)-prixU(b));
      const best = prixU(rows[0]);
      const conso = CONSO_EVT[gid]||null;

        ${rows.map((a,i)=>{
          const pu=prixU(a), ec=(pu-best)/best*100;
          const couvre = conso ? a.contenance/conso : null;

            <td style="color:var(--muted);">${a.date}</td></tr>`;
        }).join("")}
        </table></div>`;
      const alerte = (conso && rows[0].contenance/conso>1.5) ? rows[0] : null;
      if(alerte){ const couvre=alerte.contenance/conso;
        h += `<div class="alertbox">⚠ Le moins cher au ${alerte.unite} est aussi le plus gros conditionnement : couvre ${fq(Math.round(couvre*10)/10)} événements de consommation. Sur un produit frais ou un fût entamé, ce qui reste peut coûter plus cher que l'économie faite à l'achat.</div>`;
      }
      h += `</div>`;
    });
    h += `</div>`;
    return h;

  function vueCibles(){

      <div class="hint">Cibles saisies par le directeur, jamais préremplies — aucun référentiel public fiable pour une buvette de stade. Tant qu'une case est vide, l'écran affiche les taux réels sans les juger. Partagées avec le Centre d'alertes (module 18).</div>

      ${CATS.map(c=>{
        const L = snapshotSaison().filter(x=>x.cat===c);
        const ca=L.reduce((a,x)=>a+x.caHt,0), mg=L.reduce((a,x)=>a+x.marge,0);
        const reel = ca>0?mg/ca*100:null, cib=PILOTAGE_CIBLES[c];

        return `<tr><td style="font-weight:600;">${c}</td>

          <td class="r num" id="mrgEc_${c}">${ec===null?'<span class="chip grey">aucune cible</span>':`<span class="chip ${ec>=0?'ok':ec>=-5?'warn':'bad'}">${ec>=0?"+":""}${pct(ec)}</span>`}</td>
          <td style="color:var(--muted);font-size:12px;">${L.length} lignes · ${eur(mg)} de marge</td></tr>`;
      }).join("")}
      </table></div>
    </div>
    <div class="card">
      <strong class="title">Cibles de taux de marge, par produit <span class="chip vio">ajouté §15.78</span></strong>

      <div style="overflow-x:auto;"><table><tr><th>Stand</th><th>Produit</th><th class="r">Cible produit</th><th class="r">Cible effective</th><th class="r">Taux réel — saison</th><th class="r">Écart</th></tr>
      ${snapshotSaison().map(L=>{
        const cp = PILOTAGE_CIBLES_PRODUIT[L.p.id];
        const eff = cibleEffective(L.p.id, L.cat);
        const ec = (eff!==null && eff!==undefined && L.taux!==null) ? L.taux-eff : null;
        return `<tr><td>${standNom(L.p.stand)}</td><td>${L.p.produit}<div style="font-size:11px;color:var(--muted);">${L.cat}</div></td>
          <td class="r"><input class="cell" style="width:70px;" type="number" step="1" min="0" max="100" data-cibleprod="${L.p.id}" value="${cp===undefined||cp===null?"":cp}" placeholder="—"> %</td>
          <td class="r num" id="mrgCibEff_${L.p.id}">${eff===null||eff===undefined?"—":pct(eff)}</td>
          <td class="r num">${L.taux===null?"—":pct(L.taux)}</td>
          <td class="r num" id="mrgEcP_${L.p.id}">${ec===null?'<span class="chip grey">aucune cible</span>':`<span class="chip ${ec>=0?'ok':ec>=-5?'warn':'bad'}">${ec>=0?"+":""}${pct(ec)}</span>`}</td></tr>`;
      }).join("")}
      </table></div>
    </div>`;
  }
  function wireCibles(){
    document.querySelectorAll("#mrgPanel input[data-cat]").forEach(i=>{
      i.oninput = e=>{
        const v=e.target.value.trim();
        PILOTAGE_CIBLES[e.target.dataset.cat] = v===""?null:Math.max(0,Math.min(100,parseFloat(v)||0));
        patchCibles();
      };
    });
    document.querySelectorAll("#mrgPanel input[data-cibleprod]").forEach(i=>{
      i.oninput = e=>{
        const v=e.target.value.trim();
        PILOTAGE_CIBLES_PRODUIT[e.target.dataset.cibleprod] = v===""?null:Math.max(0,Math.min(100,parseFloat(v)||0));
        patchCibles();
      };
    });
  }
  function patchCibles(){
    Object.keys(PILOTAGE_CIBLES).forEach(c=>{
      const L = snapshotSaison().filter(x=>x.cat===c);
      const ca=L.reduce((a,x)=>a+x.caHt,0), mg=L.reduce((a,x)=>a+x.marge,0);
      const reel=ca>0?mg/ca*100:null, cib=PILOTAGE_CIBLES[c];
      const ec=(cib!==null&&reel!==null)?reel-cib:null;
      const el=document.getElementById("mrgEc_"+c);
      if(el) el.innerHTML = ec===null?'<span class="chip grey">aucune cible</span>':`<span class="chip ${ec>=0?'ok':ec>=-5?'warn':'bad'}">${ec>=0?"+":""}${pct(ec)}</span>`;
    });
    snapshotSaison().forEach(L=>{
      const eff = cibleEffective(L.p.id, L.cat);
      const ec = (eff!==null && eff!==undefined && L.taux!==null) ? L.taux-eff : null;
      const elE=document.getElementById("mrgCibEff_"+L.p.id);
      if(elE) elE.textContent = eff===null||eff===undefined?"—":pct(eff);
      const elP=document.getElementById("mrgEcP_"+L.p.id);
      if(elP) elP.innerHTML = ec===null?'<span class="chip grey">aucune cible</span>':`<span class="chip ${ec>=0?'ok':ec>=-5?'warn':'bad'}">${ec>=0?"+":""}${pct(ec)}</span>`;
    });
  }

  const ONGLETS = [["produits","Par produit"],["fournisseurs","Prix d'achat fournisseurs"],["cibles","Cibles de marge"]];
  function renderTabs(){
    return `<div class="cmd-tabs">${ONGLETS.map(([k,l])=>`<button class="cmd-tabbtn mrg-tabbtn ${onglet===k?'active':''}" data-tab="${k}">${l}</button>`).join("")}</div>`;
  }
  function renderPanelInner(){
    if(onglet==="produits") return vueProduits();
    if(onglet==="fournisseurs") return vueFournisseurs();
    return vueCibles();
  }
  function renderPanel(){
    const el = document.getElementById("mrgPanel");
    if(el) el.innerHTML = renderPanelInner();
  }
  function wirePanel(){
    if(onglet==="produits") wireProduits();
    if(onglet==="cibles") wireCibles();
  }

  function markup(){
    return `
    <div class="card">
      <strong class="title">Marges &amp; ratios par produit</strong>
      <div class="hint">Taux de marge = marge brute ÷ CA HT — calculé séparément par canal, ne se compare jamais entre deux canaux à prix différents (règle transverse §3).</div>
      ${renderBar()}
    </div>
    ${renderPeriode()}
    ${renderKpis()}
    ${renderTabs()}
    <div id="mrgPanel">${renderPanelInner()}</div>
    ${rulesBlock("marges-ratios","comment ces chiffres sont calculés (module 5)", `
      <b>Marge par unité, comptoir</b> : <code>HT(prix buvette) − coût matière</code> (fiche « Marge unitaire par canal », moteur F commun à tout FlaiX Expert).<br><br>
      <b>Marge par unité, Click &amp; Collect</b> : <code>HT(prix app) − coût matière − frais Stripe − commission Break Eat</code>, la commission étant assise sur le <b>prix buvette</b> (pas le prix app) — même moteur que Config produits (15b), une seule source pour prix/commission/Stripe/k_tva.<br><br>
      <b>Entre deux canaux, on compare des euros par vente, jamais des taux</b> : le prix app étant plus élevé, il gonfle le CA HT au dénominateur et fait mécaniquement baisser le taux même quand la vente rapporte davantage.<br><br>
      <b>Volumes de vente</b> : aucun historique réel pour Les Spartiates — même génération déterministe (et les mêmes totaux) que celle déjà utilisée et signalée dans Stock (module 4), reprise ici sans dupliquer ni modifier ce module déjà validé.<br><br>
      <b>Cibles de marge</b> : saisies par le directeur, par catégorie — jamais préremplies. Partagées avec le Centre d'alertes (module 18).<br><br>
      <b>Filtres stand / recherche produit</b> <span class="chip vio">ajoutés §15.90</span> : ne recalculent rien, filtrent seulement les lignes déjà calculées ci-dessus — utile car plusieurs produits (Hot dog, Nachos, Soda, Bière 50cl…) existent sous le même nom sur plusieurs stands à la fois.<br><br>
      <b>Prix d'achat fournisseurs</b> : jeu de test générique repris de l'artifact officiel, Stock n'ayant aujourd'hui aucune livraison réelle saisie pour ce lieu.

  // §15.80 : lieu réel de l'affectation — un vrai stand des Spartiates (ou Click & Collect,
  // qui n'est pas un poste physique) + une caisse précise, optionnelle, propre à ce stand.
  function lieuLabel(id){ return id==="CC" ? "Click & Collect" : standNom(id); }
  function caissesDeStand(standId){
    const s = SPARTIATES.stands.find(x=>x.id===standId);
    return s ? s.caisses.map(n=>"C"+n) : [];
  }
  // §15.87 — Frise horaire (timeline), ajoutée au-dessus du tableau à la demande de Rémi
  // (« un visuel rapide à comprendre » du planning). Lecture seule, ne recalcule rien : mêmes
  // dr/fr/ecartH/coutReel que le tableau ci-dessous, qui reste le seul endroit où saisir ou
  // corriger. Hypothèse d'axe : toute heure < 12h est traitée comme après minuit — même règle
  // que duree()/ecartH(), déjà en place dans ce module (une buvette de stade n'ouvre jamais le
  // matin), pas une nouvelle invention.
  let friseAxis = { mn:0, span:1 };
  const toAxis = t => { const [h,m]=t.split(":").map(Number); return (h<12? h+24 : h)*60+m; };
  const frisePct = v => (v-friseAxis.mn)/friseAxis.span*100;
  const heureLabel = v => { const vv=((v%1440)+1440)%1440; const h=Math.floor(vv/60), m=vv%60; return String(h).padStart(2,"0")+"h"+(m?String(m).padStart(2,"0"):""); };

  function renderFrise(lignes, stands){
    if(!lignes.length) return "";
    let mn=Infinity, mx=-Infinity;
    lignes.forEach(a=>{ mn=Math.min(mn,toAxis(a.dr)); mx=Math.max(mx,toAxis(a.fr)); });
    mn = Math.floor((mn-30)/30)*30; mx = Math.ceil((mx+30)/30)*30;
    friseAxis = { mn, span: Math.max(1, mx-mn) };
    const grads = [];
    for(let v=Math.ceil(mn/60)*60; v<=mx; v+=60) grads.push(v);
    return `<div style="border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;">
      <strong class="title">Planning — vue d'ensemble <span class="chip vio">nouveau §15.87</span></strong>
      <div class="hint">Qui est où, et quand, en un coup d'œil — heures réelles (orange = corrigée par rapport au prévu). Survole une barre pour le détail. Le tableau ci-dessous reste l'endroit où saisir ou corriger.</div>
      <div style="display:grid;grid-template-columns:126px 1fr;row-gap:5px;column-gap:8px;margin-top:12px;align-items:center;">
        <div></div>
        <div style="position:relative;height:20px;border-bottom:1px solid var(--border);">
          ${grads.map(v=>`<span style="position:absolute;left:${frisePct(v).toFixed(2)}%;font-size:10px;color:var(--muted);transform:translateX(-50%);">${heureLabel(v)}</span>`).join("")}
        </div>
        ${stands.map(st=>`
          <div style="grid-column:1/-1;font-weight:800;color:var(--violet);font-size:11.5px;margin-top:6px;">${lieuLabel(st)}</div>
          ${lignes.filter(l=>l.stand===st).map(a=>{
            const e = empl(a.emp), g = ecartH(a)!==0;
            const s=frisePct(toAxis(a.dr)), f=frisePct(toAxis(a.fr));
            return `<div style="font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${e.nom}">${e.nom}</div>
            <div style="position:relative;height:18px;background:var(--track);border-radius:5px;">
              <div id="perFriseBar_${a.id}" style="position:absolute;left:${s.toFixed(2)}%;width:${Math.max(1,(f-s)).toFixed(2)}%;top:0;height:100%;border-radius:5px;background:${g?'var(--amber)':'var(--violet)'};" title="${e.nom} — prévu ${a.dp}–${a.fp}, réel ${a.dr}–${a.fr}${g?' (corrigé)':''}"></div>
            </div>`;
          }).join("")}
        `).join("")}
      </div>
    </div>`;
  }

  function ligneAffect(a){
    const e = empl(a.emp);
    const g = ecartH(a) !== 0;
    const estCC = a.stand==="CC";
    return `<tr>
      <td><b>${e.nom}</b><div class="hint" style="margin:2px 0 0;">${e.statut==="intérimaire"?"Intérimaire · "+e.agence:"Salarié"}</div></td>
      <td>
        <select class="cell" data-plieu="${a.id}" style="text-align:left;margin-bottom:4px;">
          ${SPARTIATES.stands.map(s=>`<option value="${s.id}" ${a.stand===s.id?"selected":""}>${s.nom}</option>`).join("")}
          <option value="CC" ${estCC?"selected":""}>Click &amp; Collect</option>
        </select>
        <select class="cell" data-pcaisse="${a.id}" style="text-align:left;" ${estCC?"disabled":""}>
          <option value="">— (non précisée)</option>
          ${caissesDeStand(a.stand).map(c=>`<option value="${c}" ${a.caisse===c?"selected":""}>${c}</option>`).join("")}
        </select>
      </td>
      <td><select class="cell" data-parole="${a.id}" style="text-align:left;">
        ${ROLES.map(r=>`<option ${r===a.role?"selected":""}>${r}</option>`).join("")}
      </select></td>
      <td class="r num"><input class="cell" type="text" style="width:56px;text-align:center;" value="${a.dp}" data-pdp="${a.id}"> – <input class="cell" type="text" style="width:56px;text-align:center;" value="${a.fp}" data-pfp="${a.id}"></td>
      <td class="r num"><input class="cell" type="text" style="width:56px;text-align:center;" value="${a.dr}" data-pdr="${a.id}"> – <input class="cell" type="text" style="width:56px;text-align:center;" value="${a.fr}" data-pfr="${a.id}">
        <div class="hint" style="margin:2px 0 0;" id="pcorr_${a.id}">${a.corr ? `corrigé par ${a.corr.par} le ${a.corr.quand}` : ""}</div>
      </td>
      <td class="r num" id="pcout_${a.id}">${eur2(coutReel(a))}
        <div class="hint" style="margin:2px 0 0;" id="pecart_${a.id}">${g ? (ecartH(a)>0?"+":"")+fq(ecartH(a))+" h vs prévu" : ""}</div>
      </td>
      <td class="r"><button class="cta ghost" style="padding:4px 9px;font-size:11.5px;" data-pdela="${a.id}">Retirer</button></td>
    </tr>`;
  }
  function vuePlanning(){
    const evt = EVENTS.find(x=>x.id===evtSel);
    const lignes = PLANNING[evtSel]||[];
    const stands = [...new Set(lignes.map(l=>l.stand))];
    const totReel = masseEvt(evtSel), totSal = masseEvt(evtSel,"salarié"), totInt = masseEvt(evtSel,"intérimaire");
    const aVenir = estAVenir(evt);
    return `<div class="card">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <strong class="title" style="margin:0;">Planning — soirée du ${evt.date} (${evt.adv})${aVenir?' <span class="chip vio">à venir</span>':''}</strong>
        <select class="cell" id="perEvtSel" style="margin-left:auto;text-align:left;">
          ${EVENTS.map(e=>`<option value="${e.id}" ${e.id===evtSel?"selected":""}>${e.date} — ${e.adv}${estAVenir(e)?" (à venir)":""}</option>`).join("")}
        </select>
        <button class="cta ghost" id="perNewEvt">+ Nouvel événement (prochain match)</button>
      </div>
      <div class="hint">Chaque employé est affecté à un stand avec une plage prévue. Les heures réelles valent les heures prévues par défaut ; une correction après la soirée porte l'auteur et l'horodatage.</div>
      ${aVenir ? `<div class="infobox">📅 Cet événement n'a pas encore eu lieu — seules les heures <b>prévues</b> ont un sens ici. Les heures « réelles » restent égales aux heures prévues tant que le match ne s'est pas joué et que personne ne les corrige.</div>` : ""}
      ${renderFrise(lignes, stands)}
      <div id="perNewEvtForm" style="display:none;margin:0 0 12px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--field);">
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
          <div class="pfield"><label>Date du match</label><input class="cell" type="date" id="perNewEvtDate"></div>
          <div class="pfield"><label>Adversaire</label><input class="cell" type="text" id="perNewEvtAdv" placeholder="Nom de l'équipe" style="text-align:left;"></div>
          <button class="cta ghost" id="perNewEvtOk">Créer et sélectionner</button>
        </div>
      </div>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Employé</th><th>Lieu <span class="chip vio">ajouté §15.80</span></th><th>Rôle</th><th class="r">Prévu</th><th class="r">Réel</th><th class="r">Coût réel</th><th></th></tr></thead>
        <tbody>
          ${stands.map(st=>`<tr><td colspan="7" style="font-weight:800;color:var(--violet);padding:12px 8px 5px;">${lieuLabel(st)}</td></tr>` + lignes.filter(l=>l.stand===st).map(a=>ligneAffect(a)).join("")).join("")}
        </tbody>
        <tfoot><tr><td colspan="5">Total masse salariale réelle de la soirée</td><td class="r num" id="perTotEvt">${eur2(totReel)}</td><td></td></tr></tfoot>
      </table></div>
      <div style="margin-top:12px;"><button class="cta ghost" id="perAddAff">+ Ajouter une affectation</button></div>
      <div class="kpis">
        <div class="kpi"><div class="l">Salariés</div><div class="v num" id="perKpiSal">${eur2(totSal)}</div><div class="s">${totReel? Math.round(totSal/totReel*100):0} % de la masse salariale de la soirée</div></div>
        <div class="kpi"><div class="l">Intérimaires</div><div class="v num" id="perKpiInt">${eur2(totInt)}</div><div class="s">${totReel? Math.round(totInt/totReel*100):0} % de la masse salariale de la soirée</div></div>
      </div>
      <div class="alertbox" style="margin-top:14px;">Point de vigilance : cette soirée a réellement mobilisé une trentaine de personnes ; seul un échantillon a une fiche et une affectation saisies ici. Le chiffre ci-dessus (${eur2(totReel)}) est donc <b>inférieur</b> au personnel réellement engagé — pas une erreur, un planning encore incomplet. Il remplacera l'estimation par rôle affichée aujourd'hui dans Gestion financière une fois complet (point ouvert, §14 point 6).</div>
    </div>`;
  }
  function affect(id){ return (PLANNING[evtSel]||[]).find(a=>a.id===id); }
  function patchAffect(id){
    const a = affect(id);
    const cell = document.getElementById("pcout_"+id); if(cell) cell.innerHTML = eur2(coutReel(a));
    const ec = document.getElementById("pecart_"+id);
    if(ec){ const g = ecartH(a)!==0; ec.textContent = g ? (ecartH(a)>0?"+":"")+fq(ecartH(a))+" h vs prévu" : ""; }
    // §15.87 : repositionne la barre de la frise sans réafficher tout le panneau (pour ne pas
    // couper la saisie en cours) — réutilise l'échelle de temps du dernier affichage complet ;
    // limite assumée et documentée au dossier (§15.87).
    const bar = document.getElementById("perFriseBar_"+id);
    if(bar){
      const g = ecartH(a)!==0;
      const s = frisePct(toAxis(a.dr)), f = frisePct(toAxis(a.fr));
      bar.style.left = s.toFixed(2)+"%"; bar.style.width = Math.max(1,(f-s)).toFixed(2)+"%";
      bar.style.background = g ? "var(--amber)" : "var(--violet)";
      bar.title = `${empl(a.emp).nom} — prévu ${a.dp}–${a.fp}, réel ${a.dr}–${a.fr}${g?' (corrigé)':''}`;
    }
    const totReel = masseEvt(evtSel), totSal = masseEvt(evtSel,"salarié"), totInt = masseEvt(evtSel,"intérimaire");
    const te=document.getElementById("perTotEvt"); if(te) te.textContent = eur2(totReel);
    const ks=document.getElementById("perKpiSal"); if(ks) ks.textContent = eur2(totSal);
    const ki=document.getElementById("perKpiInt"); if(ki) ki.textContent = eur2(totInt);
  }
  function wirePlanning(){
    const es = document.getElementById("perEvtSel");
    if(es) es.onchange = e=>{ evtSel=e.target.value; document.getElementById("perPanel").innerHTML = renderPanel(); wirePanel(); };
    const ne = document.getElementById("perNewEvt");
    if(ne) ne.onclick = ()=>{
      const f = document.getElementById("perNewEvtForm");
      f.style.display = f.style.display==="none" ? "" : "none";
      const d = document.getElementById("perNewEvtDate");
      if(d && !d.value) d.value = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
    };
    const neOk = document.getElementById("perNewEvtOk");
    if(neOk) neOk.onclick = ()=>{
      const dEl = document.getElementById("perNewEvtDate"), aEl = document.getElementById("perNewEvtAdv");
      if(!dEl.value){ toast("Choisis une date."); return; }
      const [y,m,d] = dEl.value.split("-");
      const dateFr = `${d}/${m}/${y}`;
      perEvtSeq++;
      const id = "e"+perEvtSeq;
      EVENTS.push({ id, date:dateFr, adv: aEl.value.trim() || "Adversaire à confirmer" });
      PLANNING[id] = [];
      evtSel = id;
      document.getElementById("perPanel").innerHTML = renderPanel(); wirePanel();
      toast(`Événement du ${dateFr} créé — ajoute des affectations ci-dessous.`);
    };
    const add = document.getElementById("perAddAff");
    if(add) add.onclick = ()=>{
      const actifs = EMPLOYES.filter(e=>e.actif);
      if(!actifs.length){ toast("Aucun employé actif disponible."); return; }
      const id = "a"+((PLANNING[evtSel]||[]).length+1)+"_"+Date.now()%1000;
      PLANNING[evtSel].push({id, emp:actifs[0].id, stand:SPARTIATES.stands[0].id, caisse:null, role:actifs[0].role, dp:"18:00", fp:"00:00", dr:"18:00", fr:"00:00", corr:null});
      document.getElementById("perPanel").innerHTML = renderPanel(); wirePanel();
      toast("Affectation ajoutée.");
    };
    document.querySelectorAll("[data-plieu]").forEach(s=>{
      s.onchange = e=>{
        const a = affect(e.target.dataset.plieu);
        a.stand = e.target.value; a.caisse = null;
        document.getElementById("perPanel").innerHTML = renderPanel(); wirePanel();
      };
    });
    document.querySelectorAll("[data-pcaisse]").forEach(s=>{
      s.onchange = e=>{ affect(e.target.dataset.pcaisse).caisse = e.target.value || null; };
    });
    document.querySelectorAll("[data-parole]").forEach(s=>s.onchange=e=>{ affect(e.target.dataset.parole).role=e.target.value; });
    document.querySelectorAll("[data-pdela]").forEach(b=>b.onclick=e=>{
      const id=e.target.dataset.pdela;
      PLANNING[evtSel]=PLANNING[evtSel].filter(a=>a.id!==id);
      document.getElementById("perPanel").innerHTML = renderPanel(); wirePanel();
    });
    ["pdp","pfp"].forEach(k=>document.querySelectorAll("[data-"+k+"]").forEach(i=>i.oninput=e=>{
      const a=affect(e.target.dataset[k]); a[k.slice(1)]=e.target.value; patchAffect(a.id);
    }));
    ["pdr","pfr"].forEach(k=>document.querySelectorAll("[data-"+k+"]").forEach(i=>i.oninput=e=>{
      const a=affect(e.target.dataset[k]); a[k.slice(1)]=e.target.value;
      if(ecartH(a)!==0 && !a.corr){ a.corr = {par:"Responsable de stand", quand: new Date().toLocaleDateString("fr-FR")+" "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}; }
      if(ecartH(a)===0){ a.corr = null; }
      const cc=document.getElementById("pcorr_"+a.id); if(cc) cc.textContent = a.corr ? `corrigé par ${a.corr.par} le ${a.corr.quand}` : "";
      patchAffect(a.id);
    }));
  }

  function vueMasse(){
    const rows = EVENTS.map(e=>({e, sal:masseEvt(e.id,"salarié"), int:masseEvt(e.id,"intérimaire"), tot:masseEvt(e.id)}));
    const totSal = rows.reduce((s,r)=>s+r.sal,0), totInt = rows.reduce((s,r)=>s+r.int,0), totAll = totSal+totInt;
    const parRole = ROLES.map(r=>{
      let s=0; EVENTS.forEach(e=>(PLANNING[e.id]||[]).forEach(a=>{ if(empl(a.emp).role===r) s+=coutReel(a); }));
      return [r,s];
    });
    return `<div class="card">
      <strong class="title">Masse salariale — saison en cours</strong>
      <div class="hint">Somme des coûts réels du planning, jamais un nouveau calcul : si un chiffre paraît faux, il se corrige dans le planning de la soirée concernée.</div>
      <div class="kpis">
        <div class="kpi"><div class="l">Masse salariale totale</div><div class="v num">${eur2(totAll)}</div><div class="s">sur ${EVENTS.length} soirées saisies</div></div>
        <div class="kpi"><div class="l">Part salariés</div><div class="v num">${eur2(totSal)}</div><div class="s">${totAll?Math.round(totSal/totAll*100):0} % du total</div></div>
        <div class="kpi"><div class="l">Part intérimaires</div><div class="v num">${eur2(totInt)}</div><div class="s">${totAll?Math.round(totInt/totAll*100):0} % du total</div></div>
      </div>
      <strong class="title" style="display:block;margin-top:18px;">Par soirée</strong>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Soirée</th><th class="r">Salariés</th><th class="r">Intérimaires</th><th class="r">Total réel</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r.e.date} — ${r.e.adv}</td><td class="r num">${eur2(r.sal)}</td><td class="r num">${eur2(r.int)}</td><td class="r num"><b>${eur2(r.tot)}</b></td></tr>`).join("")}</tbody>
      </table></div>
      <strong class="title" style="display:block;margin-top:18px;">Par rôle (toutes soirées saisies)</strong>

        <div class="mono" style="font-size:11.5px;color:var(--muted);">ouverture &nbsp;${empDemo(s.caisse+"o")}</div>
        <div class="mono" style="font-size:11.5px;color:var(--muted);">fermeture &nbsp;${empDemo(s.caisse+"f")}</div>
        <div style="margin-top:8px;"><button class="cta ghost" data-cfmdl="Chaîne vérifiée sur la session de ${s.caissier} : ${numFr(s.tickets)} maillons, aucune rupture">Vérifier la chaîne</button></div>
      </div>
    </div>`;
  }

  function vueConnexions(){
    const stands = SPARTIATES.stands.map(s=>s.nom);
    const list = SESSIONS.filter(s=>state.filtreStand==="all"||s.standNom===state.filtreStand);
    const anomalies = list.filter(s=>tauxAnn(s)>ANOMALIE).length;
    return `<div class="card">
      <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;">
        <div style="flex:1;min-width:260px;">
          <strong class="title">Qui a tenu quelle caisse, et ce qui s'y est passé</strong>
          <div class="hint">Le texte impose de mémoriser l'enregistrement de chaque personne accédant au système. Une liste de connexions seule ne sert à rien : c'est en lui rattachant <b>l'argent de la session</b> — tickets, encaissements, annulations, remises, écart de caisse — qu'elle devient un outil de gestion en plus d'être une pièce de conformité.</div>
        </div>
        <select class="cell" id="cfmFStand" style="width:auto;">
          <option value="all">Tous les stands</option>
          ${stands.map(s=>`<option value="${s}" ${state.filtreStand===s?"selected":""}>${s}</option>`).join("")}
        </select>
      </div>

      ${anomalies ? `<div class="alertbox"><b>${anomalies} session${anomalies>1?"s":""} à regarder.</b> Un taux d'annulation supérieur à ${ANOMALIE} % des tickets est la signature classique d'un problème — erreur de manipulation, matériel défaillant, ou détournement. L'écran signale, il n'accuse pas.</div>` : ""}

      <table style="margin-top:12px;">
        <thead><tr>
          <th>Opérateur</th><th>Stand · caisse</th><th>Ouverture</th><th>Fermeture</th><th class="r">Durée</th>
          <th class="r">Tickets</th><th class="r">Encaissé</th><th class="r">Annulations</th><th class="r">Écart caisse</th>
        </tr></thead>
        <tbody>${list.map(s=>ligneSess(s)).join("")}</tbody>
      </table>
      <div class="hint" style="margin-top:8px;">9 sessions illustratives — une par caisse réelle des Spartiates — construites à partir des totaux déjà scellés de la soirée de test Bayonne (§15.61), pas une mesure réelle par caisse individuelle.</div>
    </div>`;
  }

  function wireConnexions(){
    const f = document.getElementById("cfmFStand");
    if(f) f.onchange = e => { state.filtreStand = e.target.value; renderPanel(); };
    document.querySelectorAll("tr.cfm-sess").forEach(tr=>{
      tr.onclick = e => { if(e.target.closest("button")||e.target.closest("select")) return;
        const id = +tr.dataset.s; state.ouvertes.has(id)?state.ouvertes.delete(id):state.ouvertes.add(id); renderPanel(); };
    });
  }

  function vueJet(){
    return `<div class="card">
      <strong class="title">Journal des événements techniques</strong>
      <div class="hint">Distinct du journal des ventes (Ma caisse, module 1). Il enregistre tout ce qui <b>touche au système plutôt qu'à une vente</b> : ouvertures et fermetures de caisse, connexions, changements de tarif, clôtures, changements de version. Chaque ligne est scellée et chaînée à la précédente : en retirer une casse la chaîne à partir de là.</div>
      <table>
        <thead><tr><th>Horodatage</th><th>Événement</th><th>Auteur</th><th>Détail</th><th>Empreinte</th></tr></thead>
        <tbody>${JET.map((e,i)=>`<tr>
          <td>${e.ts}</td>
          <td><span class="chip vio">${JET_LAB[e.type]||e.type}</span></td>
          <td>${e.qui}</td>
          <td style="font-size:12.5px;white-space:normal;">${e.det}</td>
          <td class="mono" style="font-size:11.5px;color:var(--muted);">${e.ts==="—"?"—":empDemo(e.ts+i)}</td></tr>`).join("")}</tbody>
      </table>
      <div class="alertbox"><b>Le changement de tarif est dans ce journal, et c'est volontaire.</b> Modifier le prix d'un produit ne change jamais un ticket déjà émis : le tarif est daté (mécanisme réel, voir le journal des tarifs de Config produits, §15.57), le changement laisse une trace avec son auteur et son heure.</div>
      <div style="margin-top:12px;"><button class="cta ghost" data-cfmdl="Journal exporté en CSV — 8 événements, empreintes incluses">Exporter le journal</button></div>
    </div>`;
  }

  function vueArchives(){
    return `<div class="card">
      <strong class="title">Où sont les données, exactement</strong>
      <div class="hint">Trois couches distinctes, qui ne servent pas à la même chose. La confusion la plus fréquente et la plus coûteuse : <b>une sauvegarde n'est pas une archive</b>. La sauvegarde sert à repartir après une panne ; l'archive sert à prouver, des années plus tard, ce qui s'est passé.</div>

      <div class="cfm-layer"><div class="n">1</div><div>
        <div style="font-weight:700;">Base de production — en ligne, interrogeable</div>
        <div class="hint" style="margin:0;">Le journal d'événements en écriture seule, hébergé en France. Contient l'exercice en cours et les deux précédents. <b>Aucune opération de modification ni de suppression n'y est autorisée</b>, au niveau de la base elle-même.</div>
      </div></div>
      <div class="cfm-layer"><div class="n">2</div><div>
        <div style="font-weight:700;">Archives d'exercice — figées, scellées, lisibles sans le logiciel</div>
        <div class="hint" style="margin:0;">Un fichier par exercice, en <b>format ouvert accompagné d'une notice explicative en français</b>, scellé par une empreinte. Conservation <b>6 ans</b> (LPF art. L102 B).</div>
      </div></div>
      <div class="cfm-layer"><div class="n">3</div><div>
        <div style="font-weight:700;">Sauvegardes — techniques, quotidiennes</div>
        <div class="hint" style="margin:0;">Copies d'exploitation pour reprise après incident. <b>Elles ne valent pas archive</b>.</div>
      </div></div>

      <div class="alertbox" style="background:var(--violet-soft);border-color:var(--field-border);color:var(--text);margin-top:14px;">
        <b>Hébergement : France — décidé le 11/09/2026.</b> Retenu parce qu'il supprime la <b>déclaration de stockage à l'étranger</b> due dès qu'un tiers héberge. C'est <b>au lieu</b> de la déposer, pas à Break&nbsp;Eat.
      </div>

      <div style="font-weight:700;font-family:'Raleway',sans-serif;margin-top:20px;">Compteurs par caisse</div>
      <div class="hint">Le <b>numéro de ticket est séquentiel par caisse</b>, avec le préfixe de la caisse — pas une séquence unique pour tout le lieu (principe de l'artifact officiel, corrige la contradiction signalée en §15.60). Une séquence unique obligerait toutes les caisses à se coordonner en temps réel — impossible en mode dégradé réseau. Le <b>total du lieu est leur somme</b>.</div>
      <table>
        <thead><tr><th>Caisse</th><th>Stand</th><th>Dernier n° émis</th><th class="r">Total de la période</th><th class="r">Total perpétuel</th></tr></thead>
        <tbody>${CAISSES.map(c=>`<tr>
          <td style="font-weight:600;">Caisse ${c.id}</td><td style="color:var(--muted);">${c.stand}</td>
          <td class="mono" style="font-size:11.5px;">${c.dernier}</td>
          <td class="r num">${eur2(c.periode)}</td>
          <td class="r num">${eur2(c.perp)}</td></tr>`).join("")}</tbody>
        <tfoot><tr>
          <td colspan="3" style="font-weight:700;">Total du lieu — ${CAISSES.length} caisses</td>
          <td class="r num" style="font-weight:700;">${eur2(CAISSES.reduce((a,c)=>a+c.periode,0))}</td>
          <td class="r num" style="font-weight:700;">${eur2(CAISSES.reduce((a,c)=>a+c.perp,0))}</td>
        </tr></tfoot>
      </table>
      <div class="hint">« Période » = soirée de test Bayonne (§15.27) ; « perpétuel » = cumul des 3 soirées de test déjà scellées (Toulon+Grenoble+Bayonne) — pas un cumul réel depuis la mise en service, qui n'a pas encore eu lieu pour Les Spartiates.</div>

      <div style="font-weight:700;font-family:'Raleway',sans-serif;margin-top:20px;">Historique des exercices</div>
      <div class="hint">Seule la dernière ligne est réelle : <b>Les Spartiates n'ont aucun exercice archivé sous FlaiX Expert</b>, la saison 2026-2027 est la première. Les 3 lignes précédentes reprennent telles quelles la structure de l'artifact officiel pour montrer le mécanisme d'archivage sur plusieurs exercices — jamais un historique Spartiates. <span class="chip grey">exemple</span></div>
      <table>
        <thead><tr><th>Exercice</th><th>Période</th><th class="r">Événements</th><th class="r">Total de la période</th><th class="r">Total perpétuel</th><th>Scellement</th></tr></thead>
        <tbody>${ARCHIVES.map(a=>`<tr>
          <td style="font-weight:600;">${a.ex} ${a.etat==="en ligne"?'<span class="chip ok">en ligne</span>':'<span class="chip grey">exemple</span>'}</td>
          <td style="color:var(--muted);">${a.per}</td>
          <td class="r num">${numFr(a.ev)}</td>
          <td class="r num">${eur2(a.tot)}</td>
          <td class="r num" style="font-weight:700;">${eur2(a.perp)}</td>
          <td class="mono" style="font-size:11.5px;">${a.etat==="en ligne"?"—":empDemo(a.ex)}</td>
        </tr>`).join("")}</tbody>
      </table>

      <div style="font-weight:700;font-family:'Raleway',sans-serif;margin-top:20px;">Donner l'accès à un vérificateur</div>
      <div class="hint">La loi exige que l'administration dispose d'un <b>accès en ligne permettant le téléchargement et l'utilisation des données</b>, depuis l'établissement principal. <b>Ce n'est jamais Break Eat qui donne l'accès</b> : c'est le lieu, depuis son propre compte.</div>
      <div class="cfm-layer"><div class="n">A</div><div>
        <div style="font-weight:700;">Export sur clé — le plus simple, suffisant dans la plupart des cas</div>
        <div class="hint" style="margin:0;">Le directeur choisit une période et exporte : données ligne à ligne, cumuls, journal des événements, notice, empreintes.</div>
        <div style="margin-top:7px;"><button class="cta ghost" data-cfmdl="Export de contrôle généré — 1 exercice en cours, notice et empreintes incluses">Générer un export de contrôle</button></div>
      </div></div>
      <div class="cfm-layer"><div class="n">B</div><div>
        <div style="font-weight:700;">Compte vérificateur temporaire — recommandé quand le contrôle s'installe</div>
        <div class="hint" style="margin:0;">Accès <b>en lecture seule</b>, limité à une période et une durée. <b>La création et chaque connexion sont elles-mêmes inscrites au journal des événements.</b></div>
        <div style="margin-top:7px;"><button class="cta ghost" data-cfmdl="Compte vérificateur créé — lecture seule, expire dans 30 jours, inscrit au journal">Créer un compte vérificateur</button></div>
      </div></div>
      <div class="cfm-layer"><div class="n">C</div><div>
        <div style="font-weight:700;">Accès direct à l'hébergement — à éviter</div>
        <div class="hint" style="margin:0;">Techniquement possible, mais expose l'infrastructure d'autres lieux. À ne faire que sur demande expresse et motivée.</div>
      </div></div>
    </div>`;
  }

  const ONGLETS = [["attestation","Attestation"],["connexions","Connexions par caisse"],["jet","Journal des événements"],["archives","Données & archives"]];

  function markup(){
    return `
    <h2 class="sec-title">Conformité</h2>
    <div class="sec-sub">Module : Profil &amp; documentation. Un lieu = un assujetti = une continuité de compteurs. Ne recalcule rien — rassemble ce qu'un contrôle (art. L80 O du LPF) peut demander, au même endroit.</div>

    ${renderKpis()}

    <div class="cmd-tabs">${ONGLETS.map(([k,l])=>`<button class="cmd-tabbtn cfm-tabbtn ${state.onglet===k?'active':''}" data-tab="${k}">${l}</button>`).join("")}</div>
    <div id="cfmPanelBody"></div>

    ${rulesBlock("conformite","comment ce module est construit", `
      <b>Ce module ne recalcule rien</b> — il rassemble ce qu'un contrôle (article L80 O du livre des procédures fiscales) peut demander : attestation, connexions par caisse (avec l'argent de la session rattaché), compteurs par caisse, journal d'événements, archives et accès vérificateur.<br><br>
      <b>Numérotation des tickets</b> : séquentielle <b>par caisse</b>, avec préfixe caisse — jamais une séquence unique pour tout le lieu, qui obligerait une coordination temps réel impossible à tenir en mode dégradé réseau. Corrigé le 28/09 : le module affichait à tort « numérotation globale » (§15.60/§15.61).<br><br>
      <b>Structure réelle vs jeu de test</b> : les 9 caisses, 4 stands et noms de caissiers sont réels (déjà validés au module 1). Les sessions, le journal technique et l'historique d'archives sont des données de démonstration clairement signalées — Les Spartiates n'ont pas encore d'exploitation réelle sous FlaiX Expert.<br><br>
      <b>Total perpétuel</b> : ne repart jamais de zéro, relie les exercices bout à bout — c'est lui qui prouve qu'aucune période n'a été retirée en cas de contrôle.<br><br>
      Le scellement par chaîne SHA-256 réelle est celui de Ma caisse (module 1) ; l'empreinte affichée ici est un succédané pédagogique déterministe, pas la même chaîne cryptographique.
    `)}
    `;
  }

  function renderPanel(){
    const el = document.getElementById("cfmPanelBody");
    if(!el) return;
    el.innerHTML = state.onglet==="attestation" ? vueAttestation()
      : state.onglet==="connexions" ? vueConnexions()
      : state.onglet==="jet" ? vueJet()
      : vueArchives();
    if(state.onglet==="connexions") wireConnexions();
    el.querySelectorAll("[data-cfmdl]").forEach(b=>b.onclick=()=>dl(b.dataset.cfmdl));
  }

  function mount(){
    document.querySelectorAll(".cfm-tabbtn").forEach(b=>{
      b.onclick = () => { state.onglet=b.dataset.tab;
        document.querySelectorAll(".cfm-tabbtn").forEach(x=>x.classList.toggle("active",x===b));
        renderPanel(); };
    });
    renderPanel();
  }

  return { markup, mount };
})();

// §15.81 : Conformité et Lexique des règles fusionnés en un seul module « Conformité &
// Lexique des règles », à la demande de Rémi (même « et » que « Clôture et Pilotage », confirmé
// en clarification). Wrapper paresseux (()=>RENDERERS.lexique()) : RENDERERS.lexique est défini
// plus bas dans le fichier (section suivante) — évalué seulement au clic, jamais à la
// construction de cet objet, donc aucune référence en avance de phase.
const CONFORMITE_PANES = {
  conformite: { render: Cfm.markup, mount: Cfm.mount },
  lexique: { render: ()=>RENDERERS.lexique(), mount: wireRules },
};
RENDERERS.conformite = function(){
  return `
  <h2 class="sec-title">${moduleTitle("conformite")}</h2>
  <div class="sec-sub">Section « Conformité &amp; Lexique des règles » (§15.81, fusion à la demande de Rémi) — 2 modules distincts regroupés ici, choisis-les dans le menu à gauche.</div>
  ${renderModulePane("conformite", CONFORMITE_PANES)}
  `;
};
window.wire_conformite = function(){ mountModulePane("conformite", CONFORMITE_PANES); };

/* ============================================================
   SECTION 10 — Lexique des règles
   Ajouté le 17/09 (§15.59) à la demande de Rémi, explicitement
   réversible. N'invente ni ne recopie aucun texte : appelle la
   fonction de rendu déjà validée de chaque module et extrait à
   l'exécution le contenu déjà présent dans son bloc rulesBlock()
   (id "rb-<id>") — une seule source de vérité pour chaque règle,
   celle du module d'origine. Réservé au rôle Gérant (§15.50).
   ============================================================ */
// §15.81 : regroupement et ordre alignés sur le nouveau menu (Dashboard, Ma caisse,
// Configuration, Stock, Personnel, Clôture & Pilotage, Fidélité, Facturation, Conformité).
// Chaque entrée appelle toujours la fonction de rendu du MODULE lui-même (Cfm.markup(),
// jamais RENDERERS.conformite()) — pas le rendu de sa section, qui peut désormais afficher un
// autre sous-module que celui-ci selon l'onglet actif de l'accordéon (même précaution déjà
// appliquée à Click & Collect, §15.76/§15.59).
const RULES_SOURCES = [
  { section:"Dashboard",     module:"Ventes & CA",                       id:"ventes",                   get:()=>renderVentesCA() },
  { section:"Dashboard",     module:"Gestion financière",                id:"gestion",                  get:()=>renderGestionFinanciere() },
  { section:"Ma caisse",     module:"Ma caisse",                         id:"commande",               get:()=>RENDERERS.commande() },
  { section:"Configuration", module:"Config produits",                  id:"config-produits",         get:()=>Cfg.markup() },
  { section:"Configuration", module:"Click & Collect — calculateur",     id:"cc-calculateur",           get:()=>renderClickCollect() },
  { section:"Configuration", module:"Click & Collect — points de retrait", id:"click-collect",         get:()=>renderClickCollect() },
  { section:"Configuration", module:"Configuration cible & marge",       id:"config-cible",             get:()=>CfgCible.markup() },
  { section:"Configuration", module:"Coûts par buvette",                 id:"couts-buvette",            get:()=>Cpb.markup() },
  { section:"Configuration", module:"Gestion des stands & caisses",      id:"gestion-stands-caisses",   get:()=>Gsc.markup() },
  { section:"Stock",         module:"Stock",                             id:"stock",                   get:()=>Stk.markup() },
  { section:"Personnel",     module:"Personnel",                          id:"personnel",               get:()=>RENDERERS.personnel() },
  { section:"Clôture & Pilotage", module:"Optimisation",                  id:"optimisation",            get:()=>Opt.markup() },
  { section:"Clôture & Pilotage", module:"Centre d'alertes",              id:"centre-alertes",          get:()=>Alt.markup() },
  { section:"Clôture & Pilotage", module:"Écart de caisse",               id:"cloture-caisse",           get:()=>renderEcartCaisse() },
  { section:"Clôture & Pilotage", module:"Écart de clôture d'événement",  id:"cloture-evenement",       get:()=>renderEcartCloture() },
  { section:"Clôture & Pilotage", module:"Clôtures mensuelle & annuelle", id:"cloture-mensuelle-annuelle", get:()=>renderClotureMensuelleAnnuelle() },
  { section:"Clôture & Pilotage", module:"Reporting de soirée",           id:"cloture-reporting",       get:()=>renderReportingSoiree() },
  { section:"Clôture & Pilotage", module:"Marges & ratios",               id:"marges-ratios",           get:()=>Mrg.markup() },
  { section:"Fidélité",      module:"Programme de fidélité",              id:"fidelite-programme",      get:()=>renderProgrammeFidelite() },
  { section:"Fidélité",      module:"Wallet & campagnes",                 id:"fidelite-wallet",         get:()=>renderWalletCampagnes() },
  { section:"Facturation",   module:"Facturation Break Eat",              id:"facturation-breakeat",    get:()=>renderFactureBreakEat() },
  { section:"Facturation",   module:"Facturation fournisseur",            id:"facturation-fournisseur", get:()=>renderRapprochementFournisseur() },
  { section:"Conformité",    module:"Conformité",                          id:"conformite",             get:()=>Cfm.markup() },
];
function extraireRegle(id, htmlString){
  try{
    const tmp = document.createElement("div");
    tmp.innerHTML = htmlString;
    const body = tmp.querySelector("#rb-"+id);
    return body ? body.innerHTML : `<p style="color:var(--muted);">Contenu introuvable pour "${id}" — module peut-être pas encore construit.</p>`;
  }catch(e){
    return `<p style="color:var(--red);">Erreur d'extraction pour "${id}" : ${e.message}</p>`;
  }
}
RENDERERS.lexique = function(){
  const parSections = [];
  RULES_SOURCES.forEach(src=>{
    let sec = parSections.find(s=>s.section===src.section);
    if(!sec){ sec = { section:src.section, blocs:[] }; parSections.push(sec); }
    let html;
    try{ html = extraireRegle(src.id, src.get()); }
    catch(e){ html = `<p style="color:var(--red);">Erreur de rendu du module "${src.module}" : ${e.message}</p>`; }
    sec.blocs.push({ module:src.module, html });
  });
  return `
  <h2 class="sec-title">Lexique des règles</h2>
  <div class="sec-sub">Un seul endroit pour comprendre comment et pourquoi chaque chiffre de FlaiX Expert est calculé (§15.59) — chaque règle est lue directement depuis son module d'origine, jamais recopiée : aucun risque de divergence entre ce lexique et l'écran où la règle s'applique. Section ajoutée à la demande de Rémi le 17/09, explicitement réversible.</div>
  ${parSections.map(sec=>`
    <div class="card">
      <strong class="title">${sec.section}</strong>
      ${sec.blocs.map(b=>`
        <div style="margin-top:${sec.blocs.length>1?'14px':'4px'};padding-top:${sec.blocs.length>1?'12px':'0'};${sec.blocs.indexOf(b)>0?'border-top:1px solid var(--border);':''}">
          <div style="font-weight:700;font-size:13px;margin-bottom:8px;">${b.module}</div>
          <div style="font-size:13px;line-height:1.6;">${b.html}</div>
        </div>`).join("")}
    </div>`).join("")}
  `;
};

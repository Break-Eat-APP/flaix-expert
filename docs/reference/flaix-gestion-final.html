/* ---------------- Module 6 — Optimisation ---------------- */
const Opt = (function(){
  function euros(n){ return (n<0?"−":"")+Math.abs(n).toFixed(0)+" €"; }

  // Lit les lignes déjà calculées par Marges & ratios (module 5), saison complète —
  // ne recalcule aucune marge ici (règle du module : « ne recalcule aucune alerte existante »).
  function croisement(){
    const L = Mrg.lignes();
    const totQ = L.reduce((a,x)=>a+x.q,0), totMarge = L.reduce((a,x)=>a+x.marge,0);
    return L.map(x=>{
      const partVolume = totQ>0? x.q/totQ*100 : 0, partMarge = totMarge>0? x.marge/totMarge*100 : 0;
      const autresQ = totQ-x.q, autresMarge = totMarge-x.marge;
      const margeParUnite = x.q>0? x.marge/x.q : 0;
      const margeParUniteReste = autresQ>0? autresMarge/autresQ : 0;
      const ecartTheorique = (margeParUniteReste-margeParUnite)*x.q;
      return { nom:`${standNom(x.p.stand)} — ${x.p.produit}`, q:x.q, marge:x.marge, partVolume, partMarge, ecart:partVolume-partMarge, margeParUnite, margeParUniteReste, ecartTheorique };
    }).sort((a,b)=>b.ecart-a.ecart);
  }

  // §15.66 : granularité comptoir/Click & Collect restaurée — Mrg.lignes() sépare déjà qC/qA
  // par ligne (moteur commun F), simplement pas exploité ici jusqu'à cette correction.
  function ecartsStands(){
    const L = Mrg.lignes();
    const byProduit = {};
    L.forEach(x=>{
      const nom = standNom(x.p.stand);
      const split = x.qA>0; // point de retrait C&C actif pour ce stand (§15.31)
      if(x.qC>0) (byProduit[x.p.produit] ||= []).push({ stand: split ? nom+" (comptoir)" : nom, vendu: x.qC });
      if(x.qA>0) (byProduit[x.p.produit] ||= []).push({ stand: nom+" (C&C)", vendu: x.qA });
    });
    const out = [];
    Object.entries(byProduit).forEach(([produit,arr])=>{
      if(arr.length<2) return;
      const max = arr.reduce((a,b)=>b.vendu>a.vendu?b:a);
      const min = arr.reduce((a,b)=>b.vendu<a.vendu?b:a);
      if(max.stand===min.stand || min.vendu===0) return;
      const ecartPct = (max.vendu-min.vendu)/min.vendu*100;
      out.push({ produit, arr, max, min, ecartPct });
    });
    return out.sort((a,b)=>b.ecartPct-a.ecartPct);
  }

  // Ruptures — lues depuis Stock (module 4). Stk (déjà validé) n'expose aujourd'hui aucune
  // donnée hors de son propre écran (pas d'accesseur public) : plutôt que dupliquer son
  // moteur de détection de rupture — au risque de désynchronisation entre les deux écrans —
  // cette section affiche l'absence de donnée, signalée comme un écart d'intégration et non
  // comme une absence de rupture réelle constatée.
  const RUPTURES = [];

  function recommandations(){
    const C = croisement();
    const DISPROPORTIONNES = C.filter(p=>p.ecart>1);
    const ES = ecartsStands();
    const recos = DISPROPORTIONNES.map(p=>({
      phrase: `${p.nom} — ${p.partVolume.toFixed(1)} % du volume vendu pour seulement ${p.partMarge.toFixed(1)} % de la marge totale. Écart théorique vs reste de la carte : ${euros(p.ecartTheorique)}.`,
      impactEur: p.ecartTheorique, source:"Module 5 (Marges & ratios)"
    }));
    ES.slice(0,2).forEach(e=>recos.push({
      phrase: `${e.produit} se vend ${e.ecartPct.toFixed(0)} % de plus à ${e.max.stand} qu'à ${e.min.stand} (${e.max.vendu} contre ${e.min.vendu}) — écart à vérifier sur le terrain, aucune donnée de fréquentation par stand pour dire si c'est normal.`,
      impactEur: 0, source:"Module 5 (Marges & ratios, volumes)"
    }));
    return recos.sort((a,b)=>b.impactEur-a.impactEur);
  }

  let onglet = "vue";

  function renderVue(){
    const C = croisement(), DISPROPORTIONNES = C.filter(p=>p.ecart>1), ES = ecartsStands();
    const RECOS = recommandations();
    const maxImpact = Math.max(...RECOS.map(r=>r.impactEur),1);
    return `
    <div class="infobox">Ce module ne recalcule aucune alerte existante — il croise ce que Marges &amp; ratios (5) et Stock (4, volumes) produisent déjà, pour proposer un arbitrage de carte.</div>
    <div class="kpis" style="grid-template-columns:repeat(3,1fr);">
      <div class="kpi"><div class="v num">${DISPROPORTIONNES.length}</div><div class="l">Lignes volume &gt; marge</div></div>
      <div class="kpi"><div class="v num">${ES.length}</div><div class="l">Écarts notables entre stands</div></div>
      <div class="kpi"><div class="v num">${RUPTURES.length}</div><div class="l">Ruptures ce soir</div><div class="s">lecture Stock indisponible — voir Règles</div></div>
    </div>
    <div class="card">
      <strong class="title">Recommandations classées par impact</strong>
      <div class="hint">En phrases de décision — la décision (retirer, repositionner, laisser en l'état) reste au directeur.</div>
      ${RECOS.length===0?`<div class="hint">Aucun écart notable détecté sur la saison de démonstration actuelle.</div>`:RECOS.map(r=>`<div style="border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--paper);"><div style="font-weight:700;font-size:13px;">${r.phrase}</div><div style="margin-top:4px;"><span class="chip grey">${r.source}</span></div></div>`).join("")}
    </div>
    <div class="card">
      <strong class="title">Classement par impact € (tornado)</strong>
      <div class="hint">Barres proportionnelles, CSS pur.</div>
      ${RECOS.filter(r=>r.impactEur>0).map(r=>`
        <div class="pil-tornado-row"><div class="pil-tornado-label">${r.phrase.split(" — ")[0]}</div>
        <div class="pil-tornado-wrap"><div class="pil-tornado-bar" style="width:${(r.impactEur/maxImpact*100).toFixed(0)}%;">${euros(r.impactEur)}</div></div></div>`).join("")}
    </div>
    <div class="card">
      <strong class="title">Prix — non traité ici</strong>
      <div class="hint">Aucune recommandation de prix n'est construite : proposer un prix supposerait de connaître l'élasticité (comment le volume réagit au prix), non mesurée. Posture par défaut, à confirmer avec Rémi (§15.22).</div>
    </div>`;
  }

  function renderVolume(){
    const C = croisement();
    const top = C[0];
    return `
    <div class="card">
      <strong class="title">Croisement volume × marge</strong>
      <div class="hint">Source : module Marges &amp; ratios, saison complète — aucun recalcul de marge ici. Un écart positif = la ligne occupe plus de volume qu'elle ne rapporte de marge.</div>
      <div style="overflow-x:auto;"><table><tr><th>Ligne (stand — produit)</th><th class="r">Part volume</th><th class="r">Part marge</th><th class="r">Écart</th><th class="r">Marge totale</th></tr>
      ${C.map(p=>`<tr><td>${p.nom}</td><td class="r num">${p.partVolume.toFixed(1)} %</td><td class="r num">${p.partMarge.toFixed(1)} %</td>
        <td class="r">${p.ecart>1?`<span class="chip warn">+${p.ecart.toFixed(1)} pt</span>`:`<span style="color:var(--muted);">${p.ecart>=0?"+":""}${p.ecart.toFixed(1)} pt</span>`}</td>
        <td class="r num">${eur(p.marge)}</td></tr>`).join("")}
      </table></div>
    </div>
    ${top?`<div class="card">
      <strong class="title">Avant / après — ${top.nom} (exemple, écart le plus marqué)</strong>
      <div class="hint">Écart arithmétique, pas une prévision de report de ventes vers un autre produit (ce serait inventer une élasticité).</div>
      <div class="wf">
        <div class="l"><span>Marge par unité vendue</span><span class="num">${eur(top.margeParUnite)}</span></div>
        <div class="l"><span>Marge par unité — moyenne du reste de la carte</span><span class="num">${eur(top.margeParUniteReste)}</span></div>
        <div class="l"><span>Écart par unité</span><span class="num">${eur(top.margeParUniteReste-top.margeParUnite)}</span></div>
        <div class="l"><span>Volume vendu</span><span class="num">${top.q} u</span></div>
        <div class="l tot"><span>Écart théorique sur la saison</span><span class="num">${euros(top.ecartTheorique)}</span></div>
      </div>
      <div class="hint" style="margin-top:8px;">Ordre de grandeur, pas un gain garanti.</div>
    </div>`:""}`;
  }

  function renderStands(){
    const ES = ecartsStands();
    const maxV = Math.max(...ES.flatMap(e=>e.arr.map(v=>v.vendu)),1);
    return `<div class="card">
      <strong class="title">Écarts entre stands</strong>
      <div class="hint">Source : module Marges &amp; ratios (5), volumes comptoir/Click &amp; Collect déjà séparés par ligne — <span class="chip vio" style="margin-left:2px;">corrigé §15.66</span> l'étiquette affichait « Stock » par erreur, ce module ne lit jamais Stock (aucun accesseur public, voir onglet Ruptures). <span class="chip warn">Limite assumée</span> : volumes bruts, pas un taux — aucune donnée de fréquentation par stand pour normaliser (même limite qu'au module Ventes &amp; CA).</div>
      ${ES.length===0?`<div class="hint">Aucun écart notable entre stands sur le jeu de démonstration actuel.</div>`:ES.map(e=>`
        <div style="margin-bottom:14px;">
          <div style="font-weight:700;font-size:13px;margin-bottom:6px;">${e.produit} <span class="chip ${e.ecartPct>50?'bad':'warn'}">+${e.ecartPct.toFixed(0)} %</span></div>
          ${e.arr.map(v=>`<div class="pil-stand-row"><div class="pil-stand-label">${v.stand}</div>
            <div class="pil-stand-wrap"><div class="pil-stand-bar" style="width:${(v.vendu/maxV*100).toFixed(0)}%;background:${v.stand===e.max.stand?'var(--violet)':'var(--muted)'};"></div></div>
            <div style="width:44px;text-align:right;">${v.vendu}</div></div>`).join("")}
        </div>`).join("")}
    </div>`;
  }

  function renderRuptures(){
    return `<div class="card">
      <strong class="title">Coût des ruptures</strong>
      <div class="hint">Source : Stock (module 4), alerte ⚠ rupture.</div>
      <div class="alertbox">Écart d'intégration signalé : Stock n'expose aujourd'hui aucune donnée hors de son propre écran (pas d'accesseur public). Plutôt que dupliquer son moteur de détection de rupture — au risque de désynchronisation entre les deux écrans — cette section affiche l'absence de donnée plutôt qu'un chiffre recalculé en double. Dès qu'un point de lecture partagé existera, le coût des ruptures s'affichera ici.</div>
    </div>`;
  }

  const RENDERERS_OPT = { vue: renderVue, volume: renderVolume, stands: renderStands, ruptures: renderRuptures };
  const TABS = [["vue","Vue d'ensemble"],["volume","Volume × marge"],["stands","Écarts entre stands"],["ruptures","Ruptures"]];

  function markup(){
    return `
    <div class="cmd-tabs">${TABS.map(([k,l])=>`<button class="cmd-tabbtn opt-tabbtn ${onglet===k?'active':''}" data-tab="${k}">${l}</button>`).join("")}</div>
    <div id="optPanel">${RENDERERS_OPT[onglet]()}</div>
    ${rulesBlock("optimisation","comment ces écarts sont calculés (module 6)", `
      <b>Ce module ne recalcule aucune alerte existante</b> — il croise ce que Marges &amp; ratios (5) et Stock (4) produisent déjà.<br><br>
      <b>Volume × marge</b> : <code>partVolume = q(ligne) ÷ Σq</code>, <code>partMarge = marge(ligne) ÷ Σmarge</code> — lues depuis le module 5, saison complète, jamais recalculées.<br><br>
      <b>Écart théorique</b> : <code>margeParUnite = marge ÷ q</code>, comparée à la marge moyenne par unité du reste de la carte. Ordre de grandeur, jamais un gain garanti — pas une prévision de report de ventes.<br><br>
      <b>Écarts entre stands</b> : volumes bruts par stand, lus depuis le module 5 (Marges &amp; ratios) — <code>qC</code>/<code>qA</code> (comptoir/Click &amp; Collect) déjà séparés par ligne dans son moteur, exploités ici depuis le 28/09 (§15.66, granularité restaurée pour les stands équipés d'un point de retrait C&amp;C réel). Pas de donnée de fréquentation par stand pour normaliser.<br><br>
      <b>Coût des ruptures</b> : Stock (module 4) n'expose aujourd'hui aucune donnée hors de son propre écran — signalé comme écart d'intégration plutôt que dupliqué.<br><br>
      <b>Recommandation de prix : volontairement non construite</b>, faute d'élasticité mesurée (§15.22).
    `)}`;
  }
  function mount(){
    document.querySelectorAll(".opt-tabbtn").forEach(b=>b.onclick=()=>{
      onglet = b.dataset.tab;
      const c = document.getElementById("cloture-pilotagePane");
      if(c){ c.innerHTML = markup(); mount(); }
    });
    wireRules();
  }
  return { markup, mount };
})();

/* ---------------- Module 18 — Centre d'alertes ---------------- */
const Alt = (function(){
  const SEUIL_VARIATION = 5;   // % — valeur de test, à ajuster avec Rémi
  const SEUIL_MERC = 10;       // % — valeur de test, à ajuster avec Rémi
  const SEUIL_VERDICT = 0.01;  // € — tolérance d'arrondi

  // Historique de livraisons fournisseur — Stock n'a aujourd'hui aucune livraison réelle
  // saisie pour Les Spartiates (§15.44) : jeu de test générique repris de l'artifact
  // officiel « Centre d'alertes » (cd2ec5d8…), signalé comme tel.
  const LIVRAISONS_HIST = [
    { produit:"Bière blonde pression", fournisseur:"Metro", date:"20/08/2026", prixU:4.800 },
    { produit:"Bière blonde pression", fournisseur:"Metro", date:"02/09/2026", prixU:5.050 },
    { produit:"Pain à hot-dog", fournisseur:"Metro", date:"18/08/2026", prixU:0.250 },
    { produit:"Pain à hot-dog", fournisseur:"Promocash", date:"02/09/2026", prixU:0.230 },
  ];

  // Prix de référence "mercuriale" — table propre à ce module, saisie et maintenue par le
  // lieu (aucune source de marché fiable pour une buvette de stade). Vide par défaut :
  // aucune valeur inventée pour la préremplir (contrairement au jeu de test de l'artifact
  // officiel, qui avait des références fictives).
  const MERC_REF = {};

  function margeConfiguree(p){
    const tauxTva = TVA[p.tva];
    const htPrix = F.ht(p.prix, tauxTva);
    const margeUnite = F.margeComptoir(p.prix, tauxTva, p.cout);
    const tauxConfigure = htPrix>0 ? F.tauxMarge(margeUnite, htPrix) : 0;
    const cat = CATEGORIE_TVA[p.tva];
    const cible = cibleEffective(p.id, cat) ?? null;
    const ecartEur = cible!==null ? margeUnite - (cible/100)*htPrix : null;
    return { htPrix, margeUnite, tauxConfigure, cat, cible, ecartEur, sousCible: cible!==null && tauxConfigure<cible };
  }

  function variationsFournisseur(){
    const byProduit = {};
    LIVRAISONS_HIST.forEach(l=>{ (byProduit[l.produit] ||= []).push(l); });
    const out = [];
    Object.entries(byProduit).forEach(([produit,arr])=>{
      arr.sort((a,b)=>a.date.localeCompare(b.date));
      for(let i=1;i<arr.length;i++){
        const prec=arr[i-1], cur=arr[i];
        const variation = (cur.prixU-prec.prixU)/prec.prixU*100;
        out.push({ produit, fournisseur:cur.fournisseur, datePrec:prec.date, dateCur:cur.date, prixPrec:prec.prixU, prixCur:cur.prixU, variation, alerte: Math.abs(variation)>=SEUIL_VARIATION });
      }
    });
    return out;
  }

  // CUMP — reproduit la formule du module Stock (cump() = coutBase tant qu'aucune livraison
  // n'a été saisie) sans toucher à Stk, déjà validé. Les Spartiates n'ont aujourd'hui aucune
  // livraison réelle : le CUMP affiché ici est donc exactement le coût matière du catalogue.
  function ecartsMercuriale(){
    return SPARTIATES.catalogue.map((p)=>{
      const key = p.stand+"_"+p.produit;
      const cump = p.cout;
      const ref = MERC_REF[key] ?? null;
      const ecart = ref!==null && ref>0 ? (cump-ref)/ref*100 : null;
      return { key, produit: p.produit, stand: p.stand, cump, ref, ecart, alerte: ecart!==null && ecart>=SEUIL_MERC };
    });
  }

  // Prix C&C ne couvre pas la marge — lu depuis Click & Collect (module 13), jamais recalculé.
  // §15.76 : depuis la bascule des tarifs C&C vers le module 13, le prix app appliqué (it.prixApp)
  // est modifiable manuellement là-bas — l'écart n'est donc plus nul par construction, il reflète
  // un vrai choix de Rémi (avant §15.76, Config produits appliquait toujours le prix conseillé).
  function verdictsCC(){
    return SPARTIATES.catalogue.filter(p=>{
      const stand = SPARTIATES.stands.find(s=>s.id===p.stand);
      return stand.pointRetraitCC;
    }).map(p=>{
      const tauxTva = TVA[p.tva];
      const pa = F.prixAppConseille(p.prix, tauxTva, SPARTIATES.commissionPct, SPARTIATES.kTva, SPARTIATES.stripePct);
      const v = F.verdict(pa, p.prix, tauxTva, SPARTIATES.commissionPct, SPARTIATES.kTva, SPARTIATES.stripePct);
      return { produit:p.produit, stand:p.stand, verdict:v, alerte: Math.abs(v)>SEUIL_VERDICT };
    });
  }

  function euros(n){ return (n<0?"−":"")+Math.abs(n).toFixed(2).replace(".",",")+" €"; }
  function pctSigned(n){ return (n>0?"+":"")+n.toFixed(1).replace(".",",")+" %"; }

  // §15.69 : "Marge réalisée sous cible" — LUE depuis Marges & ratios (module 5), jamais
  // recalculée ici. Mrg.lignes() (= snapshotSaison, déjà exposé publiquement pour cet usage
  // précis) donne un taux de marge réel par ligne catalogue, sur les vraies quantités
  // comptoir/C&C vendues (qC/qA) — différent de "Marge configurée sous cible" ci-dessous, qui
  // ignore les ventes réelles et ne regarde que le prix/coût actuellement configurés.
  function margeRealiseeSousCible(){
    return Mrg.lignes().filter(L => {
      const c = cibleEffective(L.p.id, L.cat);
      return L.taux!==null && c!==null && c!==undefined && L.taux < c;
    });
  }

  function renderKpis(){
    const margeAlertes = SPARTIATES.catalogue.map(margeConfiguree).filter(m=>m.sousCible).length;
    const fournAlertes = variationsFournisseur().filter(v=>v.alerte).length;
    const mercAlertes = ecartsMercuriale().filter(m=>m.alerte).length;
    const ccAlertes = verdictsCC().filter(v=>v.alerte).length;
    const margeRealAlertes = margeRealiseeSousCible().length;
    return `<div class="kpis" style="grid-template-columns:repeat(4,1fr);">
      <div class="kpi"><div class="v num">${margeAlertes+fournAlertes+mercAlertes}</div><div class="l">Alertes calculées ici</div></div>
      <div class="kpi"><div class="v num">${ccAlertes+margeRealAlertes}</div><div class="l">Alertes lues (autres modules)</div></div>
      <div class="kpi"><div class="v num">${margeAlertes}</div><div class="l">Marges configurées sous cible</div></div>
      <div class="kpi"><div class="v num">${fournAlertes+mercAlertes}</div><div class="l">Écarts fournisseur / mercuriale</div></div>
    </div>`;
  }

  function renderVue(){
    const rows = [];
    verdictsCC().filter(v=>v.alerte).forEach(v=>rows.push({ type:"Prix C&C ne couvre pas la marge", source:"lue", module:"Click & Collect (13)", detail:`${standNom(v.stand)} — ${v.produit}`, impact: euros(v.verdict)+"/vente" }));
    margeRealiseeSousCible().forEach(L=>{ const c = cibleEffective(L.p.id, L.cat); rows.push({ type:"Marge réalisée sous cible", source:"lue", module:"Marges & ratios (5)", detail:`${standNom(L.p.stand)} — ${L.p.produit} · taux réel ${pct(L.taux)} vs cible ${pct(c)}, saison complète`, impact: `${(L.taux-c).toFixed(1)} pt` }); });
    SPARTIATES.catalogue.map(margeConfiguree).forEach((m,i)=>{
      if(m.sousCible) rows.push({ type:"Marge configurée sous cible", source:"calculée", module:"Centre d'alertes", detail:`${standNom(SPARTIATES.catalogue[i].stand)} — ${SPARTIATES.catalogue[i].produit} · taux configuré ${m.tauxConfigure.toFixed(1)} % vs cible ${m.cible} %`, impact: euros(m.ecartEur)+"/vente" });
    });
    variationsFournisseur().filter(v=>v.alerte).forEach(v=>rows.push({ type:"Variation fournisseur", source:"calculée", module:"Centre d'alertes", detail:`${v.produit} (${v.fournisseur}) — ${euros(v.prixPrec)} → ${euros(v.prixCur)}`, impact: pctSigned(v.variation) }));
    ecartsMercuriale().filter(m=>m.alerte).forEach(m=>rows.push({ type:"Écart mercuriale", source:"calculée", module:"Centre d'alertes", detail:`${standNom(m.stand)} — ${m.produit} · payé ${euros(m.cump)} vs référence ${euros(m.ref)}`, impact: pctSigned(m.ecart) }));

    return `
    <div class="card">
      <strong class="title">Toutes les alertes actives</strong>
      <div class="hint">${rows.length} alerte(s). Les alertes « lues » viennent d'un module existant sans recalcul ; les « calculées » sont propres à ce module.</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:10px;">
        <span><span class="pil-dot lue"></span> Lue depuis un autre module</span>
        <span><span class="pil-dot calc"></span> Calculée ici (nouvelle)</span>
      </div>
      ${rows.length===0?`<div class="hint">Aucune alerte active aujourd'hui.</div>`:`<div style="overflow-x:auto;"><table><tr><th>Type</th><th>Détail</th><th>Origine</th><th class="r">Impact</th></tr>
      ${rows.map(r=>`<tr><td><span class="chip ${r.source==='lue'?'grey':'vio'}">${r.type}</span></td><td>${r.detail}</td><td style="color:var(--muted);">${r.module}</td><td class="r num"><span class="chip bad">alerte</span> ${r.impact}</td></tr>`).join("")}
      </table></div>`}
      <div class="hint" style="margin-top:8px;">Ce tableau n'écrit rien : chaque alerte « lue » se corrige dans son module d'origine.</div>
    </div>
    <div class="alertbox">Perte / écart de stock (modules 4/10) — écart d'intégration signalé : Stock n'expose aujourd'hui aucune donnée hors de son propre écran. Pas de chiffre recalculé en double tant que ce point de lecture n'existe pas.</div>`;
  }

  function renderMarge(){
    return `<div class="card">
      <strong class="title">Marge configurée vs cible</strong>
      <div class="hint">Compare, en continu et sans attendre une vente, le prix et le coût configurés dans Config produits (15b) à la cible de marge par catégorie (module 5, jamais ressaisie ici).</div>
      <div style="overflow-x:auto;"><table><tr><th>Stand</th><th>Produit</th><th class="r">Prix HT</th><th class="r">Coût matière</th><th class="r">Marge/vente</th><th class="r">Taux configuré</th><th class="r">Cible</th><th class="r">Écart</th><th>Statut</th></tr>
      ${SPARTIATES.catalogue.map(p=>{
        const m = margeConfiguree(p);
        return `<tr><td>${standNom(p.stand)}</td><td>${p.produit}</td><td class="r num">${eur(m.htPrix)}</td><td class="r num">${eur(p.cout)} <span class="chip warn">démo</span></td><td class="r num">${eur(m.margeUnite)}</td><td class="r num">${pct(m.tauxConfigure)}</td>
          <td class="r num">${m.cible===null?"—":pct(m.cible)}</td><td class="r num">${m.ecartEur===null?"—":eur(m.ecartEur)}</td>
          <td>${m.cible===null?'<span class="chip grey">aucune cible</span>':m.sousCible?'<span class="chip bad">Sous la cible</span>':'<span class="chip ok">Cible tenue</span>'}</td></tr>`;
      }).join("")}
      </table></div>
    </div>`;
  }

  function renderFourn(){
    const rows = variationsFournisseur();
    return `<div class="card">
      <strong class="title">Variation du prix d'achat dans le temps</strong>
      <div class="hint">Compare chaque nouvelle livraison à la précédente. <span class="chip warn">Jeu de test générique</span> — Stock n'a aujourd'hui aucune livraison réelle saisie pour ce lieu.</div>
      <div style="overflow-x:auto;"><table><tr><th>Produit</th><th>Fournisseur</th><th>Précédente</th><th>Nouvelle</th><th class="r">Variation</th><th>Statut</th></tr>
      ${rows.map(v=>`<tr><td>${v.produit}</td><td style="color:var(--muted);">${v.fournisseur}</td><td class="r num">${eur(v.prixPrec)} <span style="color:var(--muted);">(${v.datePrec})</span></td><td class="r num">${eur(v.prixCur)} <span style="color:var(--muted);">(${v.dateCur})</span></td><td class="r num">${pctSigned(v.variation)}</td><td>${v.alerte?'<span class="chip bad">Hausse à surveiller</span>':'<span class="chip ok">Stable</span>'}</td></tr>`).join("")}
      </table></div>
      <div class="hint" style="margin-top:8px;">Seuil de déclenchement : ${SEUIL_VARIATION} % — valeur de test, à ajuster avec Rémi.</div>
    </div>`;
  }

  function renderMerc(){
    const rows = ecartsMercuriale();
    return `<div class="card">
      <strong class="title">Mercuriale — prix de référence</strong>
      <div class="hint">Aucune source de marché fiable pour une buvette de stade : la référence est <b>saisie et maintenue ici</b>, comparée au CUMP (aujourd'hui = coût catalogue, faute de livraison réelle). Vide par défaut — rien n'est inventé pour préremplir.</div>
      <div style="overflow-x:auto;"><table><tr><th>Stand</th><th>Produit</th><th class="r">Prix payé (CUMP)</th><th class="r">Prix de référence</th><th class="r">Écart</th><th>Statut</th></tr>
      ${rows.map(m=>`<tr><td>${standNom(m.stand)}</td><td>${m.produit}</td><td class="r num">${eur(m.cump)}</td>
        <td class="r"><input class="cell" style="width:80px;" type="number" step="0.01" min="0" value="${m.ref===null?"":m.ref}" placeholder="—" data-merc="${m.key}"></td>
        <td class="r num" id="altEc_${m.key}">${m.ecart===null?"—":pctSigned(m.ecart)}</td>
        <td id="altSt_${m.key}">${m.ref===null?'<span class="chip grey">aucune référence</span>':m.alerte?'<span class="chip bad">Alerte</span>':'<span class="chip ok">OK</span>'}</td></tr>`).join("")}
      </table></div>
      <div class="hint" style="margin-top:8px;">Seuil de déclenchement : ${SEUIL_MERC} % — valeur de test, à ajuster avec Rémi.</div>
    </div>`;
  }
  function wireMerc(){
    document.querySelectorAll("#altPanel input[data-merc]").forEach(inp=>{
      inp.oninput = e=>{
        const key = e.target.dataset.merc, v = parseFloat(e.target.value);
        MERC_REF[key] = isNaN(v) || e.target.value.trim()==="" ? null : v;
        const m = ecartsMercuriale().find(x=>x.key===key);
        const ecEl = document.getElementById("altEc_"+key), stEl = document.getElementById("altSt_"+key);
        if(ecEl) ecEl.textContent = m.ecart===null?"—":pctSigned(m.ecart);
        if(stEl) stEl.innerHTML = m.ref===null?'<span class="chip grey">aucune référence</span>':m.alerte?'<span class="chip bad">Alerte</span>':'<span class="chip ok">OK</span>';
      };
    });
  }

  let onglet = "vue";
  const RENDERERS_ALT = { vue: renderVue, marge: renderMarge, fourn: renderFourn, merc: renderMerc };
  const TABS = [["vue","Vue d'ensemble"],["marge","Marge configurée"],["fourn","Variation fournisseur"],["merc","Mercuriale"]];

  function markup(){
    return `
    ${renderKpis()}
    <div class="cmd-tabs">${TABS.map(([k,l])=>`<button class="cmd-tabbtn alt-tabbtn ${onglet===k?'active':''}" data-tab="${k}">${l}</button>`).join("")}</div>
    <div id="altPanel">${RENDERERS_ALT[onglet]()}</div>
    ${rulesBlock("centre-alertes","comment ces alertes sont calculées (module 18)", `
      <b>Deux rôles, jamais mélangés</b> : ce module lit sans recalculer deux alertes qui existent déjà ailleurs (prix C&amp;C ne couvre pas la marge — module 15b ; marge réalisée sous cible — module 5, saison complète, sur les ventes réelles) et signale un écart d'intégration où la lecture croisée n'existe pas encore (perte/écart de stock, modules 4/10 — Stock n'expose aujourd'hui aucun accesseur public). Il calcule lui-même trois comparaisons nouvelles.<br><br>
      <b>Prix C&amp;C ne couvre pas la marge</b> : <code>verdict = resteApp − resteComptoir</code> (fiche « Verdict du prix appliqué », moteur F). <span class="chip vio">corrigé §15.76</span> Depuis la bascule des tarifs C&amp;C vers le module 13, le prix app appliqué s'y modifie manuellement — cette alerte peut désormais réellement se déclencher (avant §15.76, Config produits appliquait toujours le prix conseillé, donc l'écart était nul par construction).<br><br>
      <b>Marge réalisée sous cible</b> <span class="chip vio">corrigé §15.69, étendu §15.78</span> : lue depuis Marges &amp; ratios (module 5, <code>Mrg.lignes()</code>, saison complète) — taux de marge calculé sur les quantités comptoir/C&amp;C réellement vendues, comparé à la cible effective du produit (cible par produit si saisie, sinon cible de sa catégorie — <code>cibleEffective()</code>, §15.78). Différente de « Marge configurée sous cible » juste en dessous : celle-ci ignore les ventes, celle-là en dépend directement. <span class="chip warn">reste inactive tant qu'aucune cible n'est saisie</span> : par défaut, ni les cibles par catégorie (<code>PILOTAGE_CIBLES</code>) ni les cibles par produit (<code>PILOTAGE_CIBLES_PRODUIT</code>) ne sont préremplies, faute de valeur communiquée par Rémi — aucune marge réalisée n'est donc comparée à une cible tant que Rémi n'en saisit pas une (onglet « Cibles de marge », module 5), même limite structurelle que documentée à l'audit §15.60.<br><br>
      <b>Marge configurée sous cible</b> (calculée ici) : compare la marge configurée (15b) à la cible du module 5 — réagit dès qu'un prix ou un coût change, avant toute vente, sans attendre une vente réelle.<br><br>
      <b>Variation du prix d'achat</b> et <b>Écart à la mercuriale</b> : Stock n'a aujourd'hui aucune livraison réelle pour Les Spartiates — jeu de test générique pour la variation fournisseur, CUMP = coût catalogue (même formule que le module Stock) pour la mercuriale, comparé à une référence saisie ici et vide par défaut.<br><br>
      <b>Ce module n'écrit jamais dans un autre module.</b>
    `)}`;
  }
  function mount(){
    document.querySelectorAll(".alt-tabbtn").forEach(b=>b.onclick=()=>{
      onglet = b.dataset.tab;
      const c = document.getElementById("cloture-pilotagePane");
      if(c){ c.innerHTML = markup(); mount(); }
    });
    wireMerc();
    wireRules();
  }
  return { markup, mount };
})();

// §15.83/§15.84 — Module 8, construit à la demande de Rémi (« MODULES COUT BUVETTE ? on fait
// quoi ? »), vue consolidée complète, puis revu (§15.84) : déplacé dans Configuration, et la
// répartition en % du §15.83 (jugée « bizarre » par Rémi) remplacée par une saisie manuelle et
// indépendante des coûts de structure pour CHAQUE stand — plus de clé de répartition du tout.
// Ne recalcule ni le coût matière (Mrg.lignes(), déjà exposé et déjà réutilisé par
// Optimisation/Centre d'alertes) ni la masse salariale (Per.masseParStandSaison(), accesseur
// ajouté au module Personnel pour l'occasion, même principe). Les coûts de structure (loyer,
// logiciel, abonnement, TPE), eux, sont entièrement nouveaux et saisis directement par stand,
// à 0 par défaut — rien n'est inventé, conservés pour toute la saison. Détail des choix dans le
// dossier, §15.83 et §15.84.
const Cpb = (function(){
  const eur0 = n => Math.round(n||0).toLocaleString("fr-FR")+" €";
  const pct1 = n => (Math.round((n||0)*10)/10).toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1})+" %";

  const POSTES = [
    { id:"loyer",      nom:"Loyer" },
    { id:"logiciel",   nom:"Logiciel" },
    { id:"abonnement", nom:"Abonnement(s)" },
    { id:"tpe",        nom:"TPE (terminal de paiement)" },
  ];
  // §15.84 : une valeur par stand ET par poste, saisie directement, indépendante d'un stand à
  // l'autre — plus de montant global ni de clé de répartition. Tout à 0 par défaut.
  const VALEURS = {};
  function assurerValeursStands(){
    // §15.88 : ajoute une entrée à 0 pour tout nouveau stand, sans jamais toucher aux valeurs
    // déjà saisies pour les stands existants.
    SPARTIATES.stands.forEach(st => { if(!VALEURS[st.id]) VALEURS[st.id] = { loyer:0, logiciel:0, abonnement:0, tpe:0 }; });
  }
  assurerValeursStands();
  onSpartiatesChange(assurerValeursStands);

  const COL = { matiere:"var(--violet)", masse:"var(--cc, #eb6834)", loyer:"var(--amber)", logiciel:"var(--green)", abonnement:"#5b8dee", tpe:"#9a9aa2" };

  const structPartStand = standId => POSTES.reduce((s,p)=>s+(VALEURS[standId]?.[p.id]||0),0);
  const totalStructure  = () => SPARTIATES.stands.reduce((s,st)=>s+structPartStand(st.id),0);
  const totalPoste      = posteId => SPARTIATES.stands.reduce((s,st)=>s+(VALEURS[st.id]?.[posteId]||0),0);

  function coutMatiereParStand(){
    const m = {}; SPARTIATES.stands.forEach(s=>m[s.id]=0);
    Mrg.lignes().forEach(x=>{ m[x.stand.id] = (m[x.stand.id]||0) + x.cout; });
    return m;
  }
  function lignesStand(){
    const cm = coutMatiereParStand(), ms = Per.masseParStandSaison();
    return SPARTIATES.stands.map(st=>{
      const matiere = cm[st.id]||0, masse = ms[st.id]||0, structure = structPartStand(st.id);
      return { stand:st, matiere, masse, structure, total: matiere+masse+structure };
    });
  }

  function renderGrille(){
    return `<div class="card">
      <strong class="title">Coûts de structure, par stand <span class="chip vio">saisie directe §15.84</span></strong>
      <div class="hint">Chaque stand a ses propres frais réels, saisis indépendamment ici — <b>tout est à 0 par défaut, rien n'est préchargé ni inventé</b>. Pas de montant global ni de clé de répartition : ce que tu saisis pour un stand ne dépend d'aucun autre. Conservé pour toute la saison, modifiable à tout moment. Le loyer, le logiciel, l'abonnement et le TPE ne se rattachent à aucune soirée précise, contrairement au reste de Gestion financière (calculé soirée par soirée) : ce sont des charges permanentes du lieu.</div>
      <div style="overflow-x:auto;margin-top:10px;"><table><thead><tr>
        <th>Stand</th>${POSTES.map(p=>`<th class="r">${p.nom}</th>`).join("")}<th class="r">Total stand</th></tr></thead><tbody>
        ${SPARTIATES.stands.map(st=>`<tr><td style="font-weight:600;">${st.nom}</td>
          ${POSTES.map(p=>`<td class="r"><input class="cell sm" style="width:80px;" type="number" min="0" step="10" data-cpbval="${st.id}|${p.id}" value="${VALEURS[st.id][p.id]}"></td>`).join("")}
          <td class="r num" style="font-weight:700;">${eur0(structPartStand(st.id))}</td></tr>`).join("")}
      </tbody><tfoot><tr><td>Total</td>
        ${POSTES.map(p=>`<td class="r num">${eur0(totalPoste(p.id))}</td>`).join("")}
        <td class="r num" style="font-weight:700;">${eur0(totalStructure())}</td></tr></tfoot></table></div>
    </div>`;
  }

  function renderTableau(){
    const L = lignesStand(), totGen = L.reduce((s,x)=>s+x.total,0);
    return `<div class="card">
      <strong class="title">Coût consolidé par stand <span class="chip grey">saison complète, pas de sélecteur de soirée</span></strong>
      <div class="hint">Coût matière <span class="chip vio">lu de Marges &amp; ratios</span> et masse salariale <span class="chip vio">lue du planning Personnel</span> — mêmes données que les autres modules, rien n'est resaisi ni recalculé ici. Coûts de structure = total des 4 postes saisis pour ce stand, ci-dessus.</div>
      <div style="overflow-x:auto;margin-top:10px;"><table><thead><tr>
        <th>Stand</th><th class="r">Coût matière</th><th class="r">Masse salariale</th><th class="r">Coûts de structure</th><th class="r">Total</th><th class="r">Part</th></tr></thead><tbody>
        ${L.map(x=>`<tr><td style="font-weight:600;">${x.stand.nom}</td>
          <td class="r num">${eur0(x.matiere)}</td>
          <td class="r num">${eur0(x.masse)}</td>
          <td class="r num">${eur0(x.structure)}</td>
          <td class="r num" style="font-weight:700;">${eur0(x.total)}</td>
          <td class="r num" style="color:var(--muted);">${pct1(totGen?x.total/totGen*100:0)}</td></tr>`).join("")}
      </tbody><tfoot><tr><td>Total</td>
        <td class="r num">${eur0(L.reduce((s,x)=>s+x.matiere,0))}</td>
        <td class="r num">${eur0(L.reduce((s,x)=>s+x.masse,0))}</td>
        <td class="r num">${eur0(L.reduce((s,x)=>s+x.structure,0))}</td>
        <td class="r num" style="font-weight:700;">${eur0(totGen)}</td><td class="r num">100,0 %</td></tr></tfoot></table></div>
      <div class="alertbox" style="margin-top:10px;"><b>Le Spartiate Café n'a aucune affectation dans le planning Personnel actuel</b> (échantillon de test incomplet, §14 point 6) — sa masse salariale ci-dessus affiche 0 ; ce n'est pas une réalité (ce stand a du personnel, seulement pas encore saisi dans le planning nominatif).</div>
      <div class="alertbox">Ce total « masse salariale » ne correspond pas à celui affiché dans Dashboard → Gestion financière : deux bases différentes (planning nominatif par stand ici, estimation globale par rôle là-bas) — point déjà ouvert avant ce module (§14 point 6), non refermé par lui.</div>
    </div>`;
  }

  function renderCamembert(){
    const cm = coutMatiereParStand(), ms = Per.masseParStandSaison();
    const totMat = Object.values(cm).reduce((a,b)=>a+b,0), totMasse = Object.values(ms).reduce((a,b)=>a+b,0);
    const segs = [
      { label:"Coût matière", val: totMat, color: COL.matiere },
      { label:"Masse salariale", val: totMasse, color: COL.masse },
      { label:"Loyer", val: totalPoste("loyer"), color: COL.loyer },
      { label:"Logiciel", val: totalPoste("logiciel"), color: COL.logiciel },
      { label:"Abonnement(s)", val: totalPoste("abonnement"), color: COL.abonnement },
      { label:"TPE", val: totalPoste("tpe"), color: COL.tpe },
    ];
    const total = segs.reduce((s,x)=>s+x.val,0);
    let acc=0;
    const stops = segs.map(s=>{ const a=total?acc/total*360:0; acc+=s.val; const b=total?acc/total*360:0; return `${s.color} ${a}deg ${b}deg`; }).join(", ");
    return `<div class="card">
      <strong class="title">Répartition des coûts <span class="chip grey">camembert, saison complète</span></strong>
      <div class="hint">Concrétise, pour ce module, la décision transversale de data-visualisation actée au dossier (§11, 2026-09-07 — « à valider module par module »). 6 postes plutôt que les 5 notés à l'origine : « Abonnement(s) » est un poste à part de « Logiciel » dans la destination retenue pour ce module (dossier §14), pas fondu dedans.</div>
      <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-top:12px;">

  function rulesHtml(){

      <p><b>Ce module comble un vide explicitement documenté ailleurs</b> : Gestion financière (Dashboard) exclut volontairement le loyer, les salaires permanents et l'assurance de la marge nette de la soirée, faute de clé de répartition. Coûts par buvette est l'endroit prévu pour cette information.</p>

      <p><b>Masse salariale</b> = reprise du planning nominatif du module Personnel (affectation par stand, §15.80), pas de l'estimation par rôle de Gestion financière — les deux totaux ne concordent pas, par construction (échantillons différents, point ouvert §14 point 6).</p>
      <p><b>Pas de sélecteur de soirée</b> : les coûts de structure sont mensuels/permanents par nature ; le coût matière et la masse salariale repris ici sont des totaux saison complète. Un coût par stand et par soirée n'est pas construit ici — à rouvrir si besoin.</p>

  function repaint(){

})();

/* ============================================================
   §15.88 — Gestion des stands & caisses (nouveau module, Configuration).
   Écran d'administration pour la couche de mutation ajoutée en tête de
   fichier (ajouterStand/renommerStand/ajouterCaisse/reassignerCaisse/
   renommerCaissier). Phase 1 uniquement : ajout, renommage,
   réassignation — pas de suppression/désactivation d'un stand (§15.88 :
   trop de données déjà rattachées à son id ailleurs, repoussé).
   Un stand nouvellement créé reste sans produits tant que Config
   produits n'a pas de bouton « ajouter un produit » (limite déjà
   signalée, pas construite ici).
   ============================================================ */
const Gsc = (function(){
  let nomNouveauStand = "";
  let caissierParStand = {}; // brouillon du champ "nom du caissier" par stand, avant clic "+ Ajouter une caisse"

  function repaint(){
    const c = document.getElementById("configurationPane");
    if(c){ c.innerHTML = markup(); mount(); }
  }

  function renderStand(s){
    return `
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
        <input class="cell" style="max-width:260px;font-weight:700;" data-gscrename="${s.id}" value="${s.nom}">
        <span class="chip grey">id interne : ${s.id}</span>
        <span class="chip">${s.caisses.length} caisse${s.caisses.length>1?"s":""}</span>
        ${s.pointRetraitCC?`<span class="chip ok">point de retrait C&amp;C</span>`:""}
      </div>
      <table>
        <thead><tr><th>Caisse</th><th>Caissier(e)</th><th>Réassigner à</th></tr></thead>
        <tbody>
        ${s.caisses.length===0?`<tr><td colspan="3" style="color:var(--muted);">Aucune caisse sur ce stand pour l'instant.</td></tr>`:
          s.caisses.map(c=>`<tr>
            <td class="mono">Caisse ${c}</td>
            <td><input class="cell sm" data-gscrenamecaissier="${c}" value="${SPARTIATES.caissiers[c]||""}"></td>
            <td><select class="cell sm" data-gscreassign="${c}">
              ${SPARTIATES.stands.map(st=>`<option value="${st.id}" ${st.id===s.id?"selected":""}>${st.nom}</option>`).join("")}
            </select></td>
          </tr>`).join("")}
        </tbody>
      </table>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;">
        <input class="cell sm" style="max-width:220px;" placeholder="Nom du/de la caissier(e) (optionnel)" data-gscnewcaissier="${s.id}" value="${caissierParStand[s.id]||""}">
        <button class="cta ghost" data-gscaddcaisse="${s.id}">+ Ajouter une caisse à ce stand</button>
      </div>
    </div>`;
  }

  function markup(){
    return `
    <div class="alertbox">Phase 1 (§15.88) : ajout de stand, ajout/réassignation de caisse, renommage — pas de suppression. Un stand ajouté ici apparaît partout dans l'app (Stock, Ventes &amp; CA, Personnel, Coûts par buvette, Journal, Conformité, Écarts...) mais démarre <b>sans aucun produit au catalogue</b> : Config produits n'a pas encore de bouton « ajouter un produit », donc rien n'est vendable dessus tant que ce chantier séparé n'est pas fait.</div>
    ${SPARTIATES.stands.map(renderStand).join("")}
    <div class="card">
      <strong class="title">Ajouter un stand</strong>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;">
        <input class="cell" style="max-width:280px;" placeholder="Nom du nouveau stand" id="gscNewStandNom" value="${nomNouveauStand}">
        <button class="cta" id="gscBtnAddStand">+ Ajouter ce stand</button>
      </div>
      <div class="hint" style="margin-top:8px;">L'identifiant interne est déduit automatiquement du nom (3 premières lettres, en majuscules) — affiché en gris sur chaque carte ci-dessus une fois créé.</div>
    </div>
    ${rulesBlock("gestion-stands-caisses","comment cet écran modifie les données", `
      <b>Ajouter un stand</b> : ajoute une entrée à <code>SPARTIATES.stands</code>, sans caisse au départ. <b>Ajouter une caisse</b> : lui attribue le prochain numéro de caisse disponible (numérotation globale, jamais réutilisée) et l'ajoute à <code>SPARTIATES.caissiers</code>. <b>Réassigner</b> : retire la caisse de son stand actuel et l'ajoute au stand choisi — son numéro et son historique (Journal) restent identiques. <b>Renommer</b> : change uniquement le libellé affiché (stand ou caissier), jamais l'identifiant interne. Rien de tout cela ne supprime ou ne recalcule une donnée déjà scellée (Journal, clôtures) — ce sont des listes de référence, pas un historique.
    `)}
    `;
  }

  function mount(){
    const ns = document.getElementById("gscNewStandNom");
    if(ns) ns.oninput = e => { nomNouveauStand = e.target.value; };
    const badd = document.getElementById("gscBtnAddStand");
    if(badd) badd.onclick = () => {
      const nom = (document.getElementById("gscNewStandNom")||{}).value || "";
      if(!nom.trim()){ toast("Donne un nom au stand avant de l'ajouter."); return; }
      ajouterStand(nom);
      nomNouveauStand = "";
      repaint();
    };
    document.querySelectorAll("[data-gscrename]").forEach(i=>{
      i.onchange = e => { renommerStand(e.target.dataset.gscrename, e.target.value); repaint(); };
    });
    document.querySelectorAll("[data-gscrenamecaissier]").forEach(i=>{
      i.onchange = e => { renommerCaissier(parseInt(e.target.dataset.gscrenamecaissier,10), e.target.value); repaint(); };
    });
    document.querySelectorAll("[data-gscreassign]").forEach(s=>{
      s.onchange = e => { reassignerCaisse(parseInt(e.target.dataset.gscreassign,10), e.target.value); repaint(); };
    });
    document.querySelectorAll("[data-gscnewcaissier]").forEach(i=>{
      i.oninput = e => { caissierParStand[e.target.dataset.gscnewcaissier] = e.target.value; };
    });
    document.querySelectorAll("[data-gscaddcaisse]").forEach(b=>{
      b.onclick = e => {
        const standId = e.target.dataset.gscaddcaisse;
        ajouterCaisse(standId, caissierParStand[standId]||"");
        delete caissierParStand[standId];
        repaint();
      };
    });
  }

  return { markup, mount };
})();

// §15.81/§15.84 : les objets *_PANES / RENDERERS / wire_ de ce groupe (Marges & ratios,
// Optimisation, Centre d'alertes) sont fusionnés avec ceux de la section Clôture de soirée en un
// seul module « Clôture & Pilotage » — regroupement construit plus bas (voir
// CLOTURE_PILOTAGE_PANES, après la section Clôture de soirée), une fois que ses propres
// fonctions de rendu (renderEcartCaisse, renderEcartCloture, renderReportingSoiree) sont elles
// aussi définies. Rien n'est recalculé ni dupliqué ici : Mrg, Opt, Alt gardent leurs fonctions
// markup()/mount() d'origine, inchangées. Coûts par buvette (Cpb) — construit au §15.83 — a
// rejoint la section Configuration au §15.84, pas ce groupe ; il lit Mrg.lignes() et

/* ============================================================
   SECTION 4 — Finances
   Modules fusionnés : 2 (Ventes & CA, clos 12/09, §15.27),
   11 (Gestion financière, clos, statut corrigé le 12/09).
   Reconstruit fidèlement le 17/09 (§15.56) depuis l'artifact officiel
   dédié (5ec8d293…), lu intégralement suite au signalement de Rémi
   (« tu n'as pas intégré le bon module validé »). Restaurés : KPI de
   delta vs soirée précédente, graphique CA par heure (SVG réel),
   tableau « Détail par stand » avec % du CA et case C&C (démo).
   Simplification assumée et signalée avec précision (pas de manière
   générale comme au §15.41, qui affirmait à tort qu'un substitut CSS
   existait pour le graphique horaire — il n'existait pas) :
   - Delta vs soirée précédente : calculé entre les deux dernières
     soirées de TEST déjà au dossier (Grenoble → Bayonne, §15.27) —
     Les Spartiates n'ont pas encore un vrai « match précédent ».
   - Graphique « CA par heure » : jeu HOURLY repris VERBATIM de
     l'artifact officiel (substitution fidèle-mais-honnête, disclosed
     générique) — Les Spartiates n'ont aucune vente réelle horodatée.
   - Le graphique « CA par stand » reste en barres CSS (pas la barre
     SVG horizontale de l'artifact) — seule simplification de
     présentation restante, même donnée réelle des 4 stands.
   ============================================================ */
const Vca = (function(){
  const GENESE = "0".repeat(64);
  async function sha256Hex(str){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  function court(h){ return h ? h.slice(0,10)+"…"+h.slice(-6) : "—"; }
  function serialiser(evt){ const { empreinte, _id, ...champs } = evt; return JSON.stringify(champs); }
  async function sceller(evtSansEmpreinte, precedente){
    const avecPrec = { ...evtSansEmpreinte, empreinte_precedente: precedente };
    const empreinte = await sha256Hex(serialiser(avecPrec));
    return { ...avecPrec, empreinte };
  }
  // Trois soirées de test déjà validées au dossier (§15.27) — mêmes chiffres que le prototype isolé,
  // rien de nouveau inventé ici. Les Spartiates n'ont pas encore de soirée réelle clôturée.
  const JOURS = [
    { id:"e1", mois:"2026-08", date:"22/08/2026", evt:"Toulon",   tickets:2180, total_ttc:16402.36 },
    { id:"e2", mois:"2026-09", date:"05/09/2026", evt:"Grenoble", tickets:2690, total_ttc:20237.64 },
    { id:"e3", mois:"2026-09", date:"12/09/2026", evt:"Bayonne",  tickets:2510, total_ttc:18640.00 },
  ];
  // Jeu de démo repris verbatim de l'artifact officiel (5ec8d293…) — aucune vente réelle horodatée
  // n'existe pour Les Spartiates (Ma caisse ne leur a pas encore servi en conditions réelles).
  const HOURLY = [["18h",640],["19h",2180],["20h",3120],["21h",1980],["22h",2760],["23h",1240]];
  const MOIS_LABEL = { "2026-08":"Août 2026", "2026-09":"Septembre 2026" };
  const state = { tab:"soiree", spectateurs:4800, chaine:[], moisClotures:{}, exerciceCloture:null, integrite:null, seeded:false,
    ccSim: Object.fromEntries(SPARTIATES.stands.map(s=>[s.id, !!s.pointRetraitCC])),
    // §15.89 : soirées choisies pour la comparaison libre — par défaut les deux dernières
    // (même paire que le delta automatique ci-dessus), modifiable par Rémi.
    compareA: JOURS[JOURS.length-2].id, compareB: JOURS[JOURS.length-1].id };

  // Répartition démo du CA de la soirée-jeu de test entre les 4 stands réels des Spartiates, pondérée par le
  // nombre de lignes du catalogue de chaque stand — aucune vente réelle par stand n'existe encore pour ce lieu.
  function perStand(totalTTC){
    const poids = SPARTIATES.stands.map(s=>SPARTIATES.catalogue.filter(p=>p.stand===s.id).length);
    const poidsTot = poids.reduce((a,b)=>a+b,0);
    return SPARTIATES.stands.map((s,i)=>{
      const totalStand = totalTTC * poids[i]/poidsTot;
      const actif = !!state.ccSim[s.id];
      const cc = actif ? totalStand*0.22 : 0; // part C&C démo, seulement si la case « C&C actif (démo) » est cochée
      return { id:s.id, nom:s.nom, comptoir: totalStand-cc, cc, total: totalStand, ccActif: actif, ccReel: !!s.pointRetraitCC };
    });
  }

  function showTT(evt, html){
    const tt = document.getElementById("ttGlobal");
    tt.innerHTML = html; tt.style.left = evt.clientX+"px"; tt.style.top = (evt.clientY-10)+"px";
    tt.classList.add("show");
  }
  function hideTT(){ const tt=document.getElementById("ttGlobal"); if(tt) tt.classList.remove("show"); }

  function renderLineChart(){
    const svg = document.getElementById("vcaLineChart");
    if(!svg) return;
    const W=520,H=220,padL=40,padR=14,padT=14,padB=28;
    const max = Math.max(...HOURLY.map(h=>h[1]))*1.15;
    const x = i => padL + (W-padL-padR) * (i/(HOURLY.length-1));
    const y = v => H-padB - (H-padT-padB) * (v/max);
    let g = "";
    for(let i=0;i<=3;i++){ const v = max*i/3;
      g += `<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>`;
      g += `<text x="${padL-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(v/1000)}k</text>`; }
    HOURLY.forEach((h,i)=>{ g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${h[0]}</text>`; });
    const pts = HOURLY.map((h,i)=>`${x(i)},${y(h[1])}`).join(" ");
    g += `<polyline points="${pts}" fill="none" stroke="var(--violet)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    HOURLY.forEach((h,i)=>{ g += `<circle cx="${x(i)}" cy="${y(h[1])}" r="4" fill="var(--violet)" stroke="var(--surface)" stroke-width="2" class="vca-pt" data-h="${h[0]}" data-v="${h[1]}"/>`; });
    svg.innerHTML = g;
    svg.querySelectorAll(".vca-pt").forEach(c=>{
      c.addEventListener("mousemove", e=>showTT(e, `<b>${c.dataset.h}</b> — ${eur(+c.dataset.v)}`));
      c.addEventListener("mouseleave", hideTT);
    });
  }

  // §15.70 : graphique SVG horizontal restauré (barre Comptoir + segment C&C empilé, défilement
  // vertical) — reprend exactement renderBars() de l'artifact officiel, remplace les barres CSS.
  function renderBarsSvg(ps){
    const svg = document.getElementById("vcaBarChart");
    if(!svg) return;
    const rowH = 40, W = 460, padL = 92, padR = 70, padT = 6;
    const H = padT + ps.length*rowH + 6;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("height", H);
    const max = Math.max(...ps.map(s=>s.total))*1.08;
    const scale = v => (W-padL-padR) * (v/max);
    let g = "";
    ps.forEach((s,i)=>{
      const cy = padT + i*rowH + rowH/2;
      const barH = 20, y0 = cy - barH/2;
      g += `<text x="${padL-10}" y="${cy+4}" text-anchor="end" font-size="11.5" font-weight="600" fill="var(--text)">${s.nom}</text>`;
      const wComptoir = scale(s.comptoir);
      g += `<rect x="${padL}" y="${y0}" width="${wComptoir}" height="${barH}" rx="4" fill="var(--violet)" class="vca-seg" data-lab="Comptoir" data-stand="${s.nom}" data-v="${s.comptoir}"/>`;
      let endX = padL + wComptoir;
      if(s.ccActif){
        const wCC = scale(s.cc);
        const xCC = endX + 2;
        g += `<rect x="${xCC}" y="${y0}" width="${wCC}" height="${barH}" rx="4" fill="var(--cc)" class="vca-seg" data-lab="Click &amp; Collect" data-stand="${s.nom}" data-v="${s.cc}"/>`;
        endX = xCC + wCC;
        g += `<text x="${endX+6}" y="${cy+4}" font-size="11" font-weight="700" fill="var(--text)">${eur(s.total)}</text>`;
      } else {
        g += `<text x="${endX+6}" y="${cy+4}" font-size="11" font-weight="700" fill="var(--text)">${eur(s.total)}</text>`;
        g += `<text x="${endX+6}" y="${cy+16}" font-size="9" fill="var(--muted)">pas de C&amp;C</text>`;
      }
    });
    svg.innerHTML = g;
    svg.querySelectorAll(".vca-seg").forEach(r=>{
      r.addEventListener("mousemove", e=>showTT(e, `<b>${r.dataset.stand}</b> — ${r.dataset.lab}: ${eur(+r.dataset.v)}`));
      r.addEventListener("mouseleave", hideTT);
    });
  }

  function renderStandTable(ps){
    const t = document.getElementById("vcaStandTable");
    if(!t) return;
    const totalAll = ps.reduce((s,x)=>s+x.total,0);
    let html = `<thead><tr><th>Stand</th><th class="r">Comptoir</th><th class="r">Click &amp; Collect</th><th class="r">Total</th><th class="r">% du CA</th><th>C&amp;C actif (démo)</th></tr></thead><tbody>`;
    ps.forEach(s=>{
      html += `<tr>
        <td style="font-weight:600;">${s.nom}</td>
        <td class="r num">${eur(s.comptoir)}</td>
        <td class="r num" style="${s.ccActif?'color:var(--cc);font-weight:600;':'color:var(--muted);'}">${s.ccActif?eur(s.cc):"— non simulé"}</td>
        <td class="r num" style="font-weight:700;">${eur(s.total)}</td>
        <td class="r num" style="color:var(--muted);">${pct(s.total/totalAll*100)}</td>
        <td><label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" data-standcc="${s.id}" ${s.ccActif?"checked":""}/> ${s.ccReel?"":`<span class='chip grey' style='margin-left:4px;'>non équipé réellement</span>`}</label></td>
      </tr>`;
    });
    html += `<tr><td style="font-weight:700;">Total</td>
      <td class="r num" style="font-weight:700;">${eur(ps.reduce((s,x)=>s+x.comptoir,0))}</td>
      <td class="r num" style="font-weight:700;color:var(--cc);">${eur(ps.reduce((s,x)=>s+x.cc,0))}</td>
      <td class="r num" style="font-weight:800;">${eur(totalAll)}</td><td class="r"></td><td></td></tr></tbody>`;
    t.innerHTML = html;
    t.querySelectorAll("input[type=checkbox]").forEach(cb=>{
      cb.onchange = e => { state.ccSim[e.target.dataset.standcc] = e.target.checked; rerenderSoiree(); };
    });
  }

  // §15.89 : statistiques d'une soirée quelconque de JOURS, même calcul que renderSoiree()
  // (perStand), rien de dupliqué — juste appliqué à un jour choisi au lieu du dernier.
  function statsPourSoiree(j){
    const ps = perStand(j.total_ttc);
    const totalTTC = ps.reduce((s,x)=>s+x.total,0);
    return { jour:j, ps, totalTTC, tickets:j.tickets, panier: totalTTC/j.tickets };
  }
  function renderComparaison(){
    const A = JOURS.find(j=>j.id===state.compareA) || JOURS[0];
    const B = JOURS.find(j=>j.id===state.compareB) || JOURS[JOURS.length-1];
    const sA = statsPourSoiree(A), sB = statsPourSoiree(B);
    const ecartPct = (a,b) => a===0 ? null : (b-a)/a;
    const ecartTxt = e => e===null ? "—" : `<span class="${e>=0?'':'num'}" style="color:${e>=0?'var(--green,#1a9c5a)':'var(--red)'};font-weight:600;">${e>=0?'▲ +':'▼ '}${(e*100).toFixed(1)} %</span>`;
    return `
    <div class="card">
      <strong class="title">Comparer deux soirées</strong>
      <div class="hint">Choisis librement les deux soirées à comparer, parmi celles déjà présentes dans Ventes &amp; CA — <span class="chip warn">${JOURS.length} soirée(s) de démonstration aujourd'hui</span>, pas encore de « match 1 » à « match 10 » réels (aucune soirée réelle clôturée pour Les Spartiates à ce jour, §15.89). Ce sélecteur s'étendra automatiquement, sans rien reconstruire, le jour où d'autres soirées seront ajoutées ici.</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 16px;">

    const deltaCA = (totalTTC-precedente.total_ttc)/precedente.total_ttc;
    const deltaTickets = (tickets-precedente.tickets)/precedente.tickets;
    const deltaPanier = (panier-panierPrec)/panierPrec;
    const ratio100 = tickets/state.spectateurs*100;
    const caSpec = totalTTC/state.spectateurs;
    const maxTotal = Math.max(...ps.map(s=>s.total));

  function moisPresents(){ return [...new Set(JOURS.map(j=>j.mois))]; }
  function joursDuMois(m){ return JOURS.filter(j=>j.mois===m); }
  function totalPerpetuelActuel(){ return state.chaine.filter(e=>e.type==="cloture_mois").reduce((s,e)=>s+e.grand_total,0); }
  function tousLesMoisClotures(){ return moisPresents().every(m=>state.moisClotures[m]); }
  function derniereEmpreinte(){ return state.chaine.length ? state.chaine[state.chaine.length-1].empreinte : GENESE; }

  async function seedJournal(){
    if(state.seeded) return;
    state.seeded = true;
    let prec = GENESE;
    for(const j of JOURS){
      const evt = { type:"cloture_jour", id:j.id, date:j.date, evenement:j.evt, mois:j.mois, tickets:j.tickets, total_ttc:j.total_ttc };
      const s = await sceller(evt, prec);
      state.chaine.push(s); prec = s.empreinte;
    }
    rerenderClotures();
  }
  async function cloturerMois(m){
    const jours = joursDuMois(m);
    const grand_total = +jours.reduce((s,j)=>s+j.total_ttc,0).toFixed(2);
    const total_perpetuel_apres = +(totalPerpetuelActuel()+grand_total).toFixed(2);
    const evt = { type:"cloture_mois", mois:m, grand_total, total_perpetuel_apres, jours: jours.map(j=>j.id) };
    const s = await sceller(evt, derniereEmpreinte());
    state.chaine.push(s); state.moisClotures[m]=s;
    rerenderClotures();
  }
  async function cloturerExercice(){
    const grand_total = +Object.values(state.moisClotures).reduce((s,m)=>s+m.grand_total,0).toFixed(2);
    const evt = { type:"cloture_exercice", exercice:"2026", grand_total, total_perpetuel_apres: totalPerpetuelActuel(), mois:Object.keys(state.moisClotures) };
    const s = await sceller(evt, derniereEmpreinte());
    state.chaine.push(s); state.exerciceCloture = s;
    rerenderClotures();
  }
  async function verifierIntegrite(){
    let precedente = GENESE, premiereRompueId = null;
    for(let i=0;i<state.chaine.length;i++){
      const evt = state.chaine[i];
      const attendue = await sha256Hex(serialiser(evt));
      const ok = evt.empreinte_precedente===precedente && evt.empreinte===attendue;
      if(!ok && premiereRompueId===null) premiereRompueId = i;
      precedente = evt.empreinte;
    }
    state.integrite = { premiereRompueId };
    rerenderClotures();
  }
  function evLabel(evt){
    if(evt.type==="cloture_jour") return { cls:"", titre:`Clôture soirée · ${evt.evenement} (${evt.date})`, montant:eur(evt.total_ttc) };
    if(evt.type==="cloture_mois") return { cls:"mois", titre:`Clôture mensuelle · ${MOIS_LABEL[evt.mois]||evt.mois}`, montant:eur(evt.grand_total) };
    if(evt.type==="cloture_exercice") return { cls:"exercice", titre:`Clôture annuelle · exercice ${evt.exercice}`, montant:eur(evt.grand_total) };
    return { cls:"", titre:evt.type, montant:"" };
  }
  function renderClotures(){
    return `
    <div class="card">

      ${JOURS.map(j=>`<div class="cmd-evrow"><div class="cmd-evhead"><span class="cmd-evtype">soirée</span><span class="num" style="font-size:12.5px;">${j.evt} · ${j.date} · ${MOIS_LABEL[j.mois]}</span><span class="cmd-evamt num" style="margin-left:auto;">${eur(j.total_ttc)}</span></div></div>`).join("")}

      <div class="kpi"><div class="v num" style="font-size:16px;">${Object.keys(state.moisClotures).slice(-1)[0] ? MOIS_LABEL[Object.keys(state.moisClotures).slice(-1)[0]] : "aucune"}</div><div class="l">Dernier mois clôturé</div></div>
      <div class="kpi"><div class="v num" style="font-size:16px;">${state.exerciceCloture ? "Exercice "+state.exerciceCloture.exercice : "aucune"}</div><div class="l">Dernier exercice clôturé</div></div>
    </div>
    <div class="card">

      <div class="hint">Possible seulement quand toutes les soirées du mois sont clôturées (module 10) — même esprit de verrou que le module 10.</div>
      ${moisPresents().map(m=>{
        const jours = joursDuMois(m);
        const grand = jours.reduce((s,j)=>s+j.total_ttc,0);
        const fait = state.moisClotures[m];
        const bloquePar = m==="2026-09" && !state.moisClotures["2026-08"];
        return `<div class="cmd-evrow" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <span style="font-weight:700;">${MOIS_LABEL[m]}</span>
          <span style="color:var(--muted);font-size:12px;">${jours.length} soirée(s) déjà clôturée(s) · grand total ${eur(grand)}</span>
          ${fait ? `<span class="chip ok" style="margin-left:auto;">✓ clôturé — perpétuel après : ${eur(fait.total_perpetuel_apres)}</span>`
                 : `<button class="cta ghost" data-mois="${m}" ${bloquePar?"disabled":""} style="margin-left:auto;">${bloquePar?"🔒 Clôturer août d'abord":"Clôturer "+MOIS_LABEL[m]}</button>`}

      <strong class="title">Clôture annuelle (exercice)</strong>

      ${state.exerciceCloture ? `<div class="infobox">✓ Exercice ${state.exerciceCloture.exercice} clôturé — grand total ${eur(state.exerciceCloture.grand_total)}, total perpétuel ${eur(state.exerciceCloture.total_perpetuel_apres)}.</div>`
        : `<button class="cta" id="vcaBtnExercice" ${tousLesMoisClotures()?"":"disabled"}>${tousLesMoisClotures()?"Clôturer l'exercice 2026":"🔒 Clôturer tous les mois d'abord"}</button>`}
    </div>
    <div class="card">
      <strong class="title">Journal chaîné (§15.27)</strong>
      <div class="hint">Empreinte SHA-256 réelle, calculée dans le navigateur, chaînée à l'empreinte précédente — même mécanisme que Ma caisse.</div>
      <button class="cta ghost" id="vcaVerifBtn" style="margin-bottom:10px;">🔍 Vérifier l'intégrité de la chaîne</button>
      ${state.integrite ? (state.integrite.premiereRompueId===null ? `<div class="infobox">✓ Chaîne intègre — ${state.chaine.length} événement(s) vérifié(s).</div>` : `<div class="alertbox">✗ Chaîne rompue à partir de l'événement n°${state.integrite.premiereRompueId+1}.</div>`) : ""}
      ${state.chaine.map((evt,i)=>{
        const L = evLabel(evt);
        const rompue = state.integrite && state.integrite.premiereRompueId!==null && i>=state.integrite.premiereRompueId;
        return `<div class="cmd-evrow ${rompue?'rompue':''}">
          <div class="cmd-evhead"><span class="cmd-evtype ${L.cls}">${evt.type}</span><span class="num" style="font-size:12px;">${L.titre}</span><span class="cmd-evamt num" style="margin-left:auto;">${L.montant}</span></div>
          <div class="cmd-evhash">préc. ${court(evt.empreinte_precedente)} → empreinte ${court(evt.empreinte)}</div>

      }).join("")}
    </div>`;
  }
  function wireClotures(){
    document.querySelectorAll("[data-mois]").forEach(b=>b.onclick=()=>cloturerMois(b.dataset.mois));
    const be = document.getElementById("vcaBtnExercice"); if(be) be.onclick = cloturerExercice;
    const vb = document.getElementById("vcaVerifBtn"); if(vb) vb.onclick = verifierIntegrite;
  }

  // §15.85 : les deux anciens onglets d'un seul module (« soirée » et « clôtures ») deviennent
  // deux écrans indépendants, dans deux sections de menu différentes (Dashboard → Ventes & CA,
  // Clôture & Pilotage → Clôtures mensuelle & annuelle) — chacun son conteneur de réaffichage,
  // plus de sélecteur d'onglet ni d'état `state.tab` partagé. Rien n'est recalculé ni dupliqué :
  // même `state`, mêmes fonctions de scellement/verrouillage qu'avant.
  function rerenderSoiree(){
    const el = document.getElementById("vcaSoireeBody");
    if(el){ el.innerHTML = renderSoiree(); wireSoiree(); }
  }
  function rerenderClotures(){
    const el = document.getElementById("vcaClotBody");
    if(el){ el.innerHTML = renderClotures(); wireClotures(); }
  }

  function markupSoiree(){ return `<div id="vcaSoireeBody">${renderSoiree()}</div>`; }
  function mountSoiree(){ wireSoiree(); }

  function markupClotures(){ return `<div id="vcaClotBody">${renderClotures()}</div>`; }
  function mountClotures(){ wireClotures(); seedJournal(); }

  return { markupSoiree, mountSoiree, markupClotures, mountClotures };
})();

  ];
  const REVENUS = {
    e1:{ "Bière":{c:5210,a:1180}, "Food":{c:4120,a:1030}, "Sucré":{c:1680,a:390}, "Boisson":{c:2240,a:530} },
    e2:{ "Bière":{c:6480,a:1460}, "Food":{c:5090,a:1280}, "Sucré":{c:2060,a:470}, "Boisson":{c:2760,a:660} },
    e3:{ "Bière":{c:5940,a:1340}, "Food":{c:4700,a:1180}, "Sucré":{c:1900,a:440}, "Boisson":{c:2540,a:600} },
  };
  const TVA_CAT = { "Bière":20, "Food":10, "Sucré":5.5, "Boisson":5.5 };
  const MATIERE = {
    e1:{ "Bière":1290, "Food":880, "Sucré":85, "Boisson":430 },
    e2:{ "Bière":1605, "Food":1092, "Sucré":104, "Boisson":530 },
    e3:{ "Bière":1470, "Food":1008, "Sucré":96, "Boisson":488 },
  };
  // §15.79 : chaque dépense « saisie » (auto:null) porte désormais une unité (unit:"eur"|"pct")
  // — à la demande de Rémi, une ligne de frais peut se saisir en € fixe ou en % du CA HT de la
  // soirée. "eur" par défaut = comportement inchangé pour les lignes déjà existantes.
  let DEPENSES = [
    {id:"d1", nom:"Achats matière",             auto:"matiere", actif:true},
    {id:"d2", nom:"Commission Break Eat",       auto:"commission", actif:true},
    {id:"d3", nom:"Frais de paiement",          auto:"stripe", actif:true},
    {id:"d4", nom:"Personnel de la soirée",     auto:"personnel", actif:true},
    {id:"d5", nom:"Consommables non revendus",  auto:null, actif:true, unit:"eur", v:{e1:145, e2:182, e3:168}},
    {id:"d6", nom:"Location de matériel",       auto:null, actif:true, unit:"eur", v:{e1:0, e2:320, e3:0}},
    {id:"d7", nom:"Nettoyage",                  auto:null, actif:true, unit:"eur", v:{e1:180, e2:180, e3:180}},
    {id:"d8", nom:"Fluides (eau, électricité)", auto:null, actif:false, unit:"eur", v:{e1:0,e2:0,e3:0}},
  ];
  // §15.79 : cible de marge nette de la soirée (% du CA HT) — vide par défaut (rien d'inventé).
  // Gabarit réutilisable (defaut) + réglage ponctuel par soirée (parEvt), sans tout ressaisir.
  const CIBLE_SOIREE = { defaut: null, parEvt: {} };
  const cibleEvt = eid => { const c = CIBLE_SOIREE.parEvt[eid]; return (c!==undefined && c!==null) ? c : CIBLE_SOIREE.defaut; };
  let PERSONNEL = {
    e1:[ {id:"p1", role:"Caissier", type:"salarié", nb:12, h:6.0, taux:17.40},
         {id:"p2", role:"Préparation / cuisine", type:"salarié", nb:6, h:7.0, taux:18.60},
         {id:"p3", role:"Responsable de stand", type:"salarié", nb:4, h:8.0, taux:22.80},
         {id:"p4", role:"Renfort ponctuel", type:"intérimaire", nb:6, h:5.0, taux:26.00} ],
    e2:[ {id:"p1", role:"Caissier", type:"salarié", nb:15, h:6.5, taux:17.40},
         {id:"p2", role:"Préparation / cuisine", type:"salarié", nb:8, h:7.5, taux:18.60},
         {id:"p3", role:"Responsable de stand", type:"salarié", nb:4, h:8.5, taux:22.80},
         {id:"p4", role:"Renfort ponctuel", type:"intérimaire", nb:9, h:5.5, taux:26.00} ],
    e3:[ {id:"p1", role:"Caissier", type:"salarié", nb:14, h:6.0, taux:17.40},
         {id:"p2", role:"Préparation / cuisine", type:"salarié", nb:7, h:7.0, taux:18.60},
         {id:"p3", role:"Responsable de stand", type:"salarié", nb:4, h:8.0, taux:22.80},
         {id:"p4", role:"Renfort ponctuel", type:"intérimaire", nb:7, h:5.0, taux:26.00} ],
  };
  const coutLigne = l => l.nb*l.h*l.taux;
  const persEvt = eid => (PERSONNEL[eid]||[]).reduce((a,l)=>a+coutLigne(l),0);

  // §15.64 — taux réels des Spartiates (SPARTIATES), pas les valeurs génériques de l'artifact
  // (qui utilisait par défaut k_tva=1,2 « répercutée »). SPARTIATES.kTva=1,0 (§15.35, récupérée).
  const kTva = () => SPARTIATES.kTva;
  const P = { commission: SPARTIATES.commissionPct*100, stripe: SPARTIATES.stripePct*100 };

  let sel = "e3", onglet = "revenus";
  const evts = () => sel==="all" ? EVENTS : EVENTS.filter(e=>e.id===sel);
  const CATS = Object.keys(TVA_CAT);

  // §15.79 : CA HT d'une seule soirée — nécessaire pour convertir une dépense saisie en % en
  // montant €, sans dupliquer le calcul de agr() (mêmes taux de TVA par catégorie).
  function htEvt(eid){
    return CATS.reduce((s,c)=>{ const t=TVA_CAT[c], u=1/(1+t/100);
      return s+(REVENUS[eid][c].c+REVENUS[eid][c].a)*u; }, 0);
  }
  function montantDep(d, eid){
    const v = (d.v && d.v[eid]) || 0;
    return d.unit==="pct" ? v/100*htEvt(eid) : v;
  }
  function agr(){
    const es = evts();
    let encC=0, encA=0, htC=0, htA=0, mat=0, com=0, str=0;
    const parCat = {};
    CATS.forEach(c=>{
      const t = TVA_CAT[c], u = 1/(1+t/100);
      let ec=0, ea=0, m=0;
      es.forEach(e=>{ ec += REVENUS[e.id][c].c; ea += REVENUS[e.id][c].a; m += MATIERE[e.id][c]; });
      const comCat = ea/(1+P.commission/100*kTva()) * P.commission/100*kTva();
      const strCat = ea*P.stripe/100;
      parCat[c] = { encC:ec, encA:ea, enc:ec+ea, ht:(ec+ea)*u, tva:(ec+ea)*(1-u), mat:m, com:comCat, str:strCat };
      encC+=ec; encA+=ea; htC+=ec*u; htA+=ea*u; mat+=m; com+=comCat; str+=strCat;
    });
    const comHt = com/kTva();
    const autres = DEPENSES.filter(d=>d.actif && !d.auto).reduce((a,d)=>a+es.reduce((s,e)=>s+montantDep(d,e.id),0), 0);
    const pers = es.reduce((a,e)=>a+persEvt(e.id), 0);
    const persSal = es.reduce((a,e)=>a+(PERSONNEL[e.id]||[]).filter(l=>l.type==="salarié").reduce((x,l)=>x+coutLigne(l),0),0);
    const persInt = pers - persSal;
    const enc = encC+encA, ht = htC+htA;
    const directs = mat+comHt+str+autres+pers;
    // §15.79 : cible de marge nette — uniquement affichable pour UNE soirée à la fois (une cible
    // « mélangée » sur plusieurs soirées n'aurait pas de sens sans pondération arbitraire).
    const cible = es.length===1 ? cibleEvt(es[0].id) : null;
    const margePct = ht>0 ? (ht-directs)/ht*100 : null;
    const ecartCible = (cible!==null && cible!==undefined && margePct!==null) ? margePct-cible : null;
    return {es, encC, encA, enc, ht, tva:enc-ht, mat, com, comHt, str, autres, pers, persSal, persInt, directs,
      brute: ht-mat, marge: ht-directs, margePct, cible, ecartCible, parCat,
      tickets: es.reduce((a,e)=>a+e.tickets,0), spect: es.reduce((a,e)=>a+e.spect,0)};
  }

  function renderBar(){
    return `<div class="pfield" style="max-width:360px;"><label>Période analysée</label>
      <select class="cell" id="finEvt" style="text-align:left;width:100%;">
        ${EVENTS.map(e=>`<option value="${e.id}" ${sel===e.id?"selected":""}>${e.lab} · ${e.adv}</option>`).join("")}
        <option value="all" ${sel==="all"?"selected":""}>Les ${EVENTS.length} soirées de la saison</option>
      </select></div>`;
  }
  // §15.79 — cible de marge nette de la soirée : gabarit réutilisable (defaut) + réglage
  // ponctuel par soirée (parEvt), affiché uniquement quand une seule soirée est sélectionnée.
  // §15.81 : cette carte n'est plus éditable ici — le réglage (gabarit + par soirée) s'est
  // déplacé dans Configuration → « Configuration cible & marge » (CfgCible, à la demande de
  // Rémi). Elle lit CIBLE_SOIREE en lecture seule, exactement la même donnée (même objet, pas
  // une copie) : rien n'est dupliqué, seul l'endroit où on la règle a changé.
  function renderCibleSoiree(){
    const d = CIBLE_SOIREE.defaut, ov = sel!=="all" ? CIBLE_SOIREE.parEvt[sel] : undefined;
    const effective = sel!=="all" ? cibleEvt(sel) : null;
    return `<div class="card" style="background:var(--violet-soft);border-color:var(--field-border);">
      <strong class="title" style="font-size:13px;">Cible de marge nette de la soirée <span class="chip grey">réglée dans Configuration §15.81</span></strong>
      <div class="hint">Gabarit par défaut : ${d===null?"aucun":pct1(d)}. ${sel!=="all" ? `Pour cette soirée (${EVENTS.find(e=>e.id===sel).adv}) : ${ov===undefined||ov===null?"hérite du gabarit → "+(effective===null?"aucune cible":pct1(effective)):"réglage propre → "+pct1(ov)}.` : "Sélectionne une seule soirée pour voir sa cible effective."} Pour modifier ces valeurs : Configuration → Configuration cible &amp; marge.</div>
    </div>`;
  }
  function renderPeriode(){
    const A = agr(), es = A.es;
    return `<div class="hint" style="margin:10px 0;">` + (es.length===1
      ? `<b>Soirée du ${dfr(es[0].date)} — ${es[0].adv}</b> · ${numFr(es[0].spect)} spectateurs · <b>${numFr(es[0].tickets)} tickets</b> encaissés · tous les montants ci-dessous portent sur cette seule soirée`
      : `<b>${es.length} soirées, du ${dfr(es[0].date)} au ${dfr(es[es.length-1].date)}</b> · ${numFr(A.spect)} spectateurs cumulés · <b>${numFr(A.tickets)} tickets</b> · ${es.map(e=>dfr(e.date)+" "+e.adv).join(" · ")}`) + `</div>`;
  }
  function renderKpis(){
    const A = agr();
    const parT = v => `${eur2(v/A.tickets)} par ticket`;
    const parS = v => `${eur2(v/A.spect)} par spectateur`;
    const per = A.es.length===1 ? `sur la soirée du ${dfr(A.es[0].date)}` : `sur ${A.es.length} soirées`;
    const cibleChip = A.ecartCible===null
      ? (A.cible===null||A.cible===undefined ? '<span class="chip grey">aucune cible</span>' : '')
      : `<span class="chip ${A.ecartCible>=0?'ok':A.ecartCible>=-5?'warn':'bad'}">${A.ecartCible>=0?"+":""}${pct1(A.ecartCible)} vs cible ${pct1(A.cible)}</span>`;
    const rows = [
      ["Encaissé TTC", eur0(A.enc), per, `${parT(A.enc)} · ${parS(A.enc)}`, "ce que les clients ont payé, TVA comprise"],
      ["Chiffre d'affaires HT", eur0(A.ht), per, `${parT(A.ht)} · ${parS(A.ht)}`, `l'encaissé moins ${eur0(A.tva)} de TVA collectée`],
      ["Marge brute", eur0(A.brute)+" · "+pct1(A.ht?A.brute/A.ht*100:0), per, `${parT(A.brute)} · ${parS(A.brute)}`, "CA HT moins le seul coût matière"],
      ["Marge nette de la soirée", eur0(A.marge)+" · "+pct1(A.ht?A.marge/A.ht*100:0)+(cibleChip?" "+cibleChip:""), per, `${parT(A.marge)} · ${parS(A.marge)}`, `après personnel (${eur0(A.pers)}), commission et frais — hors loyer et permanents`],
    ];
    return rows.map(([l,v,p,q,d])=>`<div class="kpi"><div class="l">${l} <span style="font-weight:500;">${p}</span></div><div class="v num">${v}</div><div class="s">${q}</div><div class="s">${d}</div></div>`).join("");
  }
  const ONGLETS = [["revenus","Revenus"],["depenses","Dépenses"],["tva","TVA"],["cats","Catégories"]];
  function renderTabs(){
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;">${ONGLETS.map(([k,l])=>`<button class="subtab ${onglet===k?'on':''}" data-fint="${k}">${l}</button>`).join("")}</div>`;
  }
  function renderPanel(){
    if(onglet==="depenses") return vueDepenses();
    if(onglet==="tva") return vueTva();
    if(onglet==="cats") return vueCats();
    return vueRevenus();
  }

  function vueRevenus(){
    const A = agr();
    const COL = {"Bière":"var(--violet)","Food":"var(--cc, #eb6834)","Sucré":"var(--amber)","Boisson":"var(--green)"};
    let h = `<div class="card"><strong class="title">Revenus par catégorie</strong>
      <div class="hint">Séparés par canal : comptoir et Click &amp; Collect. Les deux sont du chiffre d'affaires du lieu, mais le C&amp;C supporte en plus la commission et les frais de paiement — c'est pourquoi ils ne se confondent pas.</div>
      <div style="display:flex;height:11px;border-radius:999px;overflow:hidden;background:var(--track);margin-top:4px;">${CATS.map(c=>`<span style="display:block;height:100%;width:${A.enc?A.parCat[c].enc/A.enc*100:0}%;background:${COL[c]};" title="${c}"></span>`).join("")}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--muted);">
        ${CATS.map(c=>`<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${COL[c]};margin-right:4px;"></i>${c} ${pct1(A.enc?A.parCat[c].enc/A.enc*100:0)}</span>`).join("")}</div>
      <div style="overflow-x:auto;margin-top:14px;"><table><thead><tr>
        <th>Catégorie</th><th class="r">Comptoir TTC</th><th class="r">Click &amp; Collect TTC</th><th class="r">Total TTC</th>
        <th class="r">TVA</th><th class="r">CA HT</th><th class="r">Part</th></tr></thead><tbody>`;
    CATS.forEach(c=>{ const x=A.parCat[c];
      h += `<tr><td style="font-weight:600;">${c} <span class="chip grey">TVA ${pct1(TVA_CAT[c])}</span></td>
        <td class="r num">${eur0(x.encC)}</td>
        <td class="r num" style="color:var(--cc, #eb6834);">${eur0(x.encA)}</td>
        <td class="r num" style="font-weight:700;">${eur0(x.enc)}</td>

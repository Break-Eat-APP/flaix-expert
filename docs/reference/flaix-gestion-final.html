        <td class="r num" style="color:var(--muted);">${pct1(A.enc?x.enc/A.enc*100:0)}</td></tr>`; });
    h += `</tbody><tfoot><tr><td>Total</td><td class="r num">${eur0(A.encC)}</td>
      <td class="r num">${eur0(A.encA)}</td><td class="r num">${eur0(A.enc)}</td>
      <td class="r num">${eur0(A.tva)}</td><td class="r num">${eur0(A.ht)}</td><td class="r num">100,0 %</td></tr></tfoot></table></div>
      <div style="background:var(--violet-soft);border:1px solid var(--field-border);border-radius:10px;padding:10px 12px;font-size:12px;margin-top:10px;">Le Click &amp; Collect représente <b>${pct1(A.enc?A.encA/A.enc*100:0)}</b> de l'encaissé sur cette période. C'est la part sur laquelle s'appliquent la commission et les frais de paiement — la voir isolément permet de savoir ce que le canal coûte réellement.</div></div>`;
    return h;
  }

  function vueDepenses(){
    const A = agr(), es = A.es;
    const val = d => d.auto==="matiere" ? A.mat : d.auto==="commission" ? A.comHt : d.auto==="stripe" ? A.str
                 : d.auto==="personnel" ? A.pers : es.reduce((s,e)=>s+montantDep(d,e.id),0);
    const actives = DEPENSES.filter(d=>d.actif);
    let h = `<div class="card"><strong class="title">Dépenses directes de la période</strong>
      <div class="hint">Uniquement ce qui se rattache sans ambiguïté à ces soirées. Les lignes marquées « calculée » viennent des autres modules et ne se saisissent pas ici — les modifier à la main ferait diverger deux chiffres qui doivent être identiques. Les charges de structure (loyer, permanents, assurance) ne sont pas traitées pour l'instant (décision assumée du 11/09, reprise de l'artifact source). <span class="chip vio">§15.79</span> une dépense saisie se règle en € fixe ou en % du CA HT de la soirée.</div>
      <div style="overflow-x:auto;"><table><thead><tr>
        <th>Catégorie</th><th>Origine</th><th class="r">Montant HT</th><th class="r">Part des dépenses</th><th class="r">Par ticket</th></tr></thead><tbody>`;
    actives.forEach(d=>{ const v = val(d);
      h += `<tr><td style="font-weight:600;">${d.nom}</td>
        <td>${d.auto?`<span class="chip vio">calculée</span> <span style="font-size:11px;color:var(--muted);">${d.auto==="matiere"?"module Stock, au CUMP":d.auto==="commission"?"SPARTIATES.commissionPct/kTva, HT déductible":d.auto==="personnel"?"détail ci-dessous":"relevé du prestataire"}</span>`
          :`<span class="chip grey">saisie</span>`}</td>
        <td class="r">${d.auto?`<span class="num" style="font-weight:700;">${eur0(v)}</span>`
          :`<div style="display:flex;gap:4px;align-items:center;justify-content:flex-end;">
              <input class="cell sm" type="number" step="${d.unit==='pct'?'1':'10'}" min="0" data-fdep="${d.id}" value="${es.length===1?(d.v[es[0].id]||0):''}" placeholder="${es.length>1?'—':''}" ${es.length>1?"disabled title=\"Saisie possible soirée par soirée\"":""}>
              <select class="cell sm" style="width:56px;" data-fdepunit="${d.id}" ${es.length>1?"disabled":""}>
                <option value="eur" ${d.unit!=="pct"?"selected":""}>€</option>
                <option value="pct" ${d.unit==="pct"?"selected":""}>%</option>
              </select>
            </div>${es.length===1 && d.unit==="pct" ? `<div class="hint" style="margin:2px 0 0;text-align:right;">= ${eur0(v)}</div>`:""}`}</td>
        <td class="r num" style="color:var(--muted);">${pct1(A.directs?v/A.directs*100:0)}</td>
        <td class="r num" style="color:var(--muted);">${eur2(v/A.tickets)}</td></tr>`; });
    h += `</tbody><tfoot><tr><td colspan="2">Total des dépenses directes</td>
      <td class="r num" id="finTotDep">${eur0(A.directs)}</td><td class="r num">100,0 %</td>
      <td class="r num" id="finTotDepT">${eur2(A.directs/A.tickets)}</td></tr></tfoot></table></div>

      <div style="margin-top:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <strong class="title" style="margin:0;">Personnel de la soirée</strong>
        <span class="chip vio">calculée</span>
      </div>
      <div class="hint">Cette ligne n'est plus saisie ici : elle vient du planning nominatif du module Personnel, où chaque employé est affecté à une soirée et un stand avec ses heures. Le taux qui compte est un coût horaire chargé pour un salarié et le taux facturé par l'agence pour un intérimaire.</div>
      ${es.length>1 ? `<div style="background:var(--violet-soft);border:1px solid var(--field-border);border-radius:10px;padding:10px 12px;font-size:12px;">Le détail du personnel se lit soirée par soirée. Sur plusieurs soirées, seul le total est affiché : ${eur0(A.pers)}.</div>`
      : `<div style="overflow-x:auto;"><table><thead><tr><th>Rôle</th><th>Statut</th><th class="r">Personnes</th><th class="r">Heures</th><th class="r">Coût horaire</th><th class="r">Coût total</th></tr></thead><tbody>
        ${(PERSONNEL[es[0].id]||[]).map(l=>`<tr>
          <td style="font-weight:600;">${l.role}</td>
          <td>${l.type==="intérimaire"?'<span class="chip">intérimaire</span>':'<span class="chip grey">salarié</span>'}</td>
          <td class="r num">${l.nb}</td>
          <td class="r num">${l.h.toLocaleString("fr-FR",{maximumFractionDigits:1})}</td>
          <td class="r num">${eur2(l.taux)}</td>
          <td class="r num" style="font-weight:700;">${eur0(coutLigne(l))}</td></tr>`).join("")}
        </tbody><tfoot><tr><td colspan="5">Total personnel de la soirée
          <span style="font-weight:400;color:var(--muted);">— dont ${eur0(A.persSal)} de salariés et ${eur0(A.persInt)} d'intérimaires</span></td>
          <td class="r num" id="finPersTot">${eur0(A.pers)}</td></tr></tfoot></table></div>
        <div class="alertbox" style="margin-top:10px;">Chiffre encore approximatif. Le planning nominatif du module Personnel n'est pas encore intégralement saisi pour cette soirée : ce total reste, pour l'instant, une estimation par rôle plutôt que la somme exacte des affectations.</div>`}

      <div style="margin-top:20px;font-weight:700;font-size:13px;">Du chiffre d'affaires à ce qu'il reste</div>
      <div class="wf" style="margin-top:8px;max-width:560px;">${cascade(A)}</div>
      <div class="alertbox">Le loyer, l'électricité, les salaires permanents et l'assurance ne sont pas comptés ici : ce sont des charges mensuelles ou annuelles, et les rattacher à un match demanderait une clé de répartition qu'on n'a pas tranchée. La marge nette ci-dessus est donc celle de la soirée, pas le bénéfice final du lieu.</div></div>`;
    return h;
  }
  function cascade(A){
    const L = [
      ["Chiffre d'affaires HT", A.ht, false, false],
      ["− Achats matière", -A.mat, true, false],
      ["Marge brute", A.brute, false, true],
      ["− Personnel de la soirée", -A.pers, true, false],
      ["− Commission Break Eat (HT)", -A.comHt, true, false],
      ["− Frais de paiement", -A.str, true, false],
      ["− Autres dépenses de la soirée", -A.autres, true, false],
      ["Marge nette de la soirée", A.marge, false, true],
    ];
    return L.map(([l,v,neg,tot])=>tot
      ? `<div class="l tot"><span>${l}</span><span class="num" style="color:${v>=0?'var(--green)':'var(--red)'};">${eur0(v)} <span style="font-weight:600;color:var(--muted);font-size:12px;">${pct1(A.ht?v/A.ht*100:0)}</span></span></div>`
      : `<div class="l"><span ${neg?'style="color:var(--red);"':''}>${l}</span><span class="num" ${neg?'style="color:var(--red);"':''}>${eur0(v)}</span></div>`
    ).join("");
  }
  function wireDep(){
    document.querySelectorAll("input[data-fdep]").forEach(i=>{
      i.oninput = e => {
        const d = DEPENSES.find(x=>x.id===e.target.dataset.fdep);
        if(sel==="all") return;
        d.v[sel] = Math.max(0, parseFloat(e.target.value)||0);
        const A = agr();
        const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
        set("finTotDep", eur0(A.directs)); set("finTotDepT", eur2(A.directs/A.tickets));
        const k=document.getElementById("finKpis"); if(k) k.innerHTML = renderKpis();
      };
    });
    // §15.79 : changer l'unité (€/%) change le sens du nombre déjà saisi — on réaffiche tout le
    // panneau plutôt que de patcher en place, pour ne jamais laisser une valeur ambiguë à l'écran.
    document.querySelectorAll("select[data-fdepunit]").forEach(s=>{
      s.onchange = e => {
        const d = DEPENSES.find(x=>x.id===e.target.dataset.fdepunit);
        d.unit = e.target.value;
        if(sel!=="all") d.v[sel] = 0;
        const p=document.getElementById("finPanel"); if(p){ p.innerHTML = renderPanel(); wirePanel(); }
        const k=document.getElementById("finKpis"); if(k) k.innerHTML = renderKpis();
      };
    });
  }

  function vueTva(){
    const A = agr();
    const taux = [...new Set(CATS.map(c=>TVA_CAT[c]))].sort((a,b)=>a-b);
    const tvaDeduct = A.com - A.comHt;
    let h = `<div class="card"><strong class="title">TVA de la période</strong>
      <div class="hint">La TVA collectée n'a jamais appartenu au lieu : elle est encaissée pour le compte de l'État et reversée. Ce qui est déductible vient des factures reçues — ici la commission Break Eat. Les frais de paiement sont exonérés de TVA. Le coût matière n'apparaît pas ici tant que les factures fournisseur ne sont pas rapprochées dans le module Stock.</div>
      <div style="overflow-x:auto;"><table><thead><tr><th>Taux</th><th>Catégories concernées</th>
        <th class="r">Base HT</th><th class="r">TVA collectée</th></tr></thead><tbody>`;
    taux.forEach(t=>{
      const cs = CATS.filter(c=>TVA_CAT[c]===t);
      const ht = cs.reduce((a,c)=>a+A.parCat[c].ht,0);
      const tv = cs.reduce((a,c)=>a+A.parCat[c].tva,0);
      h += `<tr><td style="font-weight:700;">${pct1(t)}</td><td style="color:var(--muted);">${cs.join(", ")}</td>
        <td class="r num">${eur0(ht)}</td><td class="r num" style="font-weight:700;">${eur0(tv)}</td></tr>`;
    });
    h += `</tbody><tfoot><tr><td colspan="2">Total collecté</td><td class="r num">${eur0(A.ht)}</td>
      <td class="r num">${eur0(A.tva)}</td></tr></tfoot></table></div>
      <div class="wf" style="margin-top:16px;max-width:520px;">
        <div class="l"><span>TVA collectée sur les ventes</span><span class="num">${eur0(A.tva)}</span></div>
        <div class="l"><span style="color:var(--green);">− TVA déductible sur la commission Break Eat</span><span class="num" style="color:var(--green);">−${eur2(tvaDeduct)}</span></div>
        <div class="l tot"><span>TVA à reverser, sur cette période</span><span class="num">${eur0(A.tva-tvaDeduct)}</span></div>
      </div>
      <div class="alertbox">Chiffre partiel : il ne tient pas compte de la TVA déductible sur les achats fournisseur, ni des autres dépenses du lieu. Ce n'est pas une déclaration de TVA — c'est la contribution de cette période à la déclaration, à remettre à l'expert-comptable avec le reste.</div></div>`;
    return h;
  }

  function vueCats(){
    return `<div class="card"><strong class="title">Catégories de dépenses</strong>
      <div class="hint">FlaiX Expert fournit une liste de départ ; tu la renommes, tu en ajoutes, tu en désactives. Les catégories marquées « calculée » ne peuvent être ni supprimées ni renommées librement : elles sont reliées à un autre module et le lien se casserait.</div>
      <div style="overflow-x:auto;"><table><thead><tr><th>Nom</th><th>Origine</th><th>État</th><th></th></tr></thead><tbody>
      ${DEPENSES.map(d=>`<tr style="${d.actif?"":"opacity:.45;"}">
        <td>${d.auto?`<b>${d.nom}</b>`:`<input class="cell txt" type="text" data-fnom="${d.id}" value="${d.nom}" style="text-align:left;">`}</td>
        <td>${d.auto?'<span class="chip vio">calculée</span>':'<span class="chip grey">saisie</span>'}</td>
        <td>${d.actif?'<span class="chip ok">active</span>':'<span class="chip grey">désactivée</span>'}</td>
        <td class="r">${d.auto?'<span style="font-size:11px;color:var(--muted);">non modifiable</span>'
          :`<button class="cta ghost" style="padding:4px 9px;font-size:11.5px;" data-ftog="${d.id}">${d.actif?"Désactiver":"Réactiver"}</button>`}</td></tr>`).join("")}
      </tbody></table></div>
      <div style="margin-top:12px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
        <div class="pfield"><label>Nouvelle catégorie</label><input class="cell txt" type="text" id="finNewCat" placeholder="Ex. Sécurité, Gobelets consignés…" style="text-align:left;"></div>
        <button class="cta ghost" id="finAddCat">Ajouter</button>
      </div>
      <div style="background:var(--violet-soft);border:1px solid var(--field-border);border-radius:10px;padding:10px 12px;font-size:12px;margin-top:10px;">Une catégorie désactivée n'est pas supprimée : les montants déjà saisis sur les soirées passées restent. Supprimer une catégorie réécrirait l'historique — on désactive, on n'efface pas.</div></div>`;
  }
  function wireCats(){
    document.querySelectorAll("input[data-fnom]").forEach(i=>{
      i.oninput = e => { DEPENSES.find(x=>x.id===e.target.dataset.fnom).nom = e.target.value; };
    });
    document.querySelectorAll("[data-ftog]").forEach(b=>{
      b.onclick = () => { const d=DEPENSES.find(x=>x.id===b.dataset.ftog); d.actif=!d.actif;
        const p=document.getElementById("finPanel"); if(p){ p.innerHTML = renderPanel(); wirePanel(); }
        const k=document.getElementById("finKpis"); if(k) k.innerHTML = renderKpis();
        toast(`${d.nom} ${d.actif?"réactivée":"désactivée"} — les montants passés sont conservés`); };
    });
    const a=document.getElementById("finAddCat");
    if(a) a.onclick = ()=>{
      const n=document.getElementById("finNewCat").value.trim();
      if(n.length<2){ toast("Donne un nom à la catégorie"); return; }
      DEPENSES.push({id:"d"+(DEPENSES.length+1), nom:n, auto:null, actif:true, v:{e1:0,e2:0,e3:0}});
      const p=document.getElementById("finPanel"); if(p){ p.innerHTML = renderPanel(); wirePanel(); }
      toast(`Catégorie « ${n} » ajoutée`);
    };
  }

  function rulesHtml(){
    const A = agr();
    return `
      <p><b>Chaque chiffre dit sur quoi il porte.</b> Tous les montants de cet écran couvrent la période choisie dans le sélecteur, et chaque KPI donne en plus sa valeur par ticket et par spectateur.</p>
      <p><b>Encaissé TTC</b> = ce que les clients ont payé. <b>CA HT</b> = l'encaissé moins la TVA collectée, que le lieu reverse à l'État.</p>
      <p><b>Deux niveaux de marge.</b> La marge brute = CA HT − coût matière : comparable au module Marges &amp; ratios. La marge nette de la soirée retire en plus le personnel de la soirée, la commission et les frais de paiement.</p>
      <p><b>Personnel de la soirée</b> : coût direct, au même titre que la matière. Taux = coût horaire chargé pour un salarié (brut + charges patronales), taux facturé par l'agence pour un intérimaire.</p>
      <p><b>Ce que la marge nette ne couvre pas encore</b> : loyer, électricité, salaires permanents, assurance, amortissement — charges mensuelles/annuelles non rattachées à une soirée (décision assumée du 11/09, reprise de l'artifact source, à rouvrir plus tard).</p>
      <p><b>Les dépenses calculées ne se saisissent pas ici</b> : coût matière (CUMP du module Stock), commission (<code>SPARTIATES.commissionPct</code> × <code>SPARTIATES.kTva</code> — réglage réel des Spartiates, k_tva = 1,0 récupérée, §15.35), frais de paiement (<code>SPARTIATES.stripePct</code>). Les rendre modifiables à la main ferait diverger deux chiffres qui doivent être identiques.</p>
      <p><b>La commission est comptée hors taxes</b> — pour Les Spartiates, k_tva = 1,0 signifie que la TVA sur commission est intégralement récupérée par le lieu (§15.35), donc <code>commission_HT = commission_TTC</code> ici, contrairement à un lieu réglé en k_tva = 1,2.</p>
      <p><b>Comptoir et Click &amp; Collect restent séparés</b> dans les revenus : seul le second supporte la commission et les frais de paiement. Sur cette période, le C&amp;C pèse ${pct1(A.enc?A.encA/A.enc*100:0)} de l'encaissé.</p>
      <p><b>L'onglet TVA n'est pas une déclaration</b> : il manque la TVA déductible sur les achats fournisseur et les autres dépenses du lieu — à remettre à l'expert-comptable avec le reste.</p>
      <p><b>Une catégorie se désactive, elle ne se supprime pas</b> : les montants saisis sur les soirées passées restent lisibles.</p>
      <p><b>Jeu de test</b> : les 3 soirées (Toulon/Grenoble/Bayonne), les revenus par catégorie, le coût matière et le planning personnel sont repris tels quels de l'artifact officiel « Gestion financière » (aucun chiffre réel), déjà utilisés ailleurs (Ventes &amp; CA §15.27, Conformité §15.61) — seuls les taux de commission/Stripe/k_tva viennent de la fiche réelle des Spartiates.</p>
      <p><b>Cible de marge nette de la soirée</b> <span class="chip vio">ajouté §15.79</span> : vide par défaut — un gabarit par défaut s'applique à toute soirée sans réglage propre, ajustable ponctuellement soirée par soirée. Affichée uniquement quand une seule soirée est sélectionnée (pas de cible « mélangée » sur plusieurs soirées). <b>Se règle désormais dans Configuration → Configuration cible &amp; marge</b> <span class="chip grey">déplacé §15.81</span> — cet écran ne fait qu'en lire le résultat, la même donnée, sans la dupliquer.</p>
      <p><b>Une dépense saisie se règle en € fixe ou en % du CA HT de la soirée</b> <span class="chip vio">ajouté §15.79</span> : changer l'unité remet le montant à zéro pour éviter de confondre un nombre saisi en euros avec le même nombre relu comme un pourcentage.</p>`;
  }

  function markup(){
    return `
    ${renderBar()}
    ${renderPeriode()}
    ${renderCibleSoiree()}
    <div class="kpis" id="finKpis">${renderKpis()}</div>
    ${renderTabs()}
    <div id="finPanel">${renderPanel()}</div>
    ${rulesBlock("gestion","comment ces chiffres sont calculés (Gestion financière)", rulesHtml())}
    `;
  }
  function wirePanel(){
    if(onglet==="depenses") wireDep();
    else if(onglet==="cats") wireCats();
  }
  function mount(){
    const fe=document.getElementById("finEvt");
    if(fe) fe.onchange = e => { sel=e.target.value; renderAll(); };
    document.querySelectorAll("[data-fint]").forEach(b=>{
      b.onclick = () => { onglet=b.dataset.fint;
        const p=document.getElementById("finPanel"); if(p) p.innerHTML=renderPanel();
        document.querySelectorAll("[data-fint]").forEach(x=>x.classList.toggle("on", x.dataset.fint===onglet));
        wirePanel(); };
    });
    wirePanel();
    wireRules();
  }
  function renderAll(){
    const host = document.getElementById("finRoot");
    if(host){ host.innerHTML = markup(); mount(); }
  }
  // §15.81 : CIBLE_SOIREE et EVENTS exposés en lecture/écriture directe (même objet/tableau,
  // pas une copie) pour que l'écran de réglage déplacé dans Configuration (CfgCible, plus bas)
  // lise et écrive la même cible que celle que ce module compare dans ses KPI — une seule
  // source de vérité, aucun second calcul de « marge de la soirée » ailleurs.
  return { markup, mount, cibleSoiree: CIBLE_SOIREE, cibleEvents: EVENTS };
})();

/* ------------------------------------------------------------
   Configuration cible & marge (§15.81) — écran de RÉGLAGE seul, déplacé
   depuis Gestion financière vers Configuration à la demande de Rémi.
   Ne lit ni n'affiche aucun réalisé (Revenus/KPIs/écart, qui restent
   visibles dans Dashboard → Gestion financière) : lit et écrit
   directement Fin.cibleSoiree (même objet, §15.79 — gabarit par défaut
   + réglage par soirée), sans dupliquer le calcul de la marge nette.
   ------------------------------------------------------------ */
const CfgCible = (function(){
  function markup(){
    const C = Fin.cibleSoiree, evts = Fin.cibleEvents;
    return `
    <div class="card">
      <strong class="title">Cible de marge nette de la soirée <span class="chip vio">déplacé ici §15.81</span></strong>
      <div class="hint">Cible en % du CA HT de la soirée, une fois <b>tous les frais de la soirée</b> déduits — matière, personnel, commission Break Eat, frais de paiement, et toute dépense nommée librement (€ ou %, réglable dans Dashboard → Gestion financière → onglet Catégories). Vide par défaut, rien n'est inventé. Le résultat comparé (réalisé vs cette cible) s'affiche dans <b>Dashboard → Gestion financière</b>, qui lit cette même valeur — rien n'est recalculé deux fois.</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;">
        <div class="pfield" style="width:200px;"><label>Gabarit par défaut</label><input class="cell" type="number" step="1" min="0" max="100" id="cfgCibleDef" value="${C.defaut===null?"":C.defaut}" placeholder="—"><span class="u">% du CA HT</span></div>
      </div>
    </div>
    <div class="card">
      <strong class="title">Réglage par soirée (facultatif)</strong>
      <div class="hint">Remplace le gabarit pour une soirée précise. Champ vide = cette soirée hérite du gabarit ci-dessus.</div>
      <div style="overflow-x:auto;"><table><tr><th>Soirée</th><th class="r">Cible propre à cette soirée</th></tr>
      ${evts.map(e=>`<tr><td>${e.lab} · ${e.adv}</td><td class="r"><input class="cell" style="width:100px;" type="number" step="1" min="0" max="100" data-cibleevt="${e.id}" value="${(C.parEvt[e.id]===undefined||C.parEvt[e.id]===null)?"":C.parEvt[e.id]}" placeholder="— (gabarit)"></td></tr>`).join("")}
      </table></div>
    </div>
    ${rulesBlock("config-cible","comment cette cible est utilisée (Configuration cible & marge)", `
      <b>Cet écran ne fait que régler la cible</b> — il n'affiche ni le réalisé ni l'écart, qui restent dans Dashboard → Gestion financière (module 11), seul endroit qui calcule la marge nette de la soirée (matière, personnel lu du planning, commission, frais de paiement, dépenses nommées €/%).<br><br>
      <b>Gabarit par défaut</b> : s'applique à toute soirée sans réglage propre. <b>Réglage par soirée</b> : remplace le gabarit pour une soirée précise, sans avoir à tout ressaisir.<br><br>
      <b>Une seule donnée, deux écrans</b> : ce module lit et écrit directement la même valeur que celle que Gestion financière compare au réalisé — déplacer le réglage ici (§15.81) n'a pas dupliqué le calcul.
    `)}`;
  }
  function mount(){
    const fd = document.getElementById("cfgCibleDef");
    if(fd) fd.oninput = e=>{
      const v = e.target.value.trim();
      Fin.cibleSoiree.defaut = v===""?null:Math.max(0,Math.min(100,parseFloat(v)||0));
    };
    document.querySelectorAll("[data-cibleevt]").forEach(inp=>{
      inp.oninput = e=>{
        const v = e.target.value.trim();
        Fin.cibleSoiree.parEvt[e.target.dataset.cibleevt] = v===""?null:Math.max(0,Math.min(100,parseFloat(v)||0));
      };
    });
    wireRules();
  }
  return { markup, mount };
})();

}

window["wire_cloture-pilotage"] = function(){ mountModulePane("cloture-pilotage", CLOTURE_PILOTAGE_PANES); };

/* ============================================================
   SECTION 1 — Commande & Journal
   Modules fusionnés : 1 (Commande, clos et validé par Rémi le
   2026-09-12, §15.26), 3 (Journal / Tickets).
   Intégration FIDÈLE du prototype validé prototype-commande.html :
   même moteur (ouverture/clôture de caisse, panier par stand, remise
   pourcentage + offert en montant avec motif obligatoire, tarif
   abonné à 15 %, paiement espèces avec rendu monnaie ou CB, chaque
   vente scellée par un vrai calcul SHA-256 chaîné à l'empreinte
   précédente, journal avec vérification d'intégrité, test de
   falsification, mode dégradé réseau avec file locale et
   réparation) — rien n'est résumé, seules les données de test du
   prototype isolé (Buvette Nord/Sud fictives) sont remplacées par
   les données réelles des Spartiates (4 stands, 9 caisses).
   ============================================================ */
const Cmd = (function(){
  const GENESE = "0".repeat(64);
  // Taux abonné réel communiqué par Rémi le 2026-09-12 (§15.26 point 1) — 15 %, taux du lieu, pas négociable par le caissier.
  const TAUX_ABONNE = 0.15;
  const CAT_LABEL = { boisson:"Boissons", sucre:"Sucré", food:"Food", biere:"Bière" };
  const MOTIFS = [
    { code:"abonne", label:"Abonné",           need:"ref", refLab:"N° d'abonné ou de carte" },
    { code:"staff",  label:"Staff",            need:null },
    { code:"geste",  label:"Geste commercial", need:null },
    { code:"remb",   label:"Remboursement",    need:null },
    { code:"client", label:"Client mécontent", need:null },
    { code:"autre",  label:"Autre",            need:"txt" },
  ];
  const motifDe = c => MOTIFS.find(m=>m.code===c);

  async function sha256Hex(str){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  function court(h){ return h ? h.slice(0,10)+"…"+h.slice(-6) : "—"; }
  function serialiser(evtSansEmpreinte){
    const { empreinte, _id, ...champs } = evtSansEmpreinte;
    return JSON.stringify(champs);
  }
  function horodatageMinute(d){
    const p = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  const state = {
    tab:"caisse",
    standId: SPARTIATES.stands[0].id,
    caisse: SPARTIATES.stands[0].caisses[0],
    cat:null, cart:{}, remise:0, offert:0, motif:null, motifTxt:"", motifRef:"",
    pay:null, donne:0, flashId:null,
    ouverte:false, fondSaisi:"", operateurSaisi:"", operateur:null, fond:null,
    dernierNumero:0, chaine:[], fileLocale:[], horsLigne:false, lotRejete:false, integrite:null,
  };

  function codeCaisse(){ return "C"+state.caisse; }
  function standActuel(){ return SPARTIATES.stands.find(s=>s.id===state.standId); }
  function productsForStand(){ return SPARTIATES.catalogue.filter(p=>p.stand===state.standId); }
  function catsForStand(){ return [...new Set(productsForStand().map(p=>p.tva))]; }
  // Hypothèse "certaines caisses 100 % CB" (§15.26 pt.2, « la patinoire ») jamais confirmée comme étant
  // Les Spartiates — toutes les caisses sont donc traitées ici comme espèces + CB par défaut.
  function accepteEspeces(){ return true; }

  function derniereEmpreinteConfirmee(){ return state.chaine.length ? state.chaine[state.chaine.length-1].empreinte : GENESE; }
  function derniereEmpreinteConnue(){ return state.fileLocale.length ? state.fileLocale[state.fileLocale.length-1].empreinte : derniereEmpreinteConfirmee(); }
  async function sceller(evtSansEmpreinte, empreintePrecedente){
    const avecPrec = { ...evtSansEmpreinte, empreinte_precedente: empreintePrecedente };
    const empreinte = await sha256Hex(serialiser(avecPrec));
    return { ...avecPrec, empreinte };
  }

  function lines(){ return Object.entries(state.cart).map(([id,q])=>({ p: SPARTIATES.catalogue.find(x=>x.stand===state.standId && x.produit===id), q })); }
  function brut(){ return lines().reduce((s,l)=>s+l.p.prix*l.q,0); }
  function remiseVal(){ return brut()*state.remise; }
  function total(){ return Math.max(0, brut() - remiseVal() - (state.offert||0)); }
  function count(){ return lines().reduce((s,l)=>s+l.q,0); }
  function needsMotif(){ return state.remise>0 || (state.offert||0)>0; }
  function motifOk(){
    if(!needsMotif()) return true;
    if(!state.motif) return false;
    const m = motifDe(state.motif);
    if(m && m.need==="txt") return state.motifTxt.trim().length>0;
    if(m && m.need==="ref") return state.motifRef.trim().length>0;
    return true;
  }
  function gateOk(){ return state.operateurSaisi.trim() && (!accepteEspeces() || state.fondSaisi!==""); }

  const $ = id => document.getElementById(id);

  function mount(){
    if(!state.operateurSaisi) state.operateurSaisi = SPARTIATES.caissiers[state.caisse] || "";
    renderGate();
  }

  function renderGate(){
    if(!$("cmdGateZone")) return;
    if(state.ouverte){ $("cmdGateZone").style.display="none"; $("cmdAppZone").style.display="block"; renderTopbar(); renderAll(); return; }
    $("cmdAppZone").style.display="none";
    $("cmdGateZone").style.display="block";
    const esp = accepteEspeces();
    $("cmdGateZone").innerHTML = `
      <div class="cmd-gate">
        <h3>Ouverture de caisse</h3>
        <p>${codeCaisse()} · ${standActuel().nom} — obligatoire avant le premier encaissement (§15.4). Crée l'événement <code>ouverture_caisse</code>, borne de début de la chaîne.</p>
        <label>Stand</label>
        <select id="cmdGStand">${SPARTIATES.stands.map(s=>`<option value="${s.id}" ${s.id===state.standId?"selected":""}>${s.nom}</option>`).join("")}</select>
        <label>Caisse</label>
        <select id="cmdGCaisse"></select>
        <label>Opérateur</label>
        <input id="cmdGOperateur" value="${state.operateurSaisi}" placeholder="Nom de l'opérateur"/>
        ${esp ? `<label>Fond de caisse déclaré</label><input id="cmdGFond" type="number" step="1" min="0" value="${state.fondSaisi}" placeholder="0,00 €"/>` : ""}
        <button class="cta cmd-encaisser" id="cmdGBtn" ${gateOk()?"":"disabled"}>Ouvrir la caisse</button>
        <div class="hint" style="margin-top:12px;text-align:left;">⚠ Caisses 100&nbsp;% CB sans fond de caisse : hypothèse évoquée le 12/09 (« la patinoire », §15.26 pt.2) mais jamais confirmée comme étant Les Spartiates — toutes les caisses sont donc traitées ici comme espèces + CB, à corriger si Rémi confirme le contraire.</div>
      </div>`;
    function refreshCaisses(){
      const s = SPARTIATES.stands.find(x=>x.id===$("cmdGStand").value);
      $("cmdGCaisse").innerHTML = s.caisses.map(c=>`<option value="${c}" ${c===state.caisse?"selected":""}>Caisse ${c} — ${SPARTIATES.caissiers[c]}</option>`).join("");
    }
    refreshCaisses();
    $("cmdGStand").onchange = () => { state.standId=$("cmdGStand").value; state.caisse=SPARTIATES.stands.find(s=>s.id===state.standId).caisses[0]; state.fondSaisi=""; refreshCaisses(); majGateBtn(); };
    $("cmdGCaisse").onchange = () => { state.caisse=parseInt($("cmdGCaisse").value,10); state.operateurSaisi=SPARTIATES.caissiers[state.caisse]||state.operateurSaisi; renderGate(); };
    $("cmdGOperateur").oninput = e => { state.operateurSaisi=e.target.value; majGateBtn(); };
    const gf = $("cmdGFond");
    if(gf) gf.oninput = e => { state.fondSaisi=e.target.value; majGateBtn(); };
    $("cmdGBtn").onclick = async () => {
      if(!gateOk()) return;
      state.operateur = state.operateurSaisi.trim();
      state.fond = accepteEspeces() ? (parseFloat(state.fondSaisi)||0) : 0;
      const evt = { type:"ouverture_caisse", caisse_id:codeCaisse(), stand_id:state.standId, operateur_id:state.operateur, horodatage:horodatageMinute(new Date()), fond_declare:state.fond, especes_autorisees:accepteEspeces() };
      const scelle = await sceller(evt, derniereEmpreinteConfirmee());
      state.chaine.push(scelle);
      state.ouverte = true;
      renderGate();
    };
  }
  function majGateBtn(){ const b=$("cmdGBtn"); if(b) b.disabled = !gateOk(); }

  function renderTopbar(){
    if(!$("cmdStandLabel")) return;
    $("cmdStandLabel").textContent = standActuel().nom;
    $("cmdCaisseNote").textContent = `Caisse ${state.caisse} · opérateur ${state.operateur||"—"} · ${accepteEspeces() ? "fond "+eur(state.fond) : "CB uniquement"}`;
    const badge = $("cmdConfBadge");
    if(state.horsLigne){ badge.className="conf off"; badge.textContent="🔌 Hors ligne (simulation)"; }
    else if(state.fileLocale.length){ badge.className="conf off"; badge.textContent=state.fileLocale.length+" en file, non raccordé"; }
    else { badge.className="conf on"; badge.textContent="Chaîne à jour"; }
  }

  function renderCaisse(){
    if(state.tab!=="caisse" || !$("cmdCaisseView")) return;
    const cats = catsForStand();
    if(!state.cat || !cats.includes(state.cat)) state.cat = cats[0];
    $("cmdCaisseView").innerHTML = `
      <div class="cmd-layout">
        <div>
          <div class="cmd-cats" id="cmdCats"></div>
          <div class="cmd-pgrid" id="cmdGrid"></div>
        </div>
        <div class="cmd-ticket">
          <div class="cmd-thead"><strong>Ticket</strong><span class="cmd-tcount" id="cmdTcount">0 art.</span></div>
          <div id="cmdLines"></div>
          <div class="cmd-blocklabel">Remise au paiement</div>
          <div class="cmd-pillrow" id="cmdRemisePills"></div>
          <div class="cmd-blocklabel">Offert (montant exact)</div>
          <div class="cmd-offert-row"><input id="cmdOffertInput" type="number" step="0.5" min="0" placeholder="0,00 €"/><span style="font-size:11.5px;color:var(--muted);">€ offerts</span></div>
          <div id="cmdMotifZone"></div>
          <div id="cmdSubtotZone"></div>
          <div class="cmd-total"><span>Total TTC</span><span class="num" id="cmdTotalVal">0,00 €</span></div>
          <div class="cmd-payrow" id="cmdPayRow"></div>
          <div id="cmdCashZone"></div>
          <div id="cmdCbZone"></div>
          <button class="cmd-encaisser" id="cmdEncBtn">Encaisser</button>
          <div class="cmd-blockmsg" id="cmdBlockMsg" style="display:none;"></div>
          <button class="cta ghost" id="cmdClotureBtn" style="width:100%;margin-top:12px;">🔒 Clôturer la caisse</button>
        </div>
      </div>`;
    $("cmdCats").innerHTML = cats.map(c=>`<button class="cmd-catbtn ${c===state.cat?'active':''}" data-cat="${c}">${CAT_LABEL[c]||c}</button>`).join("");
    $("cmdCats").querySelectorAll("button").forEach(b=>b.onclick=()=>{ state.cat=b.dataset.cat; renderCaisse(); });

    const items = productsForStand().filter(p=>p.tva===state.cat);
    $("cmdGrid").innerHTML = items.map(p=>`
      <button class="cmd-pcard ${state.flashId===p.produit?'zap':''}" data-pid="${p.produit}">
        <div class="cmd-pname">${p.produit}</div>
        <div class="cmd-prow"><span class="num" style="font-weight:800;color:var(--violet);">${eur(p.prix)}</span></div>
      </button>`).join("");
    $("cmdGrid").querySelectorAll(".cmd-pcard").forEach(b=>b.onclick=()=>add(b.dataset.pid));

    const L = lines();
    $("cmdTcount").textContent = count()+" art.";
    $("cmdLines").innerHTML = L.length===0 ? `<div class="cmd-empty">Touchez un produit pour l'ajouter.</div>`
      : L.map(l=>`<div class="cmd-line">
          <div style="flex:1;"><div class="nom">${l.p.produit}</div><div class="prix num">${eur(l.p.prix)}</div></div>
          <button class="cmd-stepbtn" data-dec="${l.p.produit}">−</button>
          <span class="cmd-qty num">${l.q}</span>
          <button class="cmd-stepbtn" data-add="${l.p.produit}">+</button>
        </div>`).join("");
    $("cmdLines").querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>dec(b.dataset.dec));
    $("cmdLines").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>add(b.dataset.add));

    const abo = state.motif==="abonne";
    const remises = [0,0.05,0.10,0.15,0.20,0.50];
    $("cmdRemisePills").innerHTML = `<button class="cmd-pill abo ${abo?'on':''}" data-r="abonne">Abonné · ${pct(TAUX_ABONNE*100)}</button>`
      + remises.map(r=>`<button class="cmd-pill ${(!abo && state.remise===r)?'on':''} ${abo?'dimmed':''}" data-r="${r}">${r===0?"Aucune":pct(r*100)}</button>`).join("");
    $("cmdRemisePills").querySelectorAll("button").forEach(b=>b.onclick=()=>{
      if(b.dataset.r==="abonne"){
        if(state.motif==="abonne"){ state.motif=null; state.motifRef=""; state.remise=0; }
        else { state.motif="abonne"; state.remise=TAUX_ABONNE; }
      } else {
        state.remise=parseFloat(b.dataset.r);
        if(state.motif==="abonne"){ state.motif=null; state.motifRef=""; }
      }
      renderCaisse();
    });

    const oi = $("cmdOffertInput");
    if(document.activeElement !== oi) oi.value = state.offert ? state.offert : "";
    oi.oninput = e => { state.offert = parseFloat(e.target.value)||0; renderMotifAndTotals(); };
    renderMotifAndTotals();

    $("cmdPayRow").innerHTML = (accepteEspeces() ? `<button class="cmd-paybtn ${state.pay==='esp'?'on':''}" data-pay="esp">💶 Espèces</button>` : "")
      + `<button class="cmd-paybtn ${state.pay==='cb'?'on':''}" data-pay="cb">💳 CB</button>`;
    $("cmdPayRow").querySelectorAll("button").forEach(b=>b.onclick=()=>{ state.pay=b.dataset.pay; state.donne=0; renderCaisse(); });

    if(state.pay==="esp"){
      const t=total();
      const quick=[...new Set([Math.ceil(t*100)/100, ...[5,10,20,50].filter(v=>v>=t)])].slice(0,4);
      $("cmdCashZone").innerHTML = `<div class="cmd-cashbox">
        <div class="cmd-blocklabel" style="margin-top:0;">Montant donné par le client</div>
        <div class="cmd-quick">${quick.map((v,i)=>`<button class="cmd-qbtn ${state.donne===v?'on':''}" data-v="${v}">${i===0?"Exact":eur(v)}</button>`).join("")}</div>
        <input type="number" step="0.5" placeholder="Saisir un montant" value="${state.donne||''}" id="cmdDonneInput"/>
        <div class="cmd-rendu"><span>Rendu monnaie</span><span class="num" style="color:${state.donne===0?'var(--muted)':(state.donne-t<0?'var(--red)':'var(--green)')}">${state.donne===0?"—":(state.donne-t<0?"Manque "+eur(t-state.donne):eur(state.donne-t))}</span></div>
      </div>`;
      $("cmdCashZone").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ state.donne=parseFloat(b.dataset.v); renderCaisse(); });
      $("cmdDonneInput").oninput = e => { state.donne=parseFloat(e.target.value)||0; renderCaisse(); };
      $("cmdCbZone").innerHTML = "";
    } else if(state.pay==="cb"){
      $("cmdCashZone").innerHTML = "";
      $("cmdCbZone").innerHTML = `<div style="font-size:11px;color:var(--muted);margin-bottom:10px;">Paiement carte sur le TPE — valider une fois le paiement accepté.</div>`;
    } else { $("cmdCashZone").innerHTML=""; $("cmdCbZone").innerHTML=""; }

    const t=total();
    const cashOk = state.pay!=="esp" || state.donne>=t-0.001;
    const enabled = count()>0 && state.pay && cashOk && motifOk();
    const btnE = $("cmdEncBtn");
    btnE.disabled = !enabled;
    btnE.textContent = state.pay==="cb" ? "Valider le paiement" : "Encaisser";
    btnE.onclick = async () => {
      if(!enabled) return;
      btnE.disabled = true;
      const numero = ++state.dernierNumero;
      const evt = {
        type:"vente",
        numero_justificatif: `2026-${codeCaisse()}-${String(numero).padStart(6,"0")}`,
        horodatage: horodatageMinute(new Date()),
        caisse_id: codeCaisse(), stand_id: state.standId, operateur_id: state.operateur,
        lignes: L.map(l=>({ libelle:l.p.produit, quantite:l.q, prix_unitaire:l.p.prix, montant_ttc:+(l.p.prix*l.q).toFixed(2) })),
        ajustement: needsMotif() ? { type: state.offert>0?"offert_montant":"remise_pct", valeur: state.offert>0?state.offert:state.remise, motif:{ code:state.motif, texte_libre: state.motif==="autre"?state.motifTxt.trim():(state.motif==="abonne"?state.motifRef.trim():undefined) } } : null,
        total_ttc: +t.toFixed(2),
        mode_reglement: state.pay==="cb" ? "CB comptoir" : "espèces",
      };
      const scelle = await sceller(evt, derniereEmpreinteConnue());
      if(state.horsLigne) state.fileLocale.push(scelle); else state.chaine.push(scelle);
      toast(`✓ ${eur(t)} encaissé · ${evt.numero_justificatif}${state.horsLigne?" · en file (hors ligne)":""}`);
      state.cart={}; state.remise=0; state.offert=0; state.motif=null; state.motifTxt=""; state.motifRef=""; state.pay=null; state.donne=0;
      renderCaisse(); renderTopbar();
    };
    $("cmdBlockMsg").style.display = (count()>0 && needsMotif() && !motifOk()) ? "block" : "none";
    $("cmdBlockMsg").textContent = "Motif obligatoire pour valider une remise ou un offert.";

    $("cmdClotureBtn").onclick = async () => {
      const ventes = state.chaine.filter(e=>e.type==="vente" && e.caisse_id===codeCaisse());
      const totalTheorique = +(state.fond + ventes.reduce((s,e)=>s+e.total_ttc,0)).toFixed(2);
      const evt = { type:"cloture_caisse", caisse_id:codeCaisse(), stand_id:state.standId, operateur_id:state.operateur, horodatage:horodatageMinute(new Date()), total_theorique:totalTheorique };
      const scelle = await sceller(evt, derniereEmpreinteConnue());
      if(state.horsLigne) state.fileLocale.push(scelle); else state.chaine.push(scelle);
      state.ouverte = false;
      renderGate();
    };
  }

  function add(id){ state.cart[id]=(state.cart[id]||0)+1; state.flashId=id; renderCaisse(); setTimeout(()=>{ state.flashId=null; },420); }
  function dec(id){ const n=(state.cart[id]||0)-1; if(n<=0) delete state.cart[id]; else state.cart[id]=n; renderCaisse(); }

  function renderMotifAndTotals(){
    const zone=$("cmdMotifZone");
    if(needsMotif()){
      zone.innerHTML = `<div class="cmd-motif-box ${!motifOk()?'required':''}">
        <div class="cmd-motif-title">Motif ${!motifOk()?'<span class="req">obligatoire</span>':''}</div>
        <div class="cmd-motif-grid">${MOTIFS.map(m=>`<button class="cmd-motif-chip ${state.motif===m.code?'on':''}" data-m="${m.code}">${m.label}</button>`).join("")}</div>
        ${state.motif==="autre" ? `<input class="cmd-motif-txt" id="cmdMotifTxt" placeholder="Préciser le motif…" value="${state.motifTxt}"/>` : ""}
        ${state.motif==="abonne" ? `<input class="cmd-motif-txt" id="cmdMotifRef" placeholder="${motifDe("abonne").refLab} — obligatoire" value="${state.motifRef}"/>
          <div style="font-size:10.5px;color:var(--muted);margin-top:5px;">Remise contractuelle au taux du lieu (${pct(TAUX_ABONNE*100)}). Le numéro est enregistré avec la vente.</div>` : ""}
      </div>`;
      zone.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ state.motif=b.dataset.m; if(state.motif==="abonne") state.remise=TAUX_ABONNE; else state.motifRef=""; renderCaisse(); });
      const mt=$("cmdMotifTxt"); if(mt) mt.oninput=e=>{ state.motifTxt=e.target.value; };
      const mr=$("cmdMotifRef"); if(mr){ mr.oninput=e=>{ state.motifRef=e.target.value; const btn=$("cmdEncBtn"); if(btn){ const t=total(); const cashOk=state.pay!=="esp"||state.donne>=t-0.001; btn.disabled=!(count()>0&&state.pay&&cashOk&&motifOk()); } }; }
    } else { zone.innerHTML=""; }
    const rv=remiseVal();
    let sub="";
    if(rv>0) sub += `<div class="cmd-subtot"><span>Sous-total · ${state.motif==="abonne"?`remise abonné ${pct(TAUX_ABONNE*100)}`:`remise ${pct(state.remise*100)}`}</span><span class="num">${eur(brut())} · − ${eur(rv)}</span></div>`;
    if(state.offert>0) sub += `<div class="cmd-subtot"><span>Offert</span><span class="num">− ${eur(state.offert)}</span></div>`;
    $("cmdSubtotZone").innerHTML = sub;
    $("cmdTotalVal").textContent = eur(total());
  }

  async function verifierIntegrite(){
    let precedente = GENESE, premiereRompueId = null;
    for(const evt of state.chaine){
      const attendue = await sha256Hex(serialiser({ ...evt, empreinte:undefined }));
      const ok = evt.empreinte_precedente===precedente && evt.empreinte===attendue;
      if(!ok && premiereRompueId===null) premiereRompueId = evt._id;
      precedente = evt.empreinte;
    }
    state.integrite = { premiereRompueId };
  }
  function evLabel(evt){
    if(evt.type==="vente") return { titre:evt.numero_justificatif, montant:eur(evt.total_ttc), cls:"" };
    if(evt.type==="ouverture_caisse") return { titre:"Ouverture de caisse", montant:"Fond "+eur(evt.fond_declare), cls:"ouverture" };
    if(evt.type==="cloture_caisse") return { titre:"Clôture de caisse", montant:"Théorique "+eur(evt.total_theorique), cls:"cloture" };
    return { titre:evt.type, montant:"", cls:"" };
  }
  function renderJournal(){
    if(state.tab!=="journal" || !$("cmdJournalView")) return;
    state.chaine.forEach((e,i)=>{ if(e._id===undefined) e._id="c"+i; });
    state.fileLocale.forEach((e,i)=>{ if(e._id===undefined) e._id="f"+i; });
    const ventes = state.chaine.filter(e=>e.type==="vente");
    const totalPeriode = ventes.reduce((s,e)=>s+e.total_ttc,0);
    let banniere="";
    if(state.lotRejete){ banniere = `<div class="cmd-banner bad">✗ Lot rejeté à la reconnexion — rupture de continuité détectée. Rien n'a été inséré.<button id="cmdReparerBtn">Réparer le lot</button></div>`; }
    else if(state.fileLocale.length){ banniere = `<div class="cmd-banner warn">🔌 ${state.fileLocale.length} événement(s) chaîné(s) localement, en attente de raccordement.<button id="cmdCorrompreBtn" style="background:var(--red);">🧪 Corrompre le lot (test)</button><button id="cmdReconnecterBtn">Se reconnecter</button></div>`; }
    if(state.integrite && state.integrite.premiereRompueId){ banniere += `<div class="cmd-banner bad">✗ Chaîne rompue à partir de l'événement <code>${state.integrite.premiereRompueId}</code> (§15.2 : retirer/modifier un événement casse la chaîne).</div>`; }
    else if(state.integrite){ banniere += `<div class="cmd-banner ok">✓ Chaîne intègre — ${state.chaine.length} événement(s) vérifié(s), aucune rupture.</div>`; }

    $("cmdJournalView").innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="v num">${state.dernierNumero?"2026-"+codeCaisse()+"-"+String(state.dernierNumero).padStart(6,"0"):"—"}</div><div class="l">Dernier n° émis</div></div>
        <div class="kpi"><div class="v num">${eur(totalPeriode)}</div><div class="l">Total de période (caisse)</div></div>
        <div class="kpi"><div class="v num">${state.chaine.length}</div><div class="l">Événements scellés</div></div>
        <div class="kpi"><div class="v num">${state.fileLocale.length}</div><div class="l">En file (hors ligne)</div></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
        <button class="cta ghost" id="cmdToggleHL">${state.horsLigne?"🔌 Revenir en ligne":"📵 Simuler une coupure réseau"}</button>
        <button class="cta ghost" id="cmdVerifBtn">🔍 Vérifier l'intégrité de la chaîne</button>
        <button class="cta ghost" id="cmdResetBtn">↺ Réinitialiser la démo</button>
      </div>
      ${banniere}
      <div class="cmd-jcard"><b>Chaîne confirmée — ${codeCaisse()} · ${standActuel().nom}</b>
        <div style="margin-top:10px;">${state.chaine.map(evRow).join("") || '<div class="cmd-empty">Aucun événement — ouvrez la caisse.</div>'}</div>
      </div>
      ${state.fileLocale.length ? `<div class="cmd-jcard"><b>File locale — non raccordée</b><div style="margin-top:10px;">${state.fileLocale.map(evRow).join("")}</div></div>` : ""}
    `;
    function evRow(evt){
      const L = evLabel(evt);
      const rompue = state.integrite && state.integrite.premiereRompueId && (evt._id===state.integrite.premiereRompueId || (state.chaine.findIndex(e=>e._id===evt._id) >= state.chaine.findIndex(e=>e._id===state.integrite.premiereRompueId)));
      return `<div class="cmd-evrow ${rompue?'rompue':''} ${evt._id.startsWith('f')?'file':''}">
        <div class="cmd-evhead"><span class="cmd-evtype ${L.cls}">${evt.type}</span><span class="cmd-evnum num">${L.titre}</span><span class="cmd-evtime">${evt.horodatage}</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
          <span class="cmd-evamt num">${L.montant}</span>
          ${state.integrite ? `<span class="cmd-evbadge ${rompue?'bad':'ok'}">${rompue?'ROMPUE':'OK'}</span>` : ""}
        </div>
        <div class="cmd-evhash">préc. ${court(evt.empreinte_precedente)} → empreinte ${court(evt.empreinte)}</div>
        ${evt.type==="vente" ? `<button class="cmd-microbtn danger" data-falsifier="${evt._id}">🧪 Falsifier ce ticket (test)</button>` : ""}
      </div>`;
    }
    $("cmdToggleHL").onclick = () => { state.horsLigne=!state.horsLigne; renderTopbar(); renderJournal(); };
    $("cmdVerifBtn").onclick = async () => { await verifierIntegrite(); renderJournal(); };
    $("cmdResetBtn").onclick = () => {
      state.chaine=[]; state.fileLocale=[]; state.dernierNumero=0; state.horsLigne=false; state.lotRejete=false; state.integrite=null;
      state.ouverte=false; state.fondSaisi=""; renderGate();
    };
    $("cmdJournalView").querySelectorAll("[data-falsifier]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.falsifier;
      const evt = state.chaine.find(e=>e._id===id) || state.fileLocale.find(e=>e._id===id);
      if(evt){ evt.total_ttc = +(evt.total_ttc+50).toFixed(2); }
      verifierIntegrite().then(renderJournal);
    });
    const corr=$("cmdCorrompreBtn"); if(corr) corr.onclick=()=>{ state.fileLocale[0].empreinte_precedente="f".repeat(64); renderJournal(); };
    const reco=$("cmdReconnecterBtn"); if(reco) reco.onclick=()=>{
      const attendu = derniereEmpreinteConfirmee();
      if(state.fileLocale[0].empreinte_precedente!==attendu){ state.lotRejete=true; renderJournal(); return; }
      state.chaine.push(...state.fileLocale); state.fileLocale=[]; state.lotRejete=false;
      renderTopbar(); renderJournal();
    };
    const rep=$("cmdReparerBtn"); if(rep) rep.onclick = async () => {
      let prec = derniereEmpreinteConfirmee();
      const relie=[];
      for(const evt of state.fileLocale){
        const { empreinte, empreinte_precedente, ...champs } = evt;
        const s = await sceller(champs, prec);
        relie.push(s); prec = s.empreinte;
      }
      state.fileLocale = relie; state.lotRejete=false; renderJournal();
    };
  }

  function renderAll(){
    document.querySelectorAll(".cmd-tabbtn").forEach(b=>{
      b.classList.toggle("active", b.dataset.tab===state.tab);
      b.onclick = () => { state.tab=b.dataset.tab; $("cmdCaisseView").style.display=state.tab==="caisse"?"block":"none"; $("cmdJournalView").style.display=state.tab==="journal"?"block":"none"; renderCaisse(); renderJournal(); };
    });
    $("cmdCaisseView").style.display = state.tab==="caisse"?"block":"none";
    $("cmdJournalView").style.display = state.tab==="journal"?"block":"none";
    renderCaisse(); renderJournal();
  }

  return { mount };
})();

/* ============================================================
   MODULE JOURNAL / TICKETS (module 3) — reconstruit le 28/09 (§15.62)
   depuis l'artifact officiel "Journal / Tickets — Flex Expert"
   (71ec83d4…), lu intégralement : consultation en lecture seule,
   toutes caisses confondues, du même format d'événement que Ma
   caisse (module 1). Comme l'artifact officiel le déclare lui-même
   dans son propre pied de page, une vraie source unique partagée
   suppose un backend — absent de ce prototype isolé — donc ce
   module scelle ici son propre jeu d'événements de démonstration au
   chargement, dans le même format et avec le même chaînage SHA-256
   réel que Module 1 (pas le succédané pédagogique utilisé dans
   Conformité). Structure réelle reprise : 9 caisses, 4 stands, noms
   des caissiers, catalogue et prix — jamais une quatrième liste de
   données inventée pour ce module.
   N'écrit rien dans le code de Cmd (module 1) : classes et conteneurs
   séparés (préfixe jrn-/#cmdJrnView), un onclick additionnel posé sur
   les boutons .cmd-tabbtn existants (addEventListener, jamais une
   réécriture de leur .onclick).
   ============================================================ */
const Jrn = (function(){
  const GENESE = "0".repeat(64);
  const eur2 = n => (n||0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
  const $ = id => document.getElementById(id);

  async function sha256Hex(str){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  function serialiser(evtSansEmpreinte){ const { empreinte, _id, ...champs } = evtSansEmpreinte; return JSON.stringify(champs); }
  async function sceller(evtSansEmpreinte, empreintePrecedente){
    const avecPrec = { ...evtSansEmpreinte, empreinte_precedente: empreintePrecedente };
    const empreinte = await sha256Hex(serialiser(avecPrec));
    return { ...avecPrec, empreinte };
  }
  function court(h){ return h ? h.slice(0,10)+"…"+h.slice(-6) : "—"; }
  function rand(seed){ return function(){ seed=(seed*9301+49297)%233280; return seed/233280; }; }

  // 9 caisses réelles des Spartiates — même format que Cmd (codeCaisse = "C"+n).
  // §15.88 : reconstruite à chaque changement de SPARTIATES (ajout de stand/caisse) — ne
  // touche que cette liste de référence, jamais TICKETS/parCaisse (état réel des caisses,
  // gardé ailleurs, keyed par caisse_id qui ne change jamais pour une caisse existante).
  const CAISSES = [];
  function reconstruireCaisses(){
    CAISSES.length = 0;
    SPARTIATES.stands.forEach(s=>s.caisses.forEach(c=>{
      CAISSES.push({ caisse_id:"C"+c, stand_id:s.id, stand_nom:s.nom, operateur_id:SPARTIATES.caissiers[c] });
    }));
  }
  reconstruireCaisses();
  onSpartiatesChange(reconstruireCaisses);

  let TICKETS = [];            // affichage — trié par horodatage
  let ORDRE_SCELLEMENT = [];   // ordre réel de scellement par caisse — jamais retrié, seul ordre qui fait foi pour l'intégrité
  let integrite = null;
  let seeded = false, seeding = null;
  let jrnActive = false;
  let ouvert = null;
  const filtres = { stand:"", caisse:"", operateur:"", mode:"", texte:"" };

  const MOTIFS = { abonne:"Abonné", staff:"Staff", geste:"Geste commercial", remb:"Remboursement", client:"Client mécontent", autre:"Autre" };

  async function seed(){
    const r = rand(2026);
    let n = 0;
    for(const c of CAISSES){
      let precedente = GENESE;
      const catalogueStand = SPARTIATES.catalogue.filter(p=>p.stand===c.stand_id);
      const nbTickets = 3 + Math.floor(r()*3); // 3 à 5 tickets par caisse, jeu de test
      for(let i=1;i<=nbTickets;i++){
        n++;
        const nbLignes = 1 + Math.floor(r()*2);
        const lignes = [];
        for(let k=0;k<nbLignes;k++){
          const p = catalogueStand[Math.floor(r()*catalogueStand.length)];
          const q = 1 + Math.floor(r()*2);
          lignes.push({ libelle:p.produit, quantite:q, prix_unitaire:p.prix, montant_ttc:+(p.prix*q).toFixed(2) });
        }
        const brut = +lignes.reduce((s,l)=>s+l.montant_ttc,0).toFixed(2);
        let ajustement = null;
        if(r()<0.15) ajustement = { type:"remise_pct", valeur:0.15, motif:{ code:"abonne", texte_libre:"" } };
        else if(r()<0.20) ajustement = { type:"offert_montant", valeur:+(brut*0.2).toFixed(2), motif:{ code:"geste", texte_libre:"" } };
        const total_ttc = ajustement ? +Math.max(0, ajustement.type==="remise_pct" ? brut*(1-ajustement.valeur) : brut-ajustement.valeur).toFixed(2) : brut;
        // Minutes cumulées depuis 18:00 le 12/09 (soirée Bayonne, déjà utilisée ailleurs §15.27), strictement
        // croissantes par caisse — cohérent avec l'ordre réel de scellement, comme l'exige l'artifact officiel.
        const minutesEcoulees = i * (9 + Math.floor(r()*8));
        const heure = 18 + Math.floor(minutesEcoulees/60), minute = minutesEcoulees%60;
        const evtBrut = {
          type:"vente",
          numero_justificatif: `2026-${c.caisse_id}-${String(i).padStart(6,"0")}`,
          horodatage: `12/09/2026 ${String(heure).padStart(2,"0")}:${String(minute).padStart(2,"0")}`,
          caisse_id:c.caisse_id, stand_id:c.stand_id, operateur_id:c.operateur_id,
          lignes, ajustement, total_ttc,
          mode_reglement: r()<0.55 ? "espèces" : "CB comptoir",
        };
        const scelle = await sceller(evtBrut, precedente);
        ORDRE_SCELLEMENT.push(scelle);
        precedente = scelle.empreinte;
      }
    }
    TICKETS = [...ORDRE_SCELLEMENT].sort((a,b)=>a.horodatage.localeCompare(b.horodatage));
    seeded = true;
  }

  async function verifierIntegrite(){
    const parCaisse = {};
    CAISSES.forEach(c=>parCaisse[c.caisse_id]={ precedente:GENESE, romptAt:null });
    // Toujours dans l'ordre réel de scellement, jamais l'ordre d'affichage trié par horodatage
    // (les deux peuvent diverger sans rupture réelle) — même précaution que l'artifact officiel.
    for(const t of ORDRE_SCELLEMENT){
      const st = parCaisse[t.caisse_id];
      if(st.romptAt) continue;
      if(t.empreinte_precedente!==st.precedente){ st.romptAt=t.numero_justificatif; continue; }
      const attendue = await sha256Hex(serialiser({...t, empreinte:undefined}));
      if(attendue!==t.empreinte){ st.romptAt=t.numero_justificatif; continue; }
      st.precedente = t.empreinte;
    }
    integrite = parCaisse;
  }

  function optionsUniques(sel, values, labelFn){
    const cur = sel.value;
    sel.innerHTML = sel.options[0].outerHTML + [...new Set(values)].map(v=>`<option value="${v}">${labelFn?labelFn(v):v}</option>`).join("");
    sel.value = cur;
  }

  function ticketsFiltres(){
    const ft = filtres.texte.trim().toLowerCase();
    return TICKETS.filter(t =>
      (!filtres.stand || t.stand_id===filtres.stand) && (!filtres.caisse || t.caisse_id===filtres.caisse) &&
      (!filtres.operateur || t.operateur_id===filtres.operateur) && (!filtres.mode || t.mode_reglement===filtres.mode) &&
      (!ft || t.numero_justificatif.toLowerCase().includes(ft) || t.lignes.some(l=>l.libelle.toLowerCase().includes(ft)))
    );
  }

  function ligne(t){
    const isOpen = ouvert===t.numero_justificatif;
    const st = integrite ? integrite[t.caisse_id] : null;
    const parCaisseOrdre = ORDRE_SCELLEMENT.filter(x=>x.caisse_id===t.caisse_id);
    const idx = parCaisseOrdre.findIndex(x=>x.numero_justificatif===t.numero_justificatif);
    const romptIdx = st && st.romptAt ? parCaisseOrdre.findIndex(x=>x.numero_justificatif===st.romptAt) : -1;
    const estRompu = st && st.romptAt && idx>=romptIdx;
    let h = `<tr class="parent jrn-row" data-t="${t.numero_justificatif}">
      <td><span class="caret ${isOpen?'open':''}">▶</span> <span class="mono" style="font-weight:700;">${t.numero_justificatif}</span></td>
      <td>${t.stand_id} <span style="color:var(--muted);">· ${t.caisse_id}</span></td>
      <td>${t.operateur_id}</td>
      <td>${t.mode_reglement==="espèces"?"💶 Espèces":"💳 CB"}</td>
      <td>${t.ajustement?`<span class="chip warn">${t.ajustement.type==="remise_pct"?"Remise "+Math.round(t.ajustement.valeur*100)+" %":"Offert"}</span>`:"—"}</td>
      <td class="r num" style="font-weight:700;">${eur2(t.total_ttc)}</td>
      <td>${t.horodatage}</td>
      <td>${integrite?`<span class="badge ${estRompu?'ko':'ok'}">${estRompu?"ROMPUE":"OK"}</span>`:'<span style="color:var(--muted);font-size:11.5px;">—</span>'}</td>
    </tr>`;
    if(isOpen) h += `<tr class="detail"><td colspan="8">${detail(t)}</td></tr>`;
    return h;
  }

  function detail(t){
    return `<div style="font-size:12.5px;">
      ${t.lignes.map(l=>`<div style="display:flex;justify-content:space-between;padding:3px 0;"><span>${l.quantite} × ${l.libelle} (${eur2(l.prix_unitaire)})</span><b class="num">${eur2(l.montant_ttc)}</b></div>`).join("")}
      ${t.ajustement?`<div style="display:flex;justify-content:space-between;padding:3px 0;color:var(--amber);"><span>${t.ajustement.type==="remise_pct"?"Remise "+MOTIFS[t.ajustement.motif.code]+" "+Math.round(t.ajustement.valeur*100)+" %":"Offert — "+MOTIFS[t.ajustement.motif.code]}</span><span></span></div>`:""}
      <div class="mono" style="font-size:11px;color:var(--muted);margin-top:8px;">précédente ${court(t.empreinte_precedente)} → empreinte ${court(t.empreinte)}</div>
    </div>`;
  }

  function render(){
    const el = $("cmdJrnView");
    if(!el) return;
    if(!seeded){ el.innerHTML = `<div class="hint">Scellement du jeu de test en cours…</div>`; return; }
    const liste = ticketsFiltres();
    const romp = integrite ? Object.values(integrite).some(v=>v.romptAt) : null;
    el.innerHTML = `
      <div class="alertbox" style="background:var(--violet-soft);border-color:var(--field-border);color:var(--text);">
        <b>Consultation en lecture seule.</b> Ce module ne recalcule rien : il consolide, pour toutes les caisses et tous les stands, le même format d'événement scellé que produit Ma caisse. Jeu de test scellé au chargement (§15.62) — pas une vente réelle des Spartiates, chaînage SHA-256 réel.
      </div>
      <div class="kpis">
        <div class="kpi"><div class="v num">${TICKETS.length}</div><div class="l">Tickets de la soirée (test)</div></div>
        <div class="kpi"><div class="v num">${eur2(TICKETS.reduce((s,t)=>s+t.total_ttc,0))}</div><div class="l">CA total TTC (test)</div></div>
        <div class="kpi"><div class="v num">${CAISSES.length}</div><div class="l">Caisses actives</div></div>
        <div class="kpi"><div class="v">${integrite===null?'<span style="color:var(--muted);font-size:15px;">non vérifiée</span>':(romp?'<span class="badge ko">ROMPUE</span>':'<span class="badge ok">OK</span>')}</div><div class="l">Intégrité des chaînes</div></div>
      </div>
      <div class="card">
        <strong class="title">Rechercher un ticket</strong>
        <div class="params" style="grid-template-columns:repeat(5,1fr);">
          <div class="pfield"><label>Stand</label><select class="cell" id="jrnFStand" style="text-align:left;"><option value="">Tous</option></select></div>
          <div class="pfield"><label>Caisse</label><select class="cell" id="jrnFCaisse" style="text-align:left;"><option value="">Toutes</option></select></div>
          <div class="pfield"><label>Opérateur</label><select class="cell" id="jrnFOperateur" style="text-align:left;"><option value="">Tous</option></select></div>
          <div class="pfield"><label>Mode de règlement</label><select class="cell" id="jrnFMode" style="text-align:left;"><option value="">Tous</option><option value="espèces">Espèces</option><option value="CB comptoir">CB</option></select></div>
          <div class="pfield"><label>N° de justificatif / produit</label><input class="cell" id="jrnFTexte" type="text" style="text-align:left;" placeholder="ex. 2026-C1-… ou hot dog"/></div>
        </div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px;">
          <strong class="title" style="margin:0;">Tickets (${liste.length})</strong>
          <button class="cta ghost" id="jrnVerifBtn">🔍 Vérifier l'intégrité des chaînes</button>
        </div>
        <div class="hint">Clique un ticket pour voir le détail des lignes vendues, la remise/l'offert éventuel, et son empreinte dans la chaîne de sa caisse.</div>
        <table>
          <thead><tr><th>Justificatif</th><th>Stand · caisse</th><th>Opérateur</th><th>Mode</th><th>Ajustement</th><th class="r">Total TTC</th><th>Horodatage</th><th>Intégrité</th></tr></thead>
          <tbody>${liste.length? liste.map(ligne).join("") : `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:20px;">Aucun ticket ne correspond à ces filtres.</td></tr>`}</tbody>
        </table>
      </div>
    `;
    optionsUniques($("jrnFStand"), CAISSES.map(c=>c.stand_id), v=>(SPARTIATES.stands.find(s=>s.id===v)||{}).nom||v);
    optionsUniques($("jrnFCaisse"), CAISSES.map(c=>c.caisse_id), v=>{ const c=CAISSES.find(x=>x.caisse_id===v); return `${v} · ${c.stand_nom}`; });
    optionsUniques($("jrnFOperateur"), CAISSES.map(c=>c.operateur_id));
    $("jrnFStand").value = filtres.stand; $("jrnFCaisse").value = filtres.caisse; $("jrnFOperateur").value = filtres.operateur; $("jrnFMode").value = filtres.mode; $("jrnFTexte").value = filtres.texte;
    $("jrnFStand").onchange = e=>{ filtres.stand=e.target.value; render(); };
    $("jrnFCaisse").onchange = e=>{ filtres.caisse=e.target.value; render(); };
    $("jrnFOperateur").onchange = e=>{ filtres.operateur=e.target.value; render(); };
    $("jrnFMode").onchange = e=>{ filtres.mode=e.target.value; render(); };
    $("jrnFTexte").oninput = e=>{ filtres.texte=e.target.value; render(); };
    $("jrnVerifBtn").onclick = async ()=>{ await verifierIntegrite(); render(); };
    el.querySelectorAll(".jrn-row").forEach(tr=>{
      tr.onclick = ()=>{ const id=tr.dataset.t; ouvert = ouvert===id?null:id; render(); };
    });
  }

  function activer(){
    jrnActive = true;
    document.querySelectorAll(".cmd-tabbtn").forEach(b=>b.classList.remove("active"));
    const jb = $("jrnTabBtn"); if(jb) jb.classList.add("active");
    const cv = $("cmdCaisseView"), jv2 = $("cmdJournalView"), jv3 = $("cmdJrnView");
    if(cv) cv.style.display="none"; if(jv2) jv2.style.display="none"; if(jv3) jv3.style.display="block";
    if(!seeded && !seeding) seeding = seed().then(render);
    else render();
  }
  function desactiver(){
    jrnActive = false;
    const jb = $("jrnTabBtn"); if(jb) jb.classList.remove("active");
    const jv3 = $("cmdJrnView"); if(jv3) jv3.style.display="none";
  }

  function mount(){
    const jb = $("jrnTabBtn");
    if(!jb) return; // section pas affichée
    jb.onclick = activer;
    // Écouteur additionnel, jamais une réécriture du .onclick existant de Cmd (module clos) :
    // referme seulement l'onglet ③ si l'un des deux onglets de Cmd est cliqué.
    document.querySelectorAll(".cmd-tabbtn").forEach(b=>b.addEventListener("click", desactiver));
    if(jrnActive) activer(); // ré-affiche l'onglet ③ après un aller-retour vers une autre section
  }

  // §15.73 — additif pur pour « Mes caisses » (rôle Gérant) : aucune des fonctions ci-dessus
  // (mount/render/activer/desactiver/seed/CAISSES/TICKETS) n'est modifiée. Réutilise le même
  // jeu de tickets de test scellé (déjà disclosed) pour l'agréger par caisse plutôt que par ticket.
  function parCaisseStats(){
    return CAISSES.map(c=>{
      const t = TICKETS.filter(x=>x.caisse_id===c.caisse_id);
      const ca = +t.reduce((s,x)=>s+x.total_ttc,0).toFixed(2);
      const esp = t.filter(x=>x.mode_reglement==="espèces").length;
      const cb = t.length-esp;
      const dernier = t.length ? t.reduce((a,b)=>a.horodatage>b.horodatage?a:b) : null;
      const st = integrite ? integrite[c.caisse_id] : null;
      return { ...c, nb:t.length, ca, panier: t.length ? ca/t.length : 0, esp, cb, dernier, romptAt: st?st.romptAt:null };
    });
  }

  function renderDashboard(){
    const el = $("gerCaissesView");
    if(!el) return;
    if(!seeded){ el.innerHTML = `<div class="hint">Scellement du jeu de test en cours…</div>`; return; }
    const stats = parCaisseStats();
    const caTotal = stats.reduce((s,c)=>s+c.ca,0);
    const nbTotal = stats.reduce((s,c)=>s+c.nb,0);
    const romp = integrite ? Object.values(integrite).some(v=>v.romptAt) : null;
    const standsIds = [...new Set(CAISSES.map(c=>c.stand_id))];
    el.innerHTML = `
      <div class="alertbox" style="background:var(--violet-soft);border-color:var(--field-border);color:var(--text);">
        <b>Vue consolidée, lecture seule, sans connexion à une caisse.</b> Statistiques calculées sur le même jeu de test scellé que le Journal / Tickets (module 3, §15.62) — 9 caisses, 4 stands, chaînage SHA-256 réel, pas une vente réelle des Spartiates.
      </div>
      <div class="kpis">
        <div class="kpi"><div class="v num">${CAISSES.length}</div><div class="l">Caisses actives</div></div>
        <div class="kpi"><div class="v num">${nbTotal}</div><div class="l">Tickets (test)</div></div>
        <div class="kpi"><div class="v num">${eur2(caTotal)}</div><div class="l">CA total TTC (test)</div></div>
        <div class="kpi"><div class="v">${integrite===null?'<span style="color:var(--muted);font-size:15px;">non vérifiée</span>':(romp?'<span class="badge ko">ROMPUE</span>':'<span class="badge ok">OK</span>')}</div><div class="l">Intégrité des chaînes</div></div>

      <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
        <button class="cta ghost" id="gerVerifBtn">🔍 Vérifier l'intégrité de toutes les chaînes</button>
      </div>
      ${standsIds.map(sid=>{
        const s = SPARTIATES.stands.find(x=>x.id===sid);
        const rows = stats.filter(c=>c.stand_id===sid);
        const subCa = rows.reduce((s2,c)=>s2+c.ca,0);
        return `<div class="card">
          <strong class="title">${s.nom} <span style="font-weight:400;color:var(--muted);font-size:12px;">— ${rows.length} caisse${rows.length>1?'s':''} · ${eur2(subCa)}</span></strong>
          <table>
            <thead><tr><th>Caisse</th><th>Opérateur</th><th class="r">Tickets</th><th class="r">CA TTC</th><th class="r">Panier moyen</th><th>Espèces / CB</th><th>Dernier ticket</th><th>Intégrité</th></tr></thead>
            <tbody>${rows.map(c=>`<tr>
              <td class="mono" style="font-weight:700;">${c.caisse_id}</td>
              <td>${c.operateur_id}</td>
              <td class="r num">${c.nb}</td>
              <td class="r num" style="font-weight:700;">${eur2(c.ca)}</td>
              <td class="r num">${eur2(c.panier)}</td>
              <td>${c.esp} / ${c.cb}</td>
              <td>${c.dernier ? c.dernier.horodatage : '—'}</td>
              <td>${integrite ? (c.romptAt?'<span class="badge ko">ROMPUE</span>':'<span class="badge ok">OK</span>') : '<span style="color:var(--muted);font-size:11.5px;">—</span>'}</td>
            </tr>`).join("")}</tbody>
          </table>
        </div>`;
      }).join("")}
    `;
    const vb = $("gerVerifBtn");
    if(vb) vb.onclick = async ()=>{ await verifierIntegrite(); renderDashboard(); };
  }

  function activerDash(){
    const gb = $("gerDashTabBtn"), jb = $("jrnTabBtn");
    if(gb) gb.classList.add("active"); if(jb) jb.classList.remove("active");
    const gv = $("gerCaissesView"), jv = $("cmdJrnView");
    if(gv) gv.style.display="block"; if(jv) jv.style.display="none";
    if(!seeded && !seeding) seeding = seed().then(renderDashboard);
    else renderDashboard();
  }
  function activerTickets(){
    const gb = $("gerDashTabBtn"), jb = $("jrnTabBtn");
    if(gb) gb.classList.remove("active"); if(jb) jb.classList.add("active");
    const gv = $("gerCaissesView"), jv = $("cmdJrnView");
    if(gv) gv.style.display="none"; if(jv) jv.style.display="block";
    if(!seeded && !seeding) seeding = seed().then(render);
    else render();
  }
  function mountDashboard(){
    const gb = $("gerDashTabBtn"), jb = $("jrnTabBtn");
    if(!gb || !jb) return; // section pas affichée (ex. rôle Opérateur)
    gb.onclick = activerDash;
    jb.onclick = activerTickets;
    activerDash(); // "Mes caisses" est la vue par défaut à l'ouverture de la section
  }

  return { mount, mountDashboard };
})();

/* ============================================================
   SECTION 6 — Facturation
   Modules fusionnés : 12a (Facturation Break Eat), 12b (Facturation
   fournisseur). Portage fidèle le 13/09 (§15.47) suite au
   signalement de Rémi (« il y a des oublis », pointant directement
   les deux artifacts officiels e2f3910f et 94d67dff) : le premier
   portage avait réduit chaque module à un tableau statique à une

   intégralement avant d'écrire quoi que ce soit.

/* ---- 12a : Facturation Break Eat — 3 vues internes (contrat du lieu,
   facture abonnement, facture commission C&C), jamais fondues en une
   seule ligne. Le contrat (tarifs par module, activation) reprend tel
   quel le jeu de test officiel de la grille éditeur — générique à
   FlaiX Expert, pas spécifique aux Spartiates, contrat réel non
   communiqué par Rémi. La commission C&C est reprise TELLE QUELLE de
   Gestion financière (module 11), jamais recalculée ici : seule la
   soirée Bayonne (12/09) a une cascade financière complète calculée
   à ce jour dans le dossier (§15.27/§15.41) — les deux autres soirées
   de test (Toulon, Grenoble) n'ont pas de commission_ht calculée
   ailleurs, donc listées « non calculée » plutôt que comblées par un
   chiffre inventé. ---- */
const Fac = (function(){
  const eur2 = n => (n==null) ? "—" : n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
  const BREAKEAT = { nom:"Break Eat SAS", adresse:"Marseille", siren:"925 187 395" };
  const PERIODE = "Septembre 2026";

  let CONTRAT = [
    {id:"m1", nom:"Caisse & Commande", actif:true,  tarif:150},
    {id:"m2", nom:"Stock",             actif:true,  tarif:90},
    {id:"m3", nom:"Marges & ratios",   actif:true,  tarif:60},
    {id:"m4", nom:"Gestion financière",actif:true,  tarif:80},
    {id:"m5", nom:"Click & Collect (agrégation)", actif:true, tarif:40},
    {id:"m6", nom:"Masse salariale et employeur", actif:true, tarif:50},
    {id:"m7", nom:"Optimisation",      actif:false, tarif:70},
  ];
  const SOIREES = [
    {id:"e1", date:"22/08/2026", evt:"Toulon",   comHt:null},
    {id:"e2", date:"05/09/2026", evt:"Grenoble", comHt:null},
    {id:"e3", date:"12/09/2026", evt:"Bayonne",  comHt:318.00},
  ];
  const TVA_COM = 20;
  let onglet = "contrat", statutAbo = "emise", statutCom = "a_emettre";

  const ONGLETS = [["contrat","Contrat du lieu"],["abo","Facture Abonnement"],["com","Facture Commission C&C"]];
  const STATUTS = { a_emettre:["À émettre","grey"], emise:["Émise","vio"], payee:["Payée","ok"], retard:["En retard","bad"] };
  const chipStatut = s => `<span class="chip ${STATUTS[s][1]}">${STATUTS[s][0]}</span>`;
  const totalAbo = () => CONTRAT.filter(m=>m.actif).reduce((s,m)=>s+m.tarif,0);
  const totalComHt = () => SOIREES.reduce((s,x)=>s+(x.comHt||0),0);

  function markup(){
    return `
    <div class="cmd-tabs" id="facTabs">${ONGLETS.map(([k,l])=>`<button class="cmd-tabbtn fac-tabbtn" data-tab="${k}">${l}</button>`).join("")}</div>
    <div id="facPanel"></div>
    `;
  }

  function vueContrat(){
    return `
    <div class="card">
      <strong class="title">Contrat du lieu <span class="chip vio">Back-office éditeur — module 17</span></strong>
      <div class="hint">Ce que le lieu paie se règle une fois ici — c'est Break Eat qui décide ce qu'il facture, pas le lieu. Les deux factures ne font que lire ce réglage, jamais saisies à la main. Tarifs de démonstration (grille éditeur générique) : le contrat réel des Spartiates n'a pas été communiqué par Rémi.</div>
      <div class="fac-to"><b>${SPARTIATES.lieu}</b><br>Adresse et SIREN du lieu non communiqués à ce jour — à compléter avant émission réelle.</div>
      <div style="overflow-x:auto;"><table>
        <tr><th>Module souscrit</th><th></th><th class="r">Tarif mensuel HT</th></tr>
        ${CONTRAT.map(m=>`<tr>
          <td>${m.nom}</td>
          <td><label class="frs-swtch"><input type="checkbox" data-actif="${m.id}" ${m.actif?"checked":""}><span class="sl"></span></label></td>
          <td class="r num"><input class="cell" type="number" step="5" min="0" value="${m.tarif}" data-tarif="${m.id}" style="width:80px;" ${m.actif?"":"disabled"}> €</td>
        </tr>`).join("")}
        <tr><td colspan="2"><b>Total abonnement mensuel HT</b></td><td class="r num" id="facTotContrat"><b>${eur2(totalAbo())}</b></td></tr>
      </table></div>
    </div>`;
  }
  function wireContrat(){
    document.querySelectorAll("[data-actif]").forEach(c=>c.onchange=e=>{
      const m = CONTRAT.find(x=>x.id===e.target.dataset.actif); m.actif=e.target.checked; renderPanel();
    });
    document.querySelectorAll("[data-tarif]").forEach(i=>i.oninput=e=>{
      const m = CONTRAT.find(x=>x.id===e.target.dataset.tarif); m.tarif=Math.max(0,parseFloat(e.target.value)||0);
      document.getElementById("facTotContrat").innerHTML = `<b>${eur2(totalAbo())}</b>`;
    });
  }

  function enteteFacture(num, statutKey){
    return `
    <div class="fac-invhead">
      <div class="from"><b>${BREAKEAT.nom}</b><br>${BREAKEAT.adresse}<br>SIREN ${BREAKEAT.siren}</div>
      <div class="meta">Facture n° <b>${num}</b><br>Période : <b>${PERIODE}</b><br>Statut : ${chipStatut(statutKey)}</div>
    </div>
    <div class="fac-to"><b>Destinataire</b><br>${SPARTIATES.lieu}</div>`;
  }

  function vueAbo(){
    const lignes = CONTRAT.filter(m=>m.actif);
    const ht = totalAbo(), tva = ht*0.20, ttc = ht+tva;
    return `
    <div class="card">
      ${enteteFacture("BE-2026-09-A01", statutAbo)}
      <div style="overflow-x:auto;"><table>
        <tr><th>Module</th><th class="r">Montant HT</th></tr>
        ${lignes.map(m=>`<tr><td>${m.nom} — abonnement mensuel <span class="chip vio">calculée</span></td><td class="r num">${eur2(m.tarif)}</td></tr>`).join("")}
        <tr><td>Total HT</td><td class="r num">${eur2(ht)}</td></tr>
        <tr><td>TVA 20 %</td><td class="r num">${eur2(tva)}</td></tr>
        <tr><td><b>Total TTC</b></td><td class="r num"><b>${eur2(ttc)}</b></td></tr>
      </table></div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="cta ghost" id="facVoirContrat">Voir le contrat</button>
        <select class="cell" id="facStAbo" style="margin-left:auto;text-align:left;">
          ${Object.keys(STATUTS).map(k=>`<option value="${k}" ${k===statutAbo?"selected":""}>${STATUTS[k][0]}</option>`).join("")}
        </select>
      </div>
      <div class="frs-box v">Cette ligne est déduite du contrat du lieu (onglet précédent) — elle ne se modifie pas ici. Toute correction se fait sur le contrat, jamais sur la facture émise.</div>
    </div>`;
  }
  function wireAbo(){
    document.getElementById("facVoirContrat").onclick = ()=>{ onglet="contrat"; renderPanel(); wireTabsActive(); };
    document.getElementById("facStAbo").onchange = e=>{ statutAbo=e.target.value; };
  }

  function vueCom(){
    const ht = totalComHt(), tva = ht*(TVA_COM/100), ttc = ht+tva;
    return `
    <div class="card">
      ${enteteFacture("BE-2026-09-C01", statutCom)}
      <div style="overflow-x:auto;"><table>
        <tr><th>Soirée</th><th class="r">Commission HT</th></tr>
        ${SOIREES.map(s=>`<tr><td>${s.date} — ${s.evt}</td><td class="r num">${s.comHt!=null?`${eur2(s.comHt)} <span class="chip vio">calculée</span>`:`<span class="chip grey">non calculée</span>`}</td></tr>`).join("")}
        <tr><td>Total HT</td><td class="r num">${eur2(ht)}</td></tr>
        <tr><td>TVA ${TVA_COM} %</td><td class="r num">${eur2(tva)}</td></tr>
        <tr><td><b>Total TTC</b></td><td class="r num"><b>${eur2(ttc)}</b></td></tr>
      </table></div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="cta ghost" id="facVoirDetail">Voir le détail des soirées (Gestion financière)</button>
        <select class="cell" id="facStCom" style="margin-left:auto;text-align:left;">
          ${Object.keys(STATUTS).map(k=>`<option value="${k}" ${k===statutCom?"selected":""}>${STATUTS[k][0]}</option>`).join("")}
        </select>
      </div>
      <div class="frs-box v">Chaque ligne reprend le <code>commission_ht</code> déjà calculé soirée par soirée dans Gestion financière — jamais un second calcul. Seule Bayonne (12/09) a une cascade complète à ce jour (§15.27/§15.41) ; Toulon et Grenoble restent « non calculée » plutôt que comblées par une estimation.</div>
      <div class="frs-box a"><b>Point de vigilance</b> : ce document porte des mentions légales et, la réforme de la facturation électronique s'appliquant, devra à terme être transmis en Factur-X via une Plateforme Agréée — pas de bouton promotionnel sur la pièce comptable elle-même.</div>
    </div>`;
  }
  function wireCom(){
    document.getElementById("facVoirDetail").onclick = ()=>toast("Ouvre le module Gestion financière — détail de la soirée");
    document.getElementById("facStCom").onchange = e=>{ statutCom=e.target.value; };
  }

  function renderPanel(){
    const el = document.getElementById("facPanel");
    if(!el) return;
    if(onglet==="contrat"){ el.innerHTML = vueContrat(); wireContrat(); }
    else if(onglet==="abo"){ el.innerHTML = vueAbo(); wireAbo(); }
